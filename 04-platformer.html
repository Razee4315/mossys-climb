<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0812">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Mossy's Climb - a pixel-art platformer about climbing a very tall mountain.">
<title>Mossy's Climb</title>
<style>
  html, body {
    margin: 0; height: 100%; background: #0a0812; overflow: hidden; overscroll-behavior: none;
    touch-action: none; user-select: none; -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none;
  }
  body { display: flex; align-items: center; justify-content: center; }
  #game {
    display: block; background: #000; outline: none;
    image-rendering: pixelated; image-rendering: crisp-edges;
  }
  @media (pointer: fine) { #game { box-shadow: 0 0 0 1px #1e1a30, 0 20px 60px rgba(0, 0, 0, 0.6); } }

  /* ---------- loading screen ---------- */
  #loader {
    position: fixed; inset: 0; z-index: 20; background: #0a0812;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3vmin;
    transition: opacity 0.45s ease;
  }
  #loader.done { opacity: 0; pointer-events: none; }
  #loader svg { image-rendering: pixelated; display: block; }
  #ld-logo { width: min(70vw, 92vmin); height: auto; }
  #ld-frog { width: 14vmin; height: auto; animation: hop 0.7s ease-in-out infinite; }
  @keyframes hop { 0%, 100% { transform: translateY(0) scale(1.06, 0.94); } 45% { transform: translateY(-3.5vmin) scale(0.94, 1.06); } }
  #ld-shadow { width: 10vmin; height: 1.4vmin; border-radius: 50%; background: rgba(0, 0, 0, 0.45); margin-top: -3vmin; animation: shadow 0.7s ease-in-out infinite; }
  @keyframes shadow { 0%, 100% { transform: scaleX(1); } 45% { transform: scaleX(0.6); opacity: 0.5; } }
  #ld-bar { width: min(56vw, 70vmin); height: 2.2vmin; min-height: 8px; border: 0.5vmin solid #ffd84a; padding: 0.4vmin; box-sizing: border-box; image-rendering: pixelated; }
  #ld-bar i { display: block; height: 100%; width: 4%; background: repeating-linear-gradient(90deg, #7ad85a 0 6px, #5cc24a 6px 12px); transition: width 0.25s ease; }
  #ld-msg { color: #a8a0c0; font: 700 clamp(11px, 2.6vmin, 18px)/1 ui-monospace, Menlo, Consolas, monospace; letter-spacing: 0.15em; text-transform: uppercase; }

  /* ---------- touch controls ---------- */
  #touch { position: fixed; inset: 0; pointer-events: none; display: none; z-index: 5; --s: 1; }
  #touch.show { display: block; }
  .zone { position: absolute; pointer-events: auto; touch-action: none; }
  #z-move { left: 0; bottom: 0; width: 45%; height: 72%; }
  #z-jump { right: 0; bottom: 0; width: 55%; height: 76%; }
  .tb {
    position: absolute; display: flex; align-items: center; justify-content: center;
    width: calc(var(--d) * var(--s)); height: calc(var(--d) * var(--s)); border-radius: 50%;
    color: rgba(255, 255, 255, 0.92); background: rgba(16, 12, 30, 0.38);
    border: 2px solid rgba(255, 255, 255, 0.32); box-sizing: border-box;
    font: 700 calc(20px * var(--s))/1 system-ui, sans-serif; pointer-events: none;
    transition: transform 0.06s, background 0.06s, border-color 0.06s;
  }
  #b-act.show { display: flex; }
  .tb.on { background: rgba(255, 216, 74, 0.42); border-color: #ffd84a; transform: scale(0.92); }
  .tb small { font-size: calc(10px * var(--s)); letter-spacing: 1px; font-weight: 800; }
  #b-left  { --d: 76px; left: calc(16px + env(safe-area-inset-left)); bottom: calc(20px + env(safe-area-inset-bottom)); }
  #b-right { --d: 76px; left: calc(16px + 84px * var(--s) + env(safe-area-inset-left)); bottom: calc(20px + env(safe-area-inset-bottom)); }
  /* not a button: lights up while the movement thumb is slid down (crouch / drop through) */
  #b-down  { --d: 34px; left: calc(16px + 59px * var(--s) + env(safe-area-inset-left)); bottom: calc(26px + 80px * var(--s) + env(safe-area-inset-bottom)); opacity: 0; font-size: calc(14px * var(--s)); }
  #b-down.on { opacity: 1; transform: none; }
  #b-jump  { --d: 92px; right: calc(18px + env(safe-area-inset-right)); bottom: calc(22px + env(safe-area-inset-bottom)); }
  #b-act   { display: none; --d: 66px; right: calc(18px + 100px * var(--s) + env(safe-area-inset-right)); bottom: calc(16px + env(safe-area-inset-bottom)); }
  #b-pause {
    position: absolute; pointer-events: auto; touch-action: none; display: flex; align-items: center; justify-content: center;
    top: calc(8px + env(safe-area-inset-top)); right: calc(10px + env(safe-area-inset-right));
    width: 46px; height: 46px; border-radius: 12px; color: #fff; font: 800 16px/1 system-ui, sans-serif;
    background: rgba(16, 12, 30, 0.45); border: 2px solid rgba(255, 255, 255, 0.3); box-sizing: border-box;
  }
  #b-pause.on { background: rgba(255, 216, 74, 0.45); }

  #rotate {
    display: none; position: fixed; inset: 0; z-index: 30; background: #0a0812; color: #ffd84a;
    font: 700 18px/1.4 system-ui, sans-serif; text-align: center; align-items: center; justify-content: center; padding: 24px;
  }
  @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
</style>
</head>

// =====================================================================

// The view is always 216 pixels tall; its width follows the screen's shape
// (16:9 = 384 up to ~20:9 = 480) so wide phones fill the screen with no bars.
const VH = 216, TS = 16;
const VW = (() => {
  const w = window.innerWidth || 16, h = window.innerHeight || 9;
  const coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
  // phones may boot in portrait before rotating: assume they'll be held sideways
  const ratio = coarse ? Math.max(w, h) / Math.min(w, h) : w / h;
  const v = Math.round((VH * ratio) / 2) * 2;
  return v < 384 ? 384 : v > 480 ? 480 : v;
})();

// ---------- math ----------
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const approach = (v, t, d) => (v < t ? Math.min(v + d, t) : Math.max(v - d, t));
const rand = (a = 0, b = 1) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(a + Math.random() * (b - a + 1));
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const rectHit = (ax, ay, aw, ah, bx, by, bw, bh) => ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
const boxHit = (a, b) => rectHit(a.x, a.y, a.w, a.h, b.x, b.y, b.w, b.h);
const easeOutCubic = (t) => 1 - Math.pow(1 - t, 3);
const easeInOut = (t) => -(Math.cos(Math.PI * t) - 1) / 2;
const easeOutBack = (t) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };

function mulberry32(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function hexToRgb(hex) {
  const n = parseInt(hex.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function rgbToHex(r, g, b) {
  return '#' + [r, g, b].map((v) => clamp(Math.round(v), 0, 255).toString(16).padStart(2, '0')).join('');
}
function mixColor(a, b, t) {
  const A = hexToRgb(a), B = hexToRgb(b);
  return rgbToHex(lerp(A[0], B[0], t), lerp(A[1], B[1], t), lerp(A[2], B[2], t));
}
function shade(hex, amt) { return amt >= 0 ? mixColor(hex, '#ffffff', amt) : mixColor(hex, '#000000', -amt); }

function formatTime(sec, withMs = true) {
  if (sec == null || !isFinite(sec)) return '--:--';
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  const cs = Math.floor((sec % 1) * 100);
  const base = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
  return withMs ? `${base}.${String(cs).padStart(2, '0')}` : base;
}

// ---------- save data ----------
const SAVE_KEY = 'mossys-climb-save-v2';
const Save = {
  data: null,
  defaults() {
    return {
      version: 2,
      unlocked: 1,
      char: 'mossy',
      secret: false,
      seenIntro: false,
      levels: {},
      totalDeaths: 0,
      settings: { music: 0.55, sfx: 0.8, shake: true, timer: true, assist: false, touch: 'auto', touchSize: 1, vibrate: true },
    };
  },
  load() {
    let d = null;
    try { d = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); } catch (e) { d = null; }
    const def = this.defaults();
    if (!d || typeof d !== 'object') d = def;
    for (const k in def) if (!(k in d)) d[k] = def[k];
    for (const k in def.settings) if (!(k in d.settings)) d.settings[k] = def.settings[k];
    this.data = d;
  },
  write() {
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(this.data)); } catch (e) { /* storage unavailable */ }
  },
  level(i) {
    if (!this.data.levels[i]) this.data.levels[i] = { done: false, best: null, gems: [], deaths: 0, stars: [false, false, false] };
    return this.data.levels[i];
  },
  reset() {
    const keepSettings = this.data.settings;
    this.data = this.defaults();
    this.data.settings = keepSettings;
    this.write();
  },
};
Save.load();
const settings = () => Save.data.settings;

// ---------- input ----------
const Input = (() => {

    left: ['ArrowLeft', 'KeyA'],
    right: ['ArrowRight', 'KeyD'],
    up: ['ArrowUp', 'KeyW'],
    down: ['ArrowDown', 'KeyS'],
    jump: ['Space', 'KeyZ', 'KeyK', 'ArrowUp', 'KeyW'],
    action: ['KeyX', 'KeyJ', 'KeyC', 'ShiftLeft', 'ShiftRight'],
    confirm: ['Enter', 'NumpadEnter', 'Space', 'KeyZ'],
    back: ['Escape', 'Backspace', 'KeyX'],
    pause: ['Escape', 'KeyP', 'Enter'],
    retry: ['KeyR'],
    mute: ['KeyM'],
    fullscreen: ['KeyF'],
  };
  const PADMAP = {
    left: [14], right: [15], up: [12], down: [13],
    jump: [0], action: [2, 1, 5, 7], confirm: [0], back: [1], pause: [9], retry: [8],
    mute: [], fullscreen: [],

  const keyLatch = new Set();
  const touchState = {};
  const touchLatch = new Set();

  // the last poll; swipe: {dx, dy} for one poll after a drag ends (all in game pixels)

    if (e.isTrusted) device = 'kb';

  document.addEventListener('visibilitychange', () => { if (document.hidden) { keysDown.clear(); for (const k in touchState) touchState[k] = false; } });

  // bars beside the canvas still count (clamped to the nearest edge). A mouse clicks on press;
  // a finger "clicks" on release, and only if it didn't drag, so lists can be swiped.
  const DRAG_PX = 10;

  // forgiving zones: the left 45% is movement (left/right decided by which side of the gap
  // between the two arrows the thumb is on, so it can rock or slide between them), and the
  // whole lower right is JUMP except the power button (only for climbers whose power needs
  // one). There is no DOWN button: sliding the movement thumb down from where it landed holds
  // DOWN (crouch / look down, and with JUMP drops through planks). Every touch is re-evaluated

// =====================================================================
//  ART — pixel sprites (auto-outlined), characters, enemies, items
// =====================================================================
function newCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

function flipCanvas(src) {
  const c = newCanvas(src.width, src.height);
  const g = c.getContext('2d');
  g.translate(src.width, 0); g.scale(-1, 1); g.drawImage(src, 0, 0);
  return c;
}

function silhouette(src, color) {
  const c = newCanvas(src.width, src.height);
  const g = c.getContext('2d');
  g.drawImage(src, 0, 0);
  g.globalCompositeOperation = 'source-in';
  g.fillStyle = color; g.fillRect(0, 0, c.width, c.height);
  return c;
}

// Sprite from rows of palette letters. 1px transparent padding holds the auto-outline.
function makeSprite(rows, pal, outline = '#1a1428', name = '?') {
  const h = rows.length, w = rows[0].length;
  rows.forEach((r, i) => { if (r.length !== w) throw new Error(`sprite ${name} row ${i} width ${r.length} != ${w}`); });
  const W = w + 2, H = h + 2;
  const c = newCanvas(W, H);
  const g = c.getContext('2d');
  const img = g.createImageData(W, H);
  const d = img.data;
  const filled = new Uint8Array(W * H);
  const put = (i, hex, a = 255) => { const [r, gg, b] = hexToRgb(hex); d[i * 4] = r; d[i * 4 + 1] = gg; d[i * 4 + 2] = b; d[i * 4 + 3] = a; };
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const ch = rows[y][x];
    if (ch === '.') continue;
    const col = pal[ch];
    if (!col) throw new Error(`sprite ${name}: no colour for '${ch}'`);
    const i = (y + 1) * W + (x + 1);
    put(i, col); filled[i] = 1;
  }
  if (outline) {
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const i = y * W + x;
      if (filled[i]) continue;
      if ((x > 0 && filled[i - 1] === 1) || (x < W - 1 && filled[i + 1] === 1) || (y > 0 && filled[i - W] === 1) || (y < H - 1 && filled[i + W] === 1)) {
        put(i, outline); filled[i] = 2;
      }
    }
  }
  g.putImageData(img, 0, 0);
  return wrapSprite(c);
}
function wrapSprite(c) {
  return { c, f: flipCanvas(c), w: c.width, h: c.height, _wh: null, _whf: null };
}
function whiteOf(s, flip) {
  if (!s._wh) { s._wh = silhouette(s.c, '#ffffff'); s._whf = flipCanvas(s._wh); }
  return flip ? s._whf : s._wh;
}
// draw sprite with its top-left (inner, unpadded) at x,y
function spr(s, x, y, flip = false, g = ctx) { g.drawImage(flip ? s.f : s.c, Math.round(x) - 1, Math.round(y) - 1); }

function composeChar(def, bob, legKey) {
  const rows = Array.from({ length: 17 }, () => '................'.split(''));
  LEGS[def.legs][legKey].forEach((r, i) => { for (let x = 0; x < 16; x++) if (r[x] !== '.') rows[14 + i][x] = r[x]; });
  BODIES[def.body].forEach((r, i) => {
    const y = 1 + bob + i;
    if (y < 0 || y > 16) return;
    for (let x = 0; x < 16; x++) if (r[x] !== '.') rows[y][x] = r[x];
  });
  return rows.map((r) => r.join(''));
}
function buildCharFrames(def) {
  const mk = (bob, legs) => makeSprite(composeChar(def, bob, legs), def.pal, def.outline, def.id);
  return {
    idle: [mk(0, 'stand'), mk(1, 'stand')],
    run: [mk(0, 'runA'), mk(-1, 'runB'), mk(0, 'runA'), mk(-1, 'runB')],
    jump: mk(-1, 'jump'), fall: mk(0, 'fall'), crouch: mk(1, 'jump'),
  };
}

// Boss frames: far wing (dark) + body + near wing, 40x30 canvas
function buildBossFrames(pal) {
  const S = SPRITE_ROWS;
  const farPal = { ...pal, A: pal.a, h: pal.A, a: '#0c0c18' };
  const out = {};
  const body = makeSprite(S.bossBody, pal, '#0c0c18', 'bossBody');
  const wings = { up: S.wingUp, mid: S.wingMid, down: S.wingDown };
  const stunnedPal = { ...pal, w: pal.k, r: pal.k };
  const stunBody = makeSprite(S.bossBody, stunnedPal, '#0c0c18', 'bossStun');
  for (const k in wings) {
    const near = makeSprite(wings[k], pal, '#0c0c18', 'wing');
    const far = makeSprite(wings[k], farPal, '#0c0c18', 'wingFar');
    const build = (b) => {
      const c = newCanvas(42, 32); const g = c.getContext('2d');
      g.drawImage(far.c, 9, 6 + (k === 'up' ? -2 : 0));
      g.drawImage(b.c, 8, 10);
      g.drawImage(near.c, 4, 8 + (k === 'up' ? -4 : 0));
      return wrapSprite(c);
    };
    out[k] = build(body);
    if (k === 'down') out.stun = build(stunBody);
  }
  return out;
}

function buildCrusher(angry) {
  const c = newCanvas(34, 34); const g = c.getContext('2d');
  const R = (x, y, w, h, col) => { g.fillStyle = col; g.fillRect(x + 1, y + 1, w, h); };
  R(0, 0, 32, 32, '#2a2438');
  R(1, 1, 30, 30, '#7d7690');
  R(1, 1, 30, 2, '#a59ebb');
  R(1, 1, 2, 30, '#958eaa');
  R(29, 3, 2, 28, '#5a536c');
  R(3, 29, 28, 2, '#5a536c');
  // bricks
  g.fillStyle = '#5a536c';
  for (const [x, y, w] of [[6, 8, 7], [20, 6, 6], [4, 22, 6], [22, 24, 6]]) g.fillRect(x + 1, y + 1, w, 1);
  // spikes on the bottom
  for (let i = 0; i < 4; i++) {
    R(3 + i * 7, 31, 6, 1, '#cfd6e4');
  }
  // face
  if (angry) {
    R(6, 9, 7, 2, '#2a2438'); R(19, 9, 7, 2, '#2a2438');
    R(7, 11, 5, 5, '#ffffff'); R(20, 11, 5, 5, '#ffffff');
    R(9, 12, 3, 3, '#ff3a5a'); R(20, 12, 3, 3, '#ff3a5a');
    R(9, 20, 14, 5, '#2a2438'); R(10, 21, 2, 2, '#ffffff'); R(14, 21, 2, 2, '#ffffff'); R(18, 21, 2, 2, '#ffffff');
  } else {

function buildBoulder(r, base, dark, light) {
  const frames = [];
  for (let f = 0; f < 8; f++) {
    const d = r * 2 + 2;
    const c = newCanvas(d + 2, d + 2); const g = c.getContext('2d');
    const cx = r + 1.5, cy = r + 1.5;
    for (let y = 0; y < d; y++) for (let x = 0; x < d; x++) {
      const dx = x - cx + 0.5, dy = y - cy + 0.5;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist > r + 0.5) continue;
      let col = base;
      if (dist > r - 1) col = '#1a1428';
      else if (dx + dy > r * 0.7) col = dark;
      else if (dx + dy < -r * 0.6) col = light;
      g.fillStyle = col; g.fillRect(x + 1, y + 1, 1, 1);
    }
    // rotating cracks
    const ang = (f / 8) * Math.PI * 2;
    g.fillStyle = dark;
    for (const off of [0, 2.1, 4.2]) {
      for (let t = 2; t < r - 2; t++) {
        const a = ang + off + t * 0.08;
        g.fillRect(Math.round(cx + Math.cos(a) * t) + 1, Math.round(cy + Math.sin(a) * t) + 1, 1, 1);
      }
    }
    frames.push(wrapSprite(c));
  }
  return frames;
}

  ];
  return makeSprite(rows, { Y: '#ffcf3a', y: '#d07a10', h: '#fff4b0', w: '#ffffff' }, '#3a2008', 'dawnGem');

function buildCloud(w, h, seed) {
  const c = newCanvas(w, h); const g = c.getContext('2d');
  const rng = mulberry32(seed * 97);
  const puffs = [];
  for (let i = 0; i < 5; i++) puffs.push({ x: 6 + rng() * (w - 12), y: h * 0.55 + rng() * h * 0.2, r: h * (0.3 + rng() * 0.25) });
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    let inside = false, top = false;
    for (const p of puffs) {
      const dx = x - p.x, dy = y - p.y;
      if (dx * dx + dy * dy <= p.r * p.r) { inside = true; if (dy < -p.r * 0.35) top = true; }
    }
    if (y > h - 3) inside = inside && x > 3 && x < w - 3;
    if (inside) { g.fillStyle = top ? '#ffffff' : (y > h * 0.7 ? '#c8d8f0' : '#eef4ff'); g.fillRect(x, y, 1, 1); }
  }
  return c;
}

function hash2(x, y, s = 0) {
  let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) + Math.imul(s | 0, 1442695041)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
const _u32 = {};
function toU32(hex) {
  if (_u32[hex] !== undefined) return _u32[hex];
  const [r, g, b] = hexToRgb(hex);
  return (_u32[hex] = ((255 << 24) | (b << 16) | (g << 8) | r) >>> 0);
}

// A pixel buffer we can paint into and turn into a canvas
function PixBuf(w, h) {
  const c = newCanvas(w, h);
  const g = c.getContext('2d');
  const img = g.createImageData(w, h);
  const buf = new Uint32Array(img.data.buffer);
  return {
    w, h, c,
    put(x, y, hex) { x |= 0; y |= 0; if (x >= 0 && y >= 0 && x < w && y < h) buf[y * w + x] = toU32(hex); },
    rect(x, y, rw, rh, hex) { for (let j = 0; j < rh; j++) for (let i = 0; i < rw; i++) this.put(x + i, y + j, hex); },
    clear(x, y) { if (x >= 0 && y >= 0 && x < w && y < h) buf[y * w + x] = 0; },
    isEmpty(x, y) { return x < 0 || y < 0 || x >= w || y >= h || buf[y * w + x] === 0; },
    done() { g.putImageData(img, 0, 0); return c; },
  };
}

const SOLID_ART = new Set(['#', 'X', '%']);

function basePixel(th, wx, wy) {
  if (th.pattern === 'brick') {
    const row = Math.floor(wy / 8);
    const bx = wx + (row % 2) * 8;
    if (wy % 8 === 7 || bx % 16 === 15) return th.mortar;
    const tone = hash2(Math.floor(bx / 16), row, 11);
    let col = tone < 0.25 ? th.dark : tone > 0.8 ? th.light : th.base;
    if (wy % 8 === 0) col = shade(col, 0.12);
    const n = hash2(wx, wy, 4);
    if (n < 0.05) col = shade(col, -0.15);
    return col;
  }
  if (th.pattern === 'rock') {
    const band = hash2(wx >> 3, wy >> 2, 3);
    let col = band < 0.28 ? th.dark : band > 0.82 ? th.light : th.base;
    const n = hash2(wx >> 1, wy >> 1, 5);
    if (n < 0.07) col = th.dark; else if (n > 0.96) col = th.light;
    return col;
  }
  // dirt with pebbles
  const n = hash2(wx >> 1, wy >> 1, 1);
  let col = n < 0.1 ? th.dark : n > 0.93 ? th.light : th.base;
  const cx = wx >> 3, cy = wy >> 3;
  if (hash2(cx, cy, 7) < 0.22) {
    const px = cx * 8 + 1 + Math.floor(hash2(cx, cy, 8) * 4), py = cy * 8 + 1 + Math.floor(hash2(cx, cy, 9) * 4);
    if (wx >= px && wx < px + 3 && wy >= py && wy < py + 2) col = wy === py + 1 ? th.dark : th.stone || th.light;
  }
  return col;
}

function capDepth(th, wx) {
  if (th.cap === 'snow') return 4 + Math.floor(hash2(wx >> 2, 0, 21) * 2.5);
  if (th.cap === 'stone') return 2 + Math.floor(hash2(wx >> 1, 0, 22) * 2);
  return 3 + Math.floor(hash2(wx >> 1, 0, 23) * 3);
}

// Paint one solid tile. P(x,y,hex) paints in tile-local coords; nb = neighbour solidity.
function paintSolid(P, Pclear, th, cx, cy, nb, cracked) {
  const ox = cx * TS, oy = cy * TS;
  for (let y = 0; y < TS; y++) for (let x = 0; x < TS; x++) {
    const wx = ox + x, wy = oy + y;
    // rounded outer corners
    if (!nb.u && !nb.l && ((x === 0 && y < 2) || (x === 1 && y === 0))) { Pclear(x, y); continue; }
    if (!nb.u && !nb.r && ((x === 15 && y < 2) || (x === 14 && y === 0))) { Pclear(x, y); continue; }
    if (!nb.d && !nb.l && ((x === 0 && y > 13) || (x === 1 && y === 15))) { Pclear(x, y); continue; }
    if (!nb.d && !nb.r && ((x === 15 && y > 13) || (x === 14 && y === 15))) { Pclear(x, y); continue; }
    let col = basePixel(th, wx, wy);
    if (!nb.l && x === 1) col = shade(col, 0.1);
    if (!nb.r && x === 14) col = shade(col, -0.18);
    if (!nb.d && y === 14) col = shade(col, -0.2);
    if (!nb.l && x === 0) col = th.edge;
    if (!nb.r && x === 15) col = th.edge;
    if (!nb.d && y === 15) col = th.edge;
    if (!nb.u) {
      const d = capDepth(th, wx);
      if (y < d) {
        col = y === 0 ? th.topHi : y === d - 1 ? th.topDark : th.top;
        if (th.cap === 'grass' && y > 0 && y < d - 1 && hash2(wx, wy, 31) < 0.12) col = th.topHi;
        if ((!nb.l && x === 0) || (!nb.r && x === 15)) col = th.topDark;
      } else if (y === d && th.cap !== 'stone') col = shade(col, -0.25);
    } else if (!nb.l && x < 2 && !nb.ul) {
      // keep side edge
    }
    // inner shadow below an overhang
    if (nb.u && !nb.ul && nb.l && x === 0 && y === 0) col = shade(col, -0.2);
    P(x, y, col);
  }
  if (th.cracks && hash2(cx, cy, 41) < 0.4) {
    let x = 2 + Math.floor(hash2(cx, cy, 42) * 12), y = nb.u ? 1 : 5;
    const len = 5 + Math.floor(hash2(cx, cy, 43) * 7);
    for (let i = 0; i < len && y < 15; i++) {
      P(x, y, '#ff7a1a'); if (x + 1 < 15) P(x + 1, y, '#8a2a12');
      y++; x = clamp(x + Math.round(hash2(cx * 7 + i, cy, 44) * 2 - 1), 1, 14);
    }
  }
  if (cracked) {
    const cxp = 6 + Math.floor(hash2(cx, cy, 51) * 4);
    for (const [dx, dy] of [[0, 0], [1, 1], [1, 2], [2, 3], [1, 4], [-1, 2]]) P(cxp + dx, 5 + dy, th.edge);
  }
}

function paintSpike(P, dir) {

  for (let x = 0; x < 16; x++) { draw(x, 15, '#4a5064'); draw(x, 14, '#7a8296'); }
  for (let i = 0; i < 4; i++) {

      const half = ((y - 7) / 6) * 2;

// Small decorations sitting on top of ground (drawn into the empty cell above)

function pick2(arr, r) { return arr[Math.floor(r * arr.length) % arr.length]; }

function paintUnder(B, kind, x, y, seed, lights) {

  switch (kind) {
    case 'roots': for (let i = 0; i < len - 1; i++) B.put(x + (i > 2 ? 1 : 0), y + i, '#5a3a20'); break;
    case 'vines': for (let i = 0; i < len + 3; i++) { B.put(x, y + i, '#3a8a3a'); if (i % 3 === 1) B.put(x + 1, y + i, '#6ac85a'); } break;
    case 'stalactites': for (let i = 0; i < len; i++) { const w = Math.max(1, 3 - i); B.rect(x - (w >> 1), y + i, w, 1, i === 0 ? '#5f577c' : '#4a4262'); } break;
    case 'icicles': for (let i = 0; i < len; i++) { const w = Math.max(1, 3 - Math.floor(i / 2)); B.rect(x - (w >> 1), y + i, w, 1, i < 2 ? '#ffffff' : '#b8e4ff'); } break;
    case 'drips': for (let i = 0; i < Math.min(len, 4); i++) B.put(x, y + i, i === Math.min(len, 4) - 1 ? '#ffd25a' : '#ff7a1a'); lights.push({ x, y: y + 2, r: 12, col: 'orange' }); break;
    case 'chains': for (let i = 0; i < len + 4; i++) B.put(x, y + i, i % 2 ? '#5a6276' : '#9aa4b8'); break;
  }

// Bake the static terrain of a level into one canvas.
function buildLevelArt(L) {
  const th = THEMES[L.theme];
  const W = L.w * TS, H = L.h * TS;
  const B = PixBuf(W, H);
  const lights = [];
  const at = (cx, cy) => (cx < 0 || cy < 0 || cx >= L.w || cy >= L.h ? '#' : L.rows[cy][cx]);
  const solid = (cx, cy) => SOLID_ART.has(at(cx, cy));
  const nbOf = (cx, cy, fn) => ({
    u: fn(cx, cy - 1), d: fn(cx, cy + 1), l: fn(cx - 1, cy), r: fn(cx + 1, cy),
    ul: fn(cx - 1, cy - 1), ur: fn(cx + 1, cy - 1),
  });
  const openAbove = (ch) => !SOLID_ART.has(ch) && ch !== 'I' && ch !== '=' && ch !== 'L' && !'^v<>'.includes(ch);
  // enclosed pockets (secret caves, rooms behind fake walls) get a dark back wall
  if (th.backwall !== false) {
    const outside = new Uint8Array(L.w * L.h);
    const stack = [];
    const blocks = (c) => SOLID_ART.has(c) || c === 'I';
    for (let x = 0; x < L.w; x++) if (!blocks(at(x, 0))) { outside[x] = 1; stack.push(x); }
    while (stack.length) {
      const i = stack.pop(), x = i % L.w, y = (i / L.w) | 0;
      for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        const nx = x + dx, ny = y + dy;
        if (nx < 0 || ny < 0 || nx >= L.w || ny >= L.h) continue;
        const j = ny * L.w + nx;
        if (!outside[j] && !blocks(at(nx, ny))) { outside[j] = 1; stack.push(j); }
      }
    }
    for (let cy = 0; cy < L.h; cy++) for (let cx = 0; cx < L.w; cx++) {
      if (outside[cy * L.w + cx] || SOLID_ART.has(at(cx, cy)) || at(cx, cy) === 'I') continue;
      for (let y = 0; y < TS; y++) for (let x = 0; x < TS; x++) {
        const wx = cx * TS + x, wy = cy * TS + y;
        B.put(wx, wy, shade(basePixel(th, wx, wy), solid(cx, cy - 1) && y < 3 ? -0.72 : -0.58));
      }
    }
  }
  for (let cy = 0; cy < L.h; cy++) for (let cx = 0; cx < L.w; cx++) {
    const ch = at(cx, cy);
    const ox = cx * TS, oy = cy * TS;
    const P = (x, y, col) => B.put(ox + x, oy + y, col);
    const Pc = (x, y) => B.clear(ox + x, oy + y);
    if (ch === '#') {
      const nb = nbOf(cx, cy, solid);
      paintSolid(P, Pc, th, cx, cy, nb, false);
      // grass blades poking above the surface
      if (!nb.u && openAbove(at(cx, cy - 1))) {
        if (th.cap === 'grass') for (let x = 0; x < 16; x++) if (hash2(ox + x, oy, 61) < 0.28) { B.put(ox + x, oy - 1, th.top); if (hash2(ox + x, oy, 62) < 0.4) B.put(ox + x, oy - 2, th.topHi); }
        if (th.cap === 'snow') for (let x = 1; x < 15; x++) if (hash2(ox + x, oy, 63) < 0.2) B.put(ox + x, oy - 1, '#ffffff');
        if (hash2(cx, cy, 71) < th.decoRate && at(cx, cy - 1) === '.') {
          const kind = th.deco[Math.floor(hash2(cx, cy, 72) * th.deco.length)];
          paintDeco(B, kind, ox + 2 + Math.floor(hash2(cx, cy, 73) * 7), oy, cx * 31 + cy, lights);
        }
      }
      if (!nb.d && openAbove(at(cx, cy + 1)) && at(cx, cy + 1) !== '=') {
        for (let x = 2; x < 14; x++) if (hash2(ox + x, oy, 81) < 0.09) paintUnder(B, th.under, ox + x, oy + 16, 5, lights);
      }
    } else if (ch === 'I') {
      paintIce(P, nbOf(cx, cy, (x, y) => at(x, y) === 'I' || solid(x, y)));
    } else if (ch === '=') {
      paintPlank(P, th.plank);
    } else if ('^v<>'.includes(ch)) {
      paintSpike(P, ch);
    }
  }
  return { canvas: B.done(), lights };
}

// Canvas for a single collapsing tile (looks like ground, with a faint crack)
function buildTileCanvas(L, cx, cy, cracked) {
  const th = THEMES[L.theme];
  const B = PixBuf(TS, TS);
  const at = (x, y) => (x < 0 || y < 0 || x >= L.w || y >= L.h ? '#' : L.rows[y][x]);
  const solid = (x, y) => SOLID_ART.has(at(x, y));
  const nb = { u: solid(cx, cy - 1), d: solid(cx, cy + 1), l: solid(cx - 1, cy), r: solid(cx + 1, cy), ul: solid(cx - 1, cy - 1), ur: solid(cx + 1, cy - 1) };
  paintSolid((x, y, c) => B.put(x, y, c), (x, y) => B.clear(x, y), th, cx, cy, nb, cracked);
  return B.done();
}

// Fully-enclosed rock tile, used to fill the view beyond a level's left/right edge
function buildWallTile(themeId) {
  const th = THEMES[themeId];
  const B = PixBuf(32, 32);
  for (let y = 0; y < 32; y++) for (let x = 0; x < 32; x++) B.put(x, y, shade(basePixel(th, x + 4096, y + 4096), -0.25));
  return B.done();
}

// Crumble block, moving platform and stalactite art per theme
function buildThemeProps(themeId) {
  const th = THEMES[themeId];
  const B = PixBuf(TS, TS);
  for (let y = 0; y < 14; y++) for (let x = 0; x < 16; x++) {
    let col = hash2(x >> 1, y >> 1, 91) < 0.18 ? shade(th.stone, -0.25) : th.stone;
    if (y === 0) col = shade(th.stone, 0.35);
    if (y === 13 || x === 0 || x === 15) col = shade(th.stone, -0.5);
    B.put(x, y, col);
  }
  for (const [x, y] of [[4, 2], [5, 3], [5, 4], [6, 5], [10, 6], [11, 7], [10, 8], [9, 9], [3, 9], [4, 10]]) B.put(x, y, shade(th.stone, -0.55));
  const crumble = B.done();

  const plat = PixBuf(32, 8);
  const pc = { wood: ['#f0c488', '#c88a4a', '#7a4a20'], stone: ['#b0a8cc', '#7a7296', '#3e3854'], metal: ['#d8e0f0', '#8a94ac', '#3c4458'], ice: ['#ffffff', '#a8dcff', '#4a88c0'] }[th.plank];
  for (let x = 0; x < 32; x++) {
    plat.put(x, 0, pc[0]); for (let y = 1; y < 5; y++) plat.put(x, y, pc[1]); plat.put(x, 5, pc[2]);
    if (x % 8 === 7) for (let y = 1; y < 5; y++) plat.put(x, y, pc[2]);
  }
  for (const x of [1, 2, 29, 30]) { plat.put(x, 2, '#ffd84a'); plat.put(x, 3, '#c98a1c'); }
  plat.rect(6, 6, 3, 2, pc[2]); plat.rect(23, 6, 3, 2, pc[2]);
  const platform = wrapSprite(plat.done());

  const stalPal = { A: th.stone, a: shade(th.stone, -0.4), h: shade(th.stone, 0.4) };
  const stal = makeSprite(SPRITE_ROWS.stalactite, themeId === 'ice' ? { A: '#b8e4ff', a: '#5aa0d8', h: '#ffffff' } : stalPal, '#141020', 'stal');
  return { crumble, platform, stal };
}

// ---------------------------------------------------------------------
//  Parallax backgrounds
// ---------------------------------------------------------------------
function periodicNoise(rng, n) {
  const pts = Array.from({ length: n }, () => rng());
  return (x) => {
    const xf = ((x % n) + n) % n;
    const i = Math.floor(xf), f = xf - i;
    const t = (1 - Math.cos(f * Math.PI)) / 2;
    return lerp(pts[i], pts[(i + 1) % n], t);
  };
}

function ridgeLayer(W, H, seed, o) {
  const rng = mulberry32(seed);
  const n1 = periodicNoise(rng, o.freq || 6), n2 = periodicNoise(rng, (o.freq || 6) * 3);
  const B = PixBuf(W, H);
  const hts = [];
  for (let x = 0; x < W; x++) {
    let v = n1((x / W) * (o.freq || 6)) * 0.7 + n2((x / W) * (o.freq || 6) * 3) * 0.3;
    if (o.sharp) v = Math.pow(v, 1.6);
    hts.push(Math.floor(o.base + v * o.amp));
  }
  // light comes from the left: faces that descend to the right are in shadow
  const shadowCol = [];
  // hysteresis keeps each face one solid region instead of flickering stripes
  let inShadow = false;
  for (let i = 0; i < W * 2; i++) {
    const x = i % W, d = hts[(x + 6) % W] - hts[(x - 6 + W) % W];
    if (inShadow && d > 0) inShadow = false;
    else if (!inShadow && d < -4) inShadow = true;
    if (i >= W) shadowCol[x] = inShadow;
  }
  for (let x = 0; x < W; x++) {
    const top = H - hts[x];
    const sh = shadowCol[x];
    const snowLine = o.base + o.amp * 0.5;
    for (let y = Math.max(0, top); y < H; y++) {
      let col = sh ? o.shadow || shade(o.color, -0.15) : o.color;
      if (o.snow && hts[x] > snowLine && y < top + Math.min(14, hts[x] - snowLine) + ((x * 7) % 3)) col = sh ? o.snowShadow : o.snow;
      if (y === top && o.rim) col = o.rim;
      B.put(x, y, col);
    }
  }
  return B.done();
}

function treeLayer(W, H, seed, o) {
  const rng = mulberry32(seed);
  const B = PixBuf(W, H);
  const groundH = o.ground || 8;
  B.rect(0, H - groundH, W, groundH, o.color);
  let x = 0;
  while (x < W) {
    const kind = o.kinds[Math.floor(rng() * o.kinds.length)];
    const th = o.minH + Math.floor(rng() * (o.maxH - o.minH));
    const base = H - groundH + 1;
    if (kind === 'pine') {
      const w = Math.floor(th * 0.45);
      for (let y = 0; y < th; y++) {
        const half = Math.floor(((y % Math.floor(th / 3 + 1)) + y * 0.35) * (w / th) + 1);
        for (let i = -half; i <= half; i++) B.put(((x + i) % W + W) % W, base - th + y, o.color);
      }
      if (o.snow) for (let i = -1; i <= 1; i++) B.put(x + i, base - th + 1, o.snow);
    } else if (kind === 'round') {
      B.rect(x - 1, base - th * 0.5, 3, th * 0.5, o.trunk || o.color);
      const r = Math.floor(th * 0.38);
      for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) if (dx * dx + dy * dy <= r * r) B.put(((x + dx) % W + W) % W, base - th + r + dy, o.color);
    } else if (kind === 'pillar') {
      const w = 10 + Math.floor(rng() * 6);
      B.rect(x, base - th, w, th, o.color);
      B.rect(x - 2, base - th, w + 4, 3, o.color);
      if (rng() < 0.5) B.rect(x - 2, base - th - 4 - Math.floor(rng() * 6), Math.floor(w / 2), 4, o.color);
      for (let y = base - th + 6; y < base; y += 6) B.rect(x + 2, y, 1, 3, shade(o.color, -0.2));
    } else if (kind === 'arch') {
      const w = 34;
      B.rect(x, base - th, 8, th, o.color); B.rect(x + w - 8, base - th, 8, th, o.color);
      for (let i = 0; i < w; i++) { const a = Math.sin((i / w) * Math.PI) * 10; B.rect(x + i, base - th - Math.floor(a), 1, 8, o.color); }
    } else if (kind === 'tower') {
      const w = 14 + Math.floor(rng() * 8);
      B.rect(x, base - th, w, th, o.color);
      for (let i = 0; i < w; i += 4) B.rect(x + i, base - th - 3, 2, 3, o.color);
      for (let y = base - th + 8; y < base - 6; y += 10) if (rng() < 0.6) B.rect(x + 3 + Math.floor(rng() * (w - 6)), y, 2, 3, o.window || '#ffd84a');
    } else if (kind === 'spire') {
      for (let y = 0; y < th; y++) { const half = Math.floor((y / th) * 6); B.rect(x - half, base - th + y, half * 2 + 1, 1, o.color); }
    } else if (kind === 'bush') {
      const r = Math.floor(th * 0.5);
      for (let dy = -r; dy <= 0; dy++) for (let dx = -r * 2; dx <= r * 2; dx++) if ((dx * dx) / 4 + dy * dy <= r * r) B.put(((x + dx) % W + W) % W, base + dy - 1, o.color);
    }
    x += o.gapMin + Math.floor(rng() * (o.gapMax - o.gapMin));
  }
  return B.done();
}

function caveLayer(W, H, seed, o) {
  const rng = mulberry32(seed);
  const B = PixBuf(W, H);
  const top = periodicNoise(rng, 10), bot = periodicNoise(rng, 8);
  for (let x = 0; x < W; x++) {
    const t = Math.floor(10 + top((x / W) * 10) * 30), b = Math.floor(14 + bot((x / W) * 8) * 34);
    for (let y = 0; y < t; y++) B.put(x, y, o.color);
    for (let y = H - b; y < H; y++) B.put(x, y, o.color);
  }
  for (let i = 0; i < 26; i++) {
    const x = Math.floor(rng() * W), len = 10 + Math.floor(rng() * 40), up = rng() < 0.5;
    for (let j = 0; j < len; j++) { const w = Math.max(1, Math.floor((1 - j / len) * 5)); B.rect(x - (w >> 1), up ? 30 + j : H - 40 - j, w, 1, o.color); }
  }
  if (o.glow) for (let i = 0; i < 30; i++) B.put(Math.floor(rng() * W), Math.floor(rng() * H), pick2(o.glow, rng()));
  return B.done();
}

function buildBackground(themeId) {
  const W = 512;
  const out = { layers: [], stars: false };
  const L = (c, f, yOff = 0, anchor = 'bottom') => out.layers.push({ c, f, yOff, anchor });
  switch (themeId) {
    case 'meadow':
      L(ridgeLayer(W, 170, 11, { base: 30, amp: 135, color: '#7a88d0', shadow: '#6672bc', snow: '#f4f8ff', snowShadow: '#c8d4f0', sharp: true, freq: 5 }), 0.06, 10);
      L(ridgeLayer(W, 90, 12, { base: 26, amp: 40, color: '#5aa860', shadow: '#4a9852', rim: '#7ac878', freq: 4 }), 0.2, 6);
      L(treeLayer(W, 70, 13, { color: '#2f7a40', trunk: '#2a5a30', kinds: ['round', 'round', 'pine', 'bush'], minH: 26, maxH: 54, gapMin: 18, gapMax: 46, ground: 10 }), 0.42, 4);
      break;
    case 'forest':
      L(ridgeLayer(W, 130, 21, { base: 40, amp: 70, color: '#2f5a5a', shadow: '#28504f', freq: 5 }), 0.06, 10);
      L(treeLayer(W, 130, 22, { color: '#1f4a3c', kinds: ['pine', 'pine', 'round'], minH: 60, maxH: 110, gapMin: 14, gapMax: 30, ground: 10 }), 0.22, 6);
      L(treeLayer(W, 150, 23, { color: '#12302a', trunk: '#12302a', kinds: ['pine', 'round', 'pine'], minH: 80, maxH: 140, gapMin: 30, gapMax: 70, ground: 12 }), 0.45, 4);
      break;
    case 'cave':
      L(caveLayer(W, 216, 31, { color: '#1a1528', glow: ['#5af0ff', '#c08aff', '#3a6a8a'] }), 0.15, 0, 'center');
      L(caveLayer(W, 216, 32, { color: '#120e1c' }), 0.35, 0, 'center');
      break;
    case 'magma':
      L(caveLayer(W, 216, 41, { color: '#2a0e10', glow: ['#ff7a1a', '#ffd25a'] }), 0.15, 0, 'center');
      L(caveLayer(W, 216, 42, { color: '#1a0708' }), 0.35, 0, 'center');
      break;
    case 'ruins':
      L(ridgeLayer(W, 140, 51, { base: 40, amp: 80, color: '#c0708a', shadow: '#a85e78', freq: 4 }), 0.06, 10);
      L(treeLayer(W, 110, 52, { color: '#a8705e', kinds: ['pillar', 'arch', 'pillar', 'pillar'], minH: 40, maxH: 90, gapMin: 30, gapMax: 70, ground: 12 }), 0.22, 6);
      L(treeLayer(W, 60, 53, { color: '#5a6a3a', kinds: ['bush', 'bush', 'round'], minH: 16, maxH: 40, gapMin: 20, gapMax: 50, ground: 8 }), 0.45, 4);
      break;
    case 'ice':
      L(ridgeLayer(W, 160, 61, { base: 60, amp: 95, color: '#9ab8e0', shadow: '#86a4cc', snow: '#ffffff', snowShadow: '#d4e4f8', sharp: true, freq: 4 }), 0.06, 10);
      L(ridgeLayer(W, 100, 62, { base: 30, amp: 50, color: '#d8e8f8', shadow: '#c0d4ec', freq: 5 }), 0.18, 6);
      L(treeLayer(W, 80, 63, { color: '#3a5a7a', snow: '#ffffff', kinds: ['pine', 'pine'], minH: 30, maxH: 64, gapMin: 16, gapMax: 40, ground: 8 }), 0.42, 4);
      break;
    case 'storm':
    case 'summit':
      out.stars = themeId === 'summit';
      L(ridgeLayer(W, 150, 71, { base: 40, amp: 100, color: '#252c48', shadow: '#1e243c', sharp: true, freq: 6 }), 0.06, 10);
      L(treeLayer(W, 130, 72, { color: '#181d32', window: '#ffd84a', kinds: ['tower', 'spire', 'tower'], minH: 50, maxH: 120, gapMin: 40, gapMax: 90, ground: 10 }), 0.22, 6);
      break;
  }
  return out;
}

//  %  fake wall     C  crumble block   L  lava       ^ v < >  spikes
//  P  start         S  checkpoint      F  finish     *  gem     +  heart

//  K  crusher 2x2   !  stalactite

// pad a segment with sky rows on top so it is exactly h rows tall
function seg(h, rows, name) {
  const w = rows[0].length;
  rows.forEach((r, i) => { if (r.length !== w) throw new Error(`segment ${name} row ${i} width ${r.length} != ${w}: "${r}"`); });
  if (rows.length > h) throw new Error(`segment ${name} too tall (${rows.length} > ${h})`);
  return Array(h - rows.length).fill('.'.repeat(w)).concat(rows);
}
// join segments left-to-right
function hjoin(h, segs) {
  const out = Array(h).fill('');
  segs.forEach((s, i) => seg(h, s, i).forEach((r, y) => (out[y] += r)));
  return out;
}
// stack segments top-to-bottom (all must share a width)
function vstack(segs) {
  const w = segs[0][0].length;
  const out = [];
  segs.forEach((s, i) => s.forEach((r, y) => { if (r.length !== w) throw new Error(`vstack seg ${i} row ${y} width ${r.length} != ${w}: "${r}"`); out.push(r); }));
  return out;
}

// place rectangles / strings by coordinate (used for the tall vertical levels)
function build(w, h, fn) {
  const g = Array.from({ length: h }, () => Array(w).fill('.'));
  const b = {
    fill(x, y, ww, hh, ch = '#') {
      for (let j = y; j < y + hh; j++) for (let i = x; i < x + ww; i++) {
        if (i < 0 || j < 0 || i >= w || j >= h) throw new Error(`build: ${i},${j} is outside ${w}x${h}`);
        g[j][i] = ch;
      }
    },
    put(x, y, s) { [...s].forEach((ch, i) => { if (ch !== ' ') b.fill(x + i, y, 1, 1, ch); }); },
  };
  fn(b);
  return g.map((r) => r.join(''));
}

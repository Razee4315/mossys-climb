// ---- world.js ----
// =====================================================================
//  WORLD — level loading, collision, hazards, props, events, camera
// =====================================================================
const T = { EMPTY: 0, SOLID: 1, ONEWAY: 2, SPIKE_U: 3, SPIKE_D: 4, SPIKE_L: 5, SPIKE_R: 6, ICE: 7, LAVA: 8, COLLAPSE: 9 };
const SPIKE_BOX = { 3: [1, 8, 14, 8], 4: [1, 0, 14, 8], 5: [8, 1, 8, 14], 6: [0, 1, 8, 14] };
const ENEMY_CHARS = { B: 'beetle', N: 'spiny', Y: 'bat', Q: 'plant', W: 'wasp', U: 'waspV', G: 'slime', M: 'mimic', D: 'boss' };

let level = null;          // current level runtime
const fx = { particles: [], texts: [], weather: [], banners: [], shake: 0, hitstop: 0, flash: 0, flashCol: '#ffffff' };
const cam = { x: 0, y: 0, look: 0, lock: null, shakeX: 0, shakeY: 0, lookDown: 0 };

// ---------------------------------------------------------------------
//  Loading
// ---------------------------------------------------------------------
function parseLevel(idx) {
  const def = LEVELS[idx];
  const src = def.map;
  const h = src.length, w = src[0].length;
  src.forEach((r, i) => { if (r.length !== w) throw new Error(`Level ${idx + 1} row ${i} has width ${r.length}, expected ${w}`); });
  const L = {
    idx, def, theme: def.theme, w, h, rows: [], grid: new Uint8Array(w * h), grid0: null,
    spawn: null, checkpoints: [], finish: null, gems: [], hearts: [], signs: [], springs: [], platforms: [],
    crumbles: [], collapses: [], secrets: [], stals: [], crushers: [], enemySpawns: [], markers: {}, triggers: {},
    stops: new Set(), events: [], lava: null, lavaTiles: [], gates: [],
  };
  let signI = 0, gemI = 0;
  const collapseCells = [], secretCells = [];
  for (let ty = 0; ty < h; ty++) {
    let art = '';
    for (let tx = 0; tx < w; tx++) {
      const ch = src[ty][tx];
      const px = tx * TS, py = ty * TS;
      const set = (t) => (L.grid[ty * w + tx] = t);
      let a = '.';
      switch (ch) {
        case '#': set(T.SOLID); a = '#'; break;
        case 'I': set(T.ICE); a = 'I'; break;
        case '=': set(T.ONEWAY); a = '='; break;
        case '^': set(T.SPIKE_U); a = ch; break;
        case 'v': set(T.SPIKE_D); a = ch; break;
        case '<': set(T.SPIKE_L); a = ch; break;
        case '>': set(T.SPIKE_R); a = ch; break;
        case 'L': set(T.LAVA); L.lavaTiles.push({ tx, ty }); break;
        case 'X': set(T.COLLAPSE); a = 'X'; collapseCells.push([tx, ty]); break;
        case '%': a = '%'; secretCells.push([tx, ty]); break;
        case 'C': L.crumbles.push({ x: px, y: py, w: TS, h: TS, state: 'idle', t: 0 }); break;
        case 'P': L.spawn = { x: px + 3, y: py + TS - 14 }; break;
        case 'S': L.checkpoints.push({ x: px, y: py, active: false, idx: L.checkpoints.length }); break;
        case 'F': L.finish = { x: px, y: py, hops: 0, hop: null }; break;
        case '*': L.gems.push({ id: gemI++, x: px + 2, y: py + 3, got: false, bob: tx * 0.7 }); break;
        case '+': L.hearts.push({ x: px + 3, y: py + 4, got: false }); break;
        case '?': L.signs.push({ x: px, y: py }); break;
        case 'T': L.springs.push({ x: px, y: py, t: 0 }); break;
        case 'H': case 'V': L.platforms.push({ tx, ty, axis: ch === 'H' ? 'x' : 'y' }); break;
        case ':': L.stops.add(ty * w + tx); break;
        case 'K': L.crushers.push({ tx, ty }); break;
        case '!': L.stals.push({ x: px, y: py }); break;
        default:
          if (ENEMY_CHARS[ch]) {
            const sp = { type: ENEMY_CHARS[ch], tx, ty };
            if (ch === 'M') { sp.gemId = gemI++; L.gems.push({ id: sp.gemId, mimic: true, got: false }); } // mimics hold a gem
            L.enemySpawns.push(sp);
          } else if (ch >= '1' && ch <= '9') {
            (L.triggers[ch] = L.triggers[ch] || []).push({ x: px, y: py, w: TS, h: TS });
          } else if (ch >= 'a' && ch <= 'z') {
            (L.markers[ch] = L.markers[ch] || []).push({ tx, ty, x: px, y: py });
          } else if (ch !== '.') {
            throw new Error(`Level ${idx + 1}: unknown map char '${ch}' at ${tx},${ty}`);
          }
      }
      art += a;
    }
    L.rows.push(art);
  }
  if (!L.spawn) throw new Error(`Level ${idx + 1} has no P`);
  L.signs.sort((a, b) => (def.vertical ? b.y - a.y || a.x - b.x : a.x - b.x || a.y - b.y));
  L.signs.forEach((s) => (s.text = (def.signs || [])[signI++] || '...'));
  L.gemTotal = gemI;
  L.grid0 = L.grid.slice();
  // moving platform travel ranges
  L.platforms = L.platforms.map((p) => buildPlatform(L, p));
  // group collapse & secret cells into connected sets
  L.collapses = groupCells(collapseCells).map((cells) => ({ cells, state: 'idle', t: 0 }));
  L.secrets = groupCells(secretCells).map((cells) => ({ cells, alpha: 1, found: false, ...cellBounds(cells) }));
  L.crushers = L.crushers.map(({ tx, ty }) => ({ x: tx * TS, y: ty * TS, y0: ty * TS, w: 32, h: 32, state: 'idle', t: 0, vy: 0 }));
  L.stals = L.stals.map((s) => ({ ...s, x0: s.x, y0: s.y, state: 'idle', t: 0, vy: 0 }));
  L.events = (def.events || []).map((e) => ({ ...e, fired: false }));
  return L;
}

function groupCells(cells) {
  const key = (x, y) => x + ',' + y;
  const left = new Map(cells.map((c) => [key(c[0], c[1]), c]));
  const groups = [];
  for (const c of cells) {
    if (!left.has(key(c[0], c[1]))) continue;
    const g = [], stack = [c];
    left.delete(key(c[0], c[1]));
    while (stack.length) {
      const [x, y] = stack.pop(); g.push([x, y]);
      for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        const k = key(x + dx, y + dy);
        if (left.has(k)) { stack.push(left.get(k)); left.delete(k); }
      }
    }
    groups.push(g);
  }
  return groups;
}
function cellBounds(cells) {
  const xs = cells.map((c) => c[0]), ys = cells.map((c) => c[1]);
  const x0 = Math.min(...xs), y0 = Math.min(...ys);
  return { bx: x0 * TS, by: y0 * TS, bw: (Math.max(...xs) - x0 + 1) * TS, bh: (Math.max(...ys) - y0 + 1) * TS };
}

function buildPlatform(L, { tx, ty, axis }) {
  const blocked = (x, y) => x < 0 || y < 0 || x >= L.w || y >= L.h || L.stops.has(y * L.w + x) || isSolidT(L.grid[y * L.w + x]);
  let a, b;
  if (axis === 'x') {
    a = tx; while (!blocked(a - 1, ty)) a--;
    b = tx + 1; while (!blocked(b + 1, ty)) b++;
    return { axis, x: tx * TS, y: ty * TS, min: a * TS, max: (b + 1) * TS - 32, w: 32, h: 6, dir: 1, pause: 0, dx: 0, dy: 0, remX: 0, remY: 0, x0: tx * TS, y0: ty * TS };
  }
  a = ty; while (!blocked(tx, a - 1) && !blocked(tx + 1, a - 1)) a--;
  b = ty; while (!blocked(tx, b + 1) && !blocked(tx + 1, b + 1)) b++;
  return { axis, x: tx * TS, y: ty * TS, min: a * TS, max: b * TS + 10, w: 32, h: 6, dir: -1, pause: 0, dx: 0, dy: 0, remX: 0, remY: 0, x0: tx * TS, y0: ty * TS };
}

// Build everything needed to play a level (art included)
function startLevel(idx) {
  level = parseLevel(idx);
  const L = level;
  const art = buildLevelArt(L);
  L.art = art.canvas; L.lights = art.lights;
  L.props = buildThemeProps(L.theme);
  L.bg = buildBackground(L.theme);
  for (const c of L.collapses) c.tiles = c.cells.map(([x, y]) => buildTileCanvas(L, x, y, true));
  L.wallPattern = ctx.createPattern(buildWallTile(L.theme), 'repeat');
  for (const s of L.secrets) {
    const cv = newCanvas(s.bw, s.bh); const g = cv.getContext('2d');
    for (const [x, y] of s.cells) g.drawImage(buildTileCanvas(L, x, y, false), x * TS - s.bx, y * TS - s.by);
    s.canvas = cv;
  }
  L.time = 0; L.deaths = 0; L.kills = 0; L.secretsFound = 0;
  L.checkpoint = null;
  L.darkness = THEMES[L.theme].darkness; L.darkTarget = L.darkness;
  L.weather = { gusts: !!(L.def.weather && L.def.weather.gusts), lightning: !!(L.def.weather && L.def.weather.lightning), gustT: 4, boltT: 5, gust: null, bolts: [] };
  L.weather0 = { ...L.weather };
  L.rocks = []; L.boulders = []; L.popSpikes = [];
  L.bannerSeen = {};
  resetDynamic(true);
  return L;
}

// y of the first floor surface at or below world point (x, y)
function groundYAt(x, y) {
  const tx = Math.floor(x / TS);
  for (let ty = Math.max(0, Math.floor(y / TS)); ty < level.h; ty++) { const t = tileAt(tx, ty); if (isSolidT(t) || t === T.ONEWAY) return ty * TS; }
  return level.h * TS;
}
function isSolidT(t) { return t === T.SOLID || t === T.ICE || t === T.COLLAPSE; }
function tileAt(tx, ty) {
  if (tx < 0 || tx >= level.w || ty < 0) return T.SOLID;
  if (ty >= level.h) return T.EMPTY;
  return level.grid[ty * level.w + tx];
}

// Is the rectangle overlapping any solid (tiles + dynamic solids)?
function solidRect(x, y, w, h, ignore) {
  const tx0 = Math.floor(x / TS), tx1 = Math.floor((x + w - 1) / TS);
  const ty0 = Math.floor(y / TS), ty1 = Math.floor((y + h - 1) / TS);
  for (let ty = ty0; ty <= ty1; ty++) for (let tx = tx0; tx <= tx1; tx++) if (isSolidT(tileAt(tx, ty))) return true;
  for (const c of level.crumbles) if (c.state !== 'gone' && rectHit(x, y, w, h, c.x, c.y, c.w, c.h)) return true;
  for (const k of level.crushers) if (k !== ignore && rectHit(x, y, w, h, k.x, k.y, k.w, k.h)) return true;
  for (const g of level.gates) if (g.closed && rectHit(x, y, w, h, g.x, g.y, TS, TS)) return true;
  return false;
}

// Is there a one-way surface exactly under the rect's bottom edge?
function onewayUnder(x, y, w, h) {
  const bottom = y + h;
  if (bottom % TS === 0) {
    const ty = bottom / TS;
    for (let tx = Math.floor(x / TS); tx <= Math.floor((x + w - 1) / TS); tx++) if (tileAt(tx, ty) === T.ONEWAY) return { kind: 'oneway' };
  }
  for (const p of level.platforms) if (p.y === bottom && x + w > p.x && x < p.x + p.w) return { kind: 'platform', plat: p };
  return null;
}

// Generic integer mover with sub-pixel remainders. Returns true when blocked.
function moveX(e, amt) {
  e.remX += amt;
  let move = Math.round(e.remX);
  if (!move) return false;
  e.remX -= move;
  const s = Math.sign(move);
  while (move) {
    if (!solidRect(e.x + s, e.y, e.w, e.h)) { e.x += s; move -= s; } else { e.remX = 0; return true; }
  }
  return false;
}
function moveY(e, amt, oneway = true) {
  e.remY += amt;
  let move = Math.round(e.remY);
  if (!move) return false;
  e.remY -= move;
  const s = Math.sign(move);
  while (move) {
    if (solidRect(e.x, e.y + s, e.w, e.h) || (s > 0 && oneway && !e.drop && onewayUnder(e.x, e.y, e.w, e.h))) { e.remY = 0; return true; }
    e.y += s; move -= s;
  }
  return false;
}
function groundUnder(e) {
  if (solidRect(e.x, e.y + 1, e.w, e.h)) {
    // what are we standing on?
    const ty = Math.floor((e.y + e.h) / TS);
    let kind = 'solid';
    for (let tx = Math.floor(e.x / TS); tx <= Math.floor((e.x + e.w - 1) / TS); tx++) {
      const t = tileAt(tx, ty);
      if (t === T.ICE) kind = 'ice';
      if (t === T.COLLAPSE) { kind = 'collapse'; break; }
      if (t === T.SOLID) { kind = 'solid'; break; }
    }
    for (const c of level.crumbles) if (c.state !== 'gone' && rectHit(e.x, e.y + 1, e.w, e.h, c.x, c.y, c.w, c.h)) { kind = 'crumble'; c.touched = true; }
    for (const k of level.crushers) if (rectHit(e.x, e.y + 1, e.w, e.h, k.x, k.y, k.w, k.h) && e.y + e.h <= k.y) return { kind: 'crusher', crusher: k };
    return { kind };
  }
  if (!e.drop) return onewayUnder(e.x, e.y, e.w, e.h);
  return null;
}

// Hazard tile overlap: returns 'spike' | 'lava' | null
function hazardAt(x, y, w, h) {
  const tx0 = Math.floor(x / TS), tx1 = Math.floor((x + w - 1) / TS);
  const ty0 = Math.floor(y / TS), ty1 = Math.floor((y + h - 1) / TS);
  for (let ty = ty0; ty <= ty1; ty++) for (let tx = tx0; tx <= tx1; tx++) {
    const t = tileAt(tx, ty);
    if (SPIKE_BOX[t]) {
      const b = SPIKE_BOX[t];
      if (rectHit(x, y, w, h, tx * TS + b[0], ty * TS + b[1], b[2], b[3])) return 'spike';
    } else if (t === T.LAVA) {
      if (rectHit(x, y, w, h, tx * TS, ty * TS + 5, TS, 11)) return 'lava';
    }
  }
  return null;
}

// ---------------------------------------------------------------------
//  Reset of everything that respawns when the player dies
// ---------------------------------------------------------------------
function resetDynamic(first = false) {
  const L = level;
  L.grid.set(L.grid0);
  for (const c of L.crumbles) { c.state = 'idle'; c.t = 0; c.touched = false; }
  for (const c of L.collapses) { c.state = 'idle'; c.t = 0; }
  for (const p of L.platforms) { p.x = p.x0; p.y = p.y0; p.dir = p.axis === 'x' ? 1 : -1; p.pause = 0; p.remX = p.remY = 0; }
  for (const k of L.crushers) { k.y = k.y0; k.state = 'idle'; k.t = 0; k.vy = 0; }
  for (const s of L.stals) { s.x = s.x0; s.y = s.y0; s.state = 'idle'; s.t = 0; s.vy = 0; }
  for (const g of L.gates) g.closed = false;
  L.rocks = []; L.boulders = []; L.popSpikes = []; L.projectiles = [];
  L.weather = { ...L.weather0, gust: null, bolts: [] };
  L.darkTarget = THEMES[L.theme].darkness;
  cam.lock = null; L.arena = null;
  for (const e of L.events) if (!e.persist) e.fired = false;
  // rising lava: restore (and resume if the checkpoint was taken mid-chase)
  const rise = L.events.find((e) => e.type === 'rise');
  if (rise) {
    const startY = L.h * TS + 8;
    L.lava = { y: startY, active: false, pause: 0, speed: rise.speed || 22, stopY: rise.stopRow != null ? rise.stopRow * TS : -9999 };
    if (!first && L.checkpoint && L.checkpoint.midRise) {
      L.lava.active = true; rise.fired = true;
      L.lava.y = Math.min(startY, L.checkpoint.y + TS * 7);
      L.lava.pause = 1.6;
    }
  } else L.lava = null;
  spawnEnemies();
}

// ---------------------------------------------------------------------
//  Dynamic props
// ---------------------------------------------------------------------
function updatePlatforms(dt) {
  for (const p of level.platforms) {
    const ox = p.x, oy = p.y;
    if (p.pause > 0) { p.pause -= dt; p.dx = p.dy = 0; continue; }
    const speed = 42;
    if (p.axis === 'x') {
      p.remX += p.dir * speed * dt;
      const m = Math.round(p.remX); p.remX -= m; p.x += m;
      if (p.x <= p.min) { p.x = p.min; p.dir = 1; p.pause = 0.5; }
      if (p.x >= p.max) { p.x = p.max; p.dir = -1; p.pause = 0.5; }
    } else {
      p.remY += p.dir * speed * dt;
      const m = Math.round(p.remY); p.remY -= m; p.y += m;
      if (p.y <= p.min) { p.y = p.min; p.dir = 1; p.pause = 0.5; }
      if (p.y >= p.max) { p.y = p.max; p.dir = -1; p.pause = 0.5; }
    }
    p.dx = p.x - ox; p.dy = p.y - oy;
  }
}

function updateCrumbles(dt) {
  for (const c of level.crumbles) {
    if (c.state === 'idle' && c.touched) { c.state = 'shake'; c.t = 0.45; Sound.sfx('crumble'); }
    c.touched = false;
    if (c.state === 'shake') {
      c.t -= dt;
      if (c.t <= 0) {
        c.state = 'gone'; c.t = 2.6;
        burst(c.x + 8, c.y + 8, THEMES[level.theme].stone, 10, 60);
      }
    } else if (c.state === 'gone') {
      c.t -= dt;
      if (c.t <= 0 && !rectHit(player.x, player.y, player.w, player.h, c.x, c.y, c.w, c.h)) {
        c.state = 'idle';
        burst(c.x + 8, c.y + 8, '#ffffff', 5, 25);
      }
    }
  }
}

function triggerCollapse(group) {
  if (group.state !== 'idle') return;
  group.state = 'shake'; group.t = 0.38;
  Sound.sfx('crack');
  addShake(1.5);
}
function updateCollapses(dt) {
  for (const g of level.collapses) {
    if (g.state !== 'shake') continue;
    g.t -= dt;
    if (g.t <= 0) {
      g.state = 'gone';
      Sound.sfx('collapse'); addShake(4);
      g.cells.forEach(([x, y], i) => {
        level.grid[y * level.w + x] = T.EMPTY;
        level.rocks.push({ kind: 'debris', img: g.tiles[i], x: x * TS, y: y * TS, vx: rand(-20, 20), vy: rand(-40, 0), w: TS, h: TS, life: 1.4, rot: 0, vr: rand(-3, 3) });
        burst(x * TS + 8, y * TS + 8, THEMES[level.theme].base, 4, 50);
      });
    }
  }
}

function updateSprings(dt) {
  for (const s of level.springs) if (s.t > 0) s.t -= dt;
}

function updateCrushers(dt) {
  for (const k of level.crushers) {
    const px = player.x + player.w / 2;
    if (k.state === 'idle') {
      if (!player.dead && px > k.x - 6 && px < k.x + k.w + 6 && player.y > k.y && player.y < k.y + 13 * TS) {
        // only slam if nothing solid is between the crusher and the player
        let clear = true;
        for (let y = k.y + k.h; y < player.y; y += TS) if (solidRect(k.x + 4, y, k.w - 8, 4, k)) { clear = false; break; }
        if (clear) { k.state = 'warn'; k.t = 0.4; Sound.sfx('warn'); }
      }
    } else if (k.state === 'warn') {
      k.t -= dt; if (k.t <= 0) { k.state = 'fall'; k.vy = 60; }
    } else if (k.state === 'fall') {
      k.vy = Math.min(k.vy + 1400 * dt, 480);
      const steps = Math.round(k.vy * dt);
      for (let i = 0; i < steps; i++) {
        if (solidRect(k.x, k.y + 1, k.w, k.h, k)) { k.state = 'land'; k.t = 0.9; addShake(5); Sound.sfx('slam'); burst(k.x + 16, k.y + 32, '#c8c0d8', 14, 80); break; }
        k.y += 1;
        if (!player.dead && rectHit(player.x, player.y, player.w, player.h, k.x + 2, k.y + k.h - 6, k.w - 4, 6) && player.y + player.h > k.y + k.h - 2) {
          if (solidRect(player.x, player.y + 1, player.w, player.h, k)) { killPlayer('crush'); }
          else player.y += 1;
        }
      }
      for (const e of enemies) if (e.alive && rectHit(e.x, e.y, e.w, e.h, k.x, k.y, k.w, k.h)) killEnemy(e, 'crush');
    } else if (k.state === 'land') {
      k.t -= dt; if (k.t <= 0) k.state = 'rise';
    } else if (k.state === 'rise') {
      const riding = !player.dead && player.y + player.h === k.y && player.x + player.w > k.x && player.x < k.x + k.w;
      const dy = Math.min(1, k.y - k.y0);
      if (dy > 0 && Math.random() < 0.6) {
        k.y -= dy;
        if (riding) moveY(player, -dy, false);
      }
      if (k.y <= k.y0) { k.y = k.y0; k.state = 'idle'; }
    }
  }
}

function updateStals(dt) {
  for (const s of level.stals) {
    if (s.state === 'idle') {
      const px = player.x + player.w / 2;
      if (!player.dead && Math.abs(px - (s.x + 8)) < 22 && player.y > s.y && player.y - s.y < 10 * TS) { s.state = 'shake'; s.t = 0.45; Sound.sfx('crack'); }
    } else if (s.state === 'shake') {
      s.t -= dt; if (s.t <= 0) { s.state = 'fall'; s.vy = 0; }
    } else if (s.state === 'fall') {
      s.vy = Math.min(s.vy + 900 * dt, 360);
      s.y += s.vy * dt;
      if (solidRect(s.x + 4, s.y + 4, 8, 10)) { s.state = 'gone'; burst(s.x + 8, s.y + 12, THEMES[level.theme].stone, 10, 70); Sound.sfx('crack'); }
      else if (!player.dead && rectHit(player.x, player.y, player.w, player.h, s.x + 4, s.y + 2, 8, 12)) { hurtPlayer(s.x + 8); s.state = 'gone'; burst(s.x + 8, s.y + 12, THEMES[level.theme].stone, 10, 70); }
      if (s.y > level.h * TS) s.state = 'gone';
    }
  }
}

// falling rocks (events), debris from collapses, boulders
function spawnRock(x, y, delay = 0.6) {
  level.rocks.push({ kind: 'rock', x: x - 6, y, w: 12, h: 10, vx: 0, vy: 0, warn: delay, life: 6 });
}
function updateRocks(dt) {
  const R = level.rocks;
  for (let i = R.length - 1; i >= 0; i--) {
    const r = R[i];
    if (r.kind === 'debris') {
      r.vy += 700 * dt; r.x += r.vx * dt; r.y += r.vy * dt; r.rot += r.vr * dt; r.life -= dt;
      if (r.life <= 0) R.splice(i, 1);
      continue;
    }
    if (r.warn > 0) {
      r.warn -= dt;
      if (Math.random() < 0.4) addParticle(r.x + rand(0, 12), r.y + rand(-2, 4), { vy: rand(20, 60), col: '#b8b0c4', life: 0.4, g: 200 });
      continue;
    }
    r.vy = Math.min(r.vy + 800 * dt, 380);
    r.y += r.vy * dt; r.life -= dt;
    if (solidRect(r.x + 2, r.y + 2, r.w - 4, r.h - 2) || r.life <= 0 || r.y > level.h * TS) {
      burst(r.x + 6, r.y + 8, THEMES[level.theme].stone, 8, 60); Sound.sfx('crack');
      R.splice(i, 1); continue;
    }
    if (!player.dead && rectHit(player.x, player.y, player.w, player.h, r.x + 1, r.y + 1, r.w - 2, r.h - 2)) {
      hurtPlayer(r.x + 6);
      burst(r.x + 6, r.y + 8, THEMES[level.theme].stone, 8, 60);
      R.splice(i, 1);
    }
  }
}

function spawnBoulder(x, y, dir, snow) {
  level.boulders.push({ x, y, w: 28, h: 28, remX: 0, remY: 0, vx: 0, vy: 0, dir, rot: 0, snow, wait: 0.75 });
  Sound.sfx('rumble'); addShake(3);
}
function updateBoulders(dt) {
  const B = level.boulders;
  for (let i = B.length - 1; i >= 0; i--) {
    const b = B[i];
    if (b.wait > 0) { b.wait -= dt; addShake(0.6); continue; }
    b.vx = approach(b.vx, b.dir * 94, 150 * dt);
    b.vy = Math.min(b.vy + 900 * dt, 400);
    const hitX = moveX(b, b.vx * dt);
    const hitY = moveY(b, b.vy * dt, true);
    if (hitY) { if (b.vy > 150) { addShake(2.5); Sound.sfx('land'); } b.vy = 0; }
    b.rot += (b.vx * dt) / 14;
    if (Math.random() < 0.3 && hitY) addParticle(b.x + 14 - b.dir * 12, b.y + 28, { vx: -b.dir * rand(10, 40), vy: rand(-30, -5), col: b.snow ? '#ffffff' : '#a89a8a', life: 0.5 });
    for (const e of enemies) if (e.alive && boxHit(e, b)) killEnemy(e, 'crush');
    if (!player.dead && rectHit(player.x, player.y, player.w, player.h, b.x + 3, b.y + 3, 22, 22)) killPlayer('boulder');
    if (hitX || b.y > level.h * TS + 40) {
      burst(b.x + 14, b.y + 14, b.snow ? '#ffffff' : '#a89a8a', 30, 120);
      burst(b.x + 14, b.y + 14, b.snow ? '#cfe4ff' : '#6a5e6e', 20, 90);
      addShake(6); Sound.sfx('explode');
      B.splice(i, 1);
    }
  }
}

function updateLava(dt) {
  const lv = level.lava;
  if (!lv || !lv.active) return;
  if (lv.pause > 0) { lv.pause -= dt; return; }
  const gap = lv.y - (player.y + player.h);
  let sp = lv.speed;
  if (gap > TS * 9) sp *= 2.6; else if (gap < TS * 3) sp *= 0.7;
  if (Save.data.settings.assist) sp *= 0.6;
  lv.y = Math.max(lv.stopY, lv.y - sp * dt);
  if (Math.random() < 0.3) addParticle(cam.x + rand(0, VW), lv.y - 2, { vy: rand(-60, -20), vx: rand(-10, 10), col: pick(['#ff7a1a', '#ffd25a']), life: 0.8, g: 40 });
  if (!player.dead && player.y + player.h > lv.y + 4) killPlayer('lava');
  for (const e of enemies) if (e.alive && e.y + e.h > lv.y + 4) killEnemy(e, 'lava');
}

// ---------------------------------------------------------------------
//  Weather surprises: gusts of wind and lightning strikes
// ---------------------------------------------------------------------
function updateWeather(dt) {
  const W = level.weather;
  if (W.gusts) {
    if (W.gust) {
      W.gust.t -= dt;
      if (W.gust.t < 1.6 && W.gust.t > 0) { W.gust.active = true; }
      if (W.gust.t <= 0) { W.gust = null; W.gustT = rand(5, 9); }
    } else {
      W.gustT -= dt;
      if (W.gustT <= 0) {
        const dir = Math.random() < 0.5 ? -1 : 1;
        W.gust = { dir, t: 2.4, active: false };
        banner(dir > 0 ? 'GUST  ▶▶' : '◀◀  GUST', '#bfe4ff', 1.2);
        Sound.sfx('gust');
      }
    }
  }
  {
    W.boltT -= dt;
    if (W.lightning && W.boltT <= 0 && !player.dead) {
      W.boltT = rand(2.6, 4.2);
      // strike near (sometimes right on) the player, telegraphed for 0.9s
      const bx = clamp(player.x + player.w / 2 + pick([-48, -24, 0, 0, 24, 48]) + rand(-6, 6), 8, level.w * TS - 8);
      W.bolts.push({ x: bx, ground: groundYAt(bx, player.y), t: 0.9, strike: 0 });
    }
    for (let i = W.bolts.length - 1; i >= 0; i--) {
      const b = W.bolts[i];
      if (b.t > 0) {
        b.t -= dt;
        if (Math.floor(b.t * 10) !== Math.floor((b.t + dt) * 10)) Sound.sfx('zap');
        if (b.t <= 0) {
          b.strike = 0.25; Sound.sfx('thunder'); addShake(4); fx.flash = 0.35; fx.flashCol = '#e8f0ff';
          burst(b.x, b.ground, '#ffffaa', 18, 110);
          if (!player.dead && Math.abs(player.x + player.w / 2 - b.x) < 10 && player.y < b.ground) hurtPlayer(b.x);
          for (const e of enemies) if (e.alive && Math.abs(e.x + e.w / 2 - b.x) < 10 && e.y < b.ground) killEnemy(e, 'zap');
        }
      } else {
        b.strike -= dt;
        if (b.strike <= 0) W.bolts.splice(i, 1);
      }
    }
  }
}

// ---------------------------------------------------------------------
//  Scripted "unexpected" events
// ---------------------------------------------------------------------
function updateEvents(dt) {
  const L = level;
  for (const ev of L.events) {
    if (ev.fired && ev.type !== 'flagRun') { if (ev.update) ev.update(dt); continue; }
    if (ev.type === 'flagRun') { updateFlagRun(ev); continue; }
    const zone = L.triggers[ev.trigger];
    if (!zone || player.dead) continue;
    if (zone.some((r) => rectHit(player.x, player.y, player.w, player.h, r.x, r.y, r.w, r.h))) fireEvent(ev);
  }
  // quakes keep dropping rocks for a while
  for (const ev of L.events) {
    if (ev.type !== 'quake' || !ev.fired || !(ev.left > 0)) continue;
    ev.left -= dt; ev.tick -= dt; addShake(1.2);
    if (ev.tick <= 0) {
      ev.tick = ev.every || 0.5;
      const tx = Math.floor((player.x + player.vx * 0.5) / TS) + randi(-6, 6);
      let ty = Math.floor(player.y / TS);
      while (ty > 0 && !isSolidT(tileAt(tx, ty - 1)) && player.y - ty * TS < VH * 0.7) ty--;
      if (!isSolidT(tileAt(tx, ty))) spawnRock(tx * TS + 8, ty * TS + 2, 0.7);
    }
  }
}

function fireEvent(ev) {
  const L = level;
  ev.fired = true;
  if (ev.msg) banner(ev.msg, ev.col || '#ffd84a', ev.msgTime || 1.8);
  const marks = (m) => L.markers[m] || [];
  switch (ev.type) {
    case 'rockfall':
      Sound.sfx('rumble'); addShake(2);
      marks(ev.marker).forEach((m, i) => spawnRock(m.x + 8, m.y + 2, (ev.delay || 0.55) + i * (ev.stagger || 0.12)));
      break;
    case 'ambush':
      Sound.sfx('alarm');
      marks(ev.marker).forEach((m, i) => {
        const e = makeEnemy(ev.enemy || 'beetle', m.tx, m.ty);
        e.dropIn = 0.6 + i * 0.15; e.ambush = true;
        enemies.push(e);
      });
      break;
    case 'quake':
      Sound.sfx('rumble'); ev.left = ev.duration || 5; ev.tick = 0.3;
      break;
    case 'rise':
      if (L.lava && !L.lava.active) { L.lava.active = true; L.lava.pause = ev.pause != null ? ev.pause : 0.8; Sound.sfx('lavaRise'); addShake(3); }
      break;
    case 'boulder':
      marks(ev.marker).forEach((m) => spawnBoulder(m.x, m.y, ev.dir || 1, !!ev.snow));
      break;
    case 'dark':
      L.darkTarget = ev.level != null ? ev.level : 0.94;
      if (ev.level === 0 || ev.restore) L.darkTarget = THEMES[L.theme].darkness;
      Sound.sfx(ev.restore ? 'select' : 'collapse');
      break;
    case 'spikes':
      Sound.sfx('warn');
      marks(ev.marker).forEach((m) => L.popSpikes.push({ tx: m.tx, ty: m.ty, t: ev.delay || 0.45, up: 0 }));
      break;
    case 'weather':
      if (ev.gusts != null) { L.weather.gusts = ev.gusts; L.weather.gustT = 1.5; }
      if (ev.lightning != null) { L.weather.lightning = ev.lightning; L.weather.boltT = 1.2; }
      break;
    case 'arena': {
      const a = marks(ev.from || 'q')[0], b = marks(ev.to || 'p')[0];
      const aw = b.x + TS - a.x, ah = b.y + TS - a.y;
      L.arena = { x: a.x, y: a.y, w: aw, h: ah };
      // camera frames the arena, centred if the screen is wider than it
      cam.lock = { x: a.x - Math.max(0, VW - aw) / 2, y: a.y, w: Math.max(VW, aw), h: Math.max(VH, ah) };
      L.gates = marks(ev.gate || 'g').map((m) => ({ x: m.x, y: m.y, closed: true }));
      Sound.sfx('slam'); addShake(4);
      Sound.Music.play('boss');
      const boss = enemies.find((e) => e.type === 'boss');
      if (boss) boss.awake = true;
      break;
    }
    case 'message':
      break;
  }
}

function updateFlagRun(ev) {
  const F = level.finish;
  if (!F) return;
  if (F.hop) return;
  const hops = ev.markers || [];
  if (F.hops >= hops.length) return;
  const d = Math.abs(player.x + 5 - (F.x + 8)) + Math.abs(player.y - F.y);
  if (d < 46 && !player.dead) {
    const m = (level.markers[hops[F.hops]] || [])[0];
    if (!m) return;
    F.hop = { sx: F.x, sy: F.y, tx: m.x, ty: m.y, t: 0, dur: 0.9 + Math.min(1.2, Math.hypot(m.x - F.x, m.y - F.y) / 200) };
    F.hops++;
    Sound.sfx('nope');
    floatText(F.x + 8, F.y - 18, pick(ev.lines || ['NOPE!', 'NOT YET!', 'CATCH ME!']), '#ffd84a');
  }
}
function updateFinishHop(dt) {
  const F = level.finish;
  if (!F || !F.hop) return;
  const h = F.hop;
  h.t += dt / h.dur;
  const t = Math.min(1, h.t);
  F.x = lerp(h.sx, h.tx, easeInOut(t));
  F.y = lerp(h.sy, h.ty, t) - Math.sin(t * Math.PI) * (40 + Math.abs(h.ty - h.sy) * 0.4);
  if (Math.random() < 0.5) addParticle(F.x + 8, F.y + 14, { col: '#ffd84a', life: 0.5, vy: rand(-10, 10), vx: rand(-10, 10) });
  if (t >= 1) { F.x = h.tx; F.y = h.ty; F.hop = null; burst(F.x + 8, F.y + 14, '#ffd84a', 12, 60); Sound.sfx('land'); }
}

function updatePopSpikes(dt) {
  for (const s of level.popSpikes) {
    if (s.t > 0) {
      s.t -= dt;
      if (Math.random() < 0.3) addParticle(s.tx * TS + rand(2, 14), s.ty * TS + 14, { col: '#ffffff', life: 0.25, vy: -20 });
      if (s.t <= 0) { level.grid[s.ty * level.w + s.tx] = T.SPIKE_U; Sound.sfx('crack'); }
    } else s.up = Math.min(1, s.up + dt * 8);
  }
}

function updateSecrets(dt) {
  for (const s of level.secrets) {
    const inside = rectHit(player.x, player.y, player.w, player.h, s.bx, s.by, s.bw, s.bh) && s.cells.some(([x, y]) => rectHit(player.x, player.y, player.w, player.h, x * TS, y * TS, TS, TS));
    s.alpha = approach(s.alpha, inside ? 0.18 : 1, dt * 4);
    if (inside && !s.found) {
      s.found = true; level.secretsFound++;
      Sound.sfx('secret'); floatText(player.x + 5, player.y - 10, 'SECRET!', '#ffd84a');
    }
  }
}

// ---------------------------------------------------------------------
//  Particles, floating text, banners, screen shake
// ---------------------------------------------------------------------
function addParticle(x, y, o = {}) {
  if (fx.particles.length > 700) return;
  fx.particles.push({ x, y, vx: o.vx || 0, vy: o.vy || 0, g: o.g != null ? o.g : 300, life: o.life || 0.5, max: o.life || 0.5, col: o.col || '#ffffff', size: o.size || 1, drag: o.drag || 0, glow: !!o.glow });
}
function burst(x, y, col, n = 10, speed = 60, o = {}) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = speed * (0.3 + Math.random() * 0.7);
    addParticle(x, y, { vx: Math.cos(a) * s, vy: Math.sin(a) * s - speed * 0.3, col, life: 0.3 + Math.random() * 0.4, size: Math.random() < 0.4 ? 2 : 1, ...o });
  }
}
function dust(x, y, n = 4, col = '#e8e0d0') {
  for (let i = 0; i < n; i++) addParticle(x + rand(-3, 3), y - 1, { vx: rand(-30, 30), vy: rand(-25, -5), g: 20, col, life: rand(0.25, 0.45), drag: 3 });
}
function floatText(x, y, text, col = '#ffffff') { fx.texts.push({ x, y, text, col, t: 1.1 }); }
function banner(text, col = '#ffd84a', time = 1.8) {
  fx.banners = fx.banners.filter((b) => b.text !== text);
  fx.banners.push({ text, col, t: time, max: time });
}
function addShake(a) { if (Save.data.settings.shake) fx.shake = Math.max(fx.shake, a); }

function updateFx(dt) {
  const P = fx.particles;
  for (let i = P.length - 1; i >= 0; i--) {
    const p = P[i];
    p.vy += p.g * dt;
    if (p.drag) { p.vx *= 1 - p.drag * dt; p.vy *= 1 - p.drag * dt; }
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.life -= dt;
    if (p.life <= 0) P.splice(i, 1);
  }
  for (let i = fx.texts.length - 1; i >= 0; i--) { const t = fx.texts[i]; t.t -= dt; t.y -= 18 * dt; if (t.t <= 0) fx.texts.splice(i, 1); }
  for (let i = fx.banners.length - 1; i >= 0; i--) { const b = fx.banners[i]; b.t -= dt; if (b.t <= 0) fx.banners.splice(i, 1); }
  fx.shake = Math.max(0, fx.shake - dt * 14);
  fx.flash = Math.max(0, fx.flash - dt * 2.5);
}

// ---------------------------------------------------------------------
//  Camera
// ---------------------------------------------------------------------
function camBounds() {
  const L = level;
  if (cam.lock) return { x0: cam.lock.x, y0: cam.lock.y, x1: cam.lock.x + cam.lock.w - VW, y1: cam.lock.y + cam.lock.h - VH };
  return { x0: 0, y0: 0, x1: L.w * TS - VW, y1: L.h * TS - VH };
}
function updateCamera(dt, snap = false) {
  const p = player;
  const speed = Math.abs(p.vx);
  const lookTarget = p.facing * (speed > 40 ? 40 : 22);
  cam.look = approach(cam.look, lookTarget, 90 * dt);
  // look down when holding down on the ground
  if (p.onGround && Input.held.down && !p.dead) cam.lookDown = Math.min(1, cam.lookDown + dt * 1.5); else cam.lookDown = Math.max(0, cam.lookDown - dt * 4);
  let tx = p.x + p.w / 2 - VW / 2 + cam.look;
  let ty = p.y + p.h / 2 - VH / 2 - 12 + cam.lookDown * 56;
  if (p.vy > 200) ty += 30;
  const b = camBounds();
  tx = b.x1 < b.x0 ? (b.x0 + b.x1) / 2 : clamp(tx, b.x0, b.x1);
  ty = b.y1 < b.y0 ? (b.y0 + b.y1) / 2 : clamp(ty, b.y0, b.y1);
  if (snap) { cam.x = tx; cam.y = ty; return; }
  cam.x += (tx - cam.x) * Math.min(1, 7 * dt);
  const vyRate = p.vy > 150 ? 10 : 5;
  cam.y += (ty - cam.y) * Math.min(1, vyRate * dt);
  cam.x = b.x1 < b.x0 ? cam.x : clamp(cam.x, b.x0, b.x1);
  cam.y = b.y1 < b.y0 ? cam.y : clamp(cam.y, b.y0, b.y1);
  const s = fx.shake;
  cam.shakeX = s ? rand(-s, s) : 0; cam.shakeY = s ? rand(-s, s) : 0;
}

// ---- player.js ----
// =====================================================================
//  PLAYER — movement feel, abilities, damage, respawn
// =====================================================================
const PHYS = {
  JUMP_V: 315, G_UP: 900, G_CUT: 2300, G_DOWN: 1150, APEX_V: 40, MAX_FALL: 290, FAST_FALL: 370,
  ACC_G: 1150, DEC_G: 1600, ACC_A: 780, DEC_A: 400, ICE_ACC: 280, ICE_DEC: 110,
  COYOTE: 0.1, BUFFER: 0.13, WJ_X: 150, WJ_V: 300, WJ_LOCK: 0.14, SLIDE: 72, GRIP_SLIDE: 36,
  DJ_V: 285, DASH_V: 300, DASH_T: 0.15, SLAM_V: 430, SPRING_V: 470,
};

const player = {
  x: 0, y: 0, w: 10, h: 14, remX: 0, remY: 0, vx: 0, vy: 0, facing: 1,
  char: CHARACTERS[0], onGround: false, ground: null, wasGround: false, coyote: 0, buffer: 0, varJump: false, springLock: 0,
  wallDir: 0, wallLock: 0, canDouble: true, canDash: true, dashT: 0, dashCd: 0, slam: 0, slamT: 0,
  hearts: 3, maxHearts: 3, invuln: 0, hurtLock: 0, dead: false, deadT: 0, poof: 0, poofTarget: null,
  safe: null, drop: false, dropT: 0, sx: 1, sy: 1, anim: 0, dustT: 0, prevBottom: 0, trail: [], idleT: 0,
};

function has(ability) {
  const a = player.char.ability;
  return a === ability || (a === 'all' && ability !== 'slam');
}

function setupPlayer(charId) {
  const p = player;
  p.char = charById(charId);
  p.maxHearts = p.char.hearts;
  p.hearts = p.maxHearts;
}

function placePlayer(x, y) {
  const p = player;
  Object.assign(p, {
    x, y, remX: 0, remY: 0, vx: 0, vy: 0, onGround: false, ground: null, wasGround: true, coyote: 0, buffer: 0, varJump: false,
    wallDir: 0, wallLock: 0, canDouble: true, canDash: true, dashT: 0, dashCd: 0, slam: 0, slamT: 0, invuln: 0.6, hurtLock: 0,
    dead: false, deadT: 0, poof: 0, poofTarget: null, drop: false, dropT: 0, sx: 1, sy: 1, trail: [], springLock: 0,
  });
  p.safe = { x, y };
}

function respawnAtCheckpoint() {
  const L = level;
  resetDynamic();
  const cp = L.checkpoint;
  const pos = cp ? { x: cp.x + 3, y: cp.y + TS - player.h } : L.spawn;
  placePlayer(pos.x, pos.y);
  player.hearts = player.maxHearts;
  player.facing = 1;
  updateCamera(0, true);
}

// ---------------------------------------------------------------------
function updatePlayer(dt) {
  const p = player, I = Input.held, IP = Input.pressed;
  if (p.dead) {
    p.deadT -= dt;
    return;
  }
  if (p.poof > 0) { // spike / pit: brief freeze, then pop back to safe ground
    p.poof -= dt;
    if (p.poof <= 0) {
      placePlayer(p.poofTarget.x, p.poofTarget.y);
      p.invuln = 1.0;
      burst(p.x + 5, p.y + 7, '#ffffff', 12, 50);
    }
    return;
  }
  p.prevBottom = p.y + p.h;
  p.invuln = Math.max(0, p.invuln - dt);
  p.hurtLock = Math.max(0, p.hurtLock - dt);
  p.wallLock = Math.max(0, p.wallLock - dt);
  p.dashCd = Math.max(0, p.dashCd - dt);
  p.springLock = Math.max(0, p.springLock - dt);
  p.dropT = Math.max(0, p.dropT - dt);
  p.drop = p.dropT > 0;

  // riding a moving platform
  if (p.ground && p.ground.kind === 'platform') {
    const mp = p.ground.plat;
    if (mp.dx) moveX(p, mp.dx);
    if (mp.dy) { if (mp.dy < 0) moveY(p, mp.dy, false); else { p.y += mp.dy; if (solidRect(p.x, p.y, p.w, p.h)) p.y -= mp.dy; } }
  }

  let ix = p.hurtLock > 0 ? 0 : (I.right ? 1 : 0) - (I.left ? 1 : 0);
  const C = p.char;
  const onIce = p.onGround && p.ground && p.ground.kind === 'ice';
  const wind = level.weather.gust && level.weather.gust.active ? level.weather.gust.dir : 0;

  // ---- horizontal ----
  if (p.dashT > 0) {
    p.dashT -= dt;
    p.vx = p.facing * PHYS.DASH_V; p.vy = 0;
    if (Math.random() < 0.9) p.trail.push({ x: p.x, y: p.y, t: 0.25, f: p.facing });
    if (p.dashT <= 0) p.vx = p.facing * C.speed;
  } else if (p.slam === 1) {
    p.vx = 0;
  } else {
    let acc = p.onGround ? (onIce ? PHYS.ICE_ACC : PHYS.ACC_G) : PHYS.ACC_A;
    const dec = p.onGround ? (onIce ? PHYS.ICE_DEC : PHYS.DEC_G) : PHYS.DEC_A;
    if (p.wallLock > 0) { /* keep wall-jump momentum */ }
    else if (ix !== 0) {
      if (p.vx !== 0 && Math.sign(p.vx) !== ix && p.onGround && !onIce) acc *= 1.8;
      if (Math.abs(p.vx) > C.speed && Math.sign(p.vx) === ix) p.vx = approach(p.vx, ix * C.speed, dec * dt);
      else p.vx = approach(p.vx, ix * C.speed, acc * dt);
      p.facing = ix;
    } else p.vx = approach(p.vx, 0, dec * dt);
    if (wind) p.vx += wind * (p.onGround ? 260 : 420) * dt;
  }

  // ---- walls ----
  p.wallDir = 0;
  let nearWall = 0;
  if (!p.onGround && p.dashT <= 0) {
    if (solidRect(p.x + 2, p.y + 2, p.w, p.h - 4)) nearWall = 1;
    else if (solidRect(p.x - 2, p.y + 2, p.w, p.h - 4)) nearWall = -1;
    if (ix !== 0 && ix === nearWall && solidRect(p.x + ix, p.y + 2, p.w, p.h - 4) && p.vy > -20) p.wallDir = ix;
  }

  // ---- timers ----
  if (p.onGround) { p.coyote = PHYS.COYOTE; p.canDouble = true; p.canDash = true; }
  else p.coyote = Math.max(0, p.coyote - dt);
  if (p.wallDir) { p.canDash = true; }
  if (IP.jump) p.buffer = PHYS.BUFFER; else p.buffer = Math.max(0, p.buffer - dt);

  // drop through one-way platforms
  if (p.onGround && p.ground && (p.ground.kind === 'oneway' || p.ground.kind === 'platform') && I.down && IP.jump) {
    p.dropT = 0.18; p.drop = true; p.buffer = 0; p.y += 1; p.onGround = false; p.coyote = 0;
  }

  // ---- jumping ----
  if (p.buffer > 0 && p.slam === 0) {
    if (p.coyote > 0) {
      p.vy = -PHYS.JUMP_V; p.coyote = 0; p.buffer = 0; p.varJump = true;
      if (p.ground && p.ground.kind === 'platform' && p.ground.plat.dy < 0) p.vy += p.ground.plat.dy * 30;
      p.onGround = false; p.ground = null;
      p.sx = 0.72; p.sy = 1.32;
      dust(p.x + 5, p.y + p.h, 5);
      Sound.sfx('jump');
      stats.jumps++;
    } else if (nearWall !== 0) {
      const grip = has('grip');
      p.vx = -nearWall * PHYS.WJ_X; p.vy = -(grip ? PHYS.WJ_V + 30 : PHYS.WJ_V);
      p.wallLock = PHYS.WJ_LOCK; p.facing = -nearWall; p.buffer = 0; p.varJump = true;
      p.sx = 0.75; p.sy = 1.25;
      for (let i = 0; i < 6; i++) addParticle(p.x + (nearWall > 0 ? p.w : 0), p.y + rand(2, 12), { vx: -nearWall * rand(20, 60), vy: rand(-30, 10), col: '#ffffff', life: 0.3, g: 50 });
      Sound.sfx('walljump');
    } else if (has('double') && p.canDouble) {
      p.vy = -PHYS.DJ_V; p.canDouble = false; p.buffer = 0; p.varJump = true;
      p.sx = 0.8; p.sy = 1.25;
      for (let i = 0; i < 8; i++) addParticle(p.x + 5 + rand(-6, 6), p.y + p.h, { vx: rand(-40, 40), vy: rand(10, 50), col: pick(['#ffffff', '#a8dcff']), life: 0.4, g: -40 });
      Sound.sfx('djump');
    }
  }

  // ---- powers ----
  if (IP.action && p.hurtLock <= 0) {
    if (has('dash') && p.canDash && p.dashCd <= 0 && p.slam === 0) {
      if (ix) p.facing = ix;
      p.dashT = PHYS.DASH_T; p.canDash = false; p.dashCd = 0.3; p.varJump = false;
      Sound.sfx('dash'); addShake(1.5);
      burst(p.x + 5, p.y + 7, '#ffc07a', 8, 50);
    } else if (has('slam') && !p.onGround && p.slam === 0 && p.dashT <= 0) {
      p.slam = 1; p.slamT = 0.12; p.vx = 0; p.vy = -40;
      Sound.sfx('pop');
    }
  }

  // ---- gravity ----
  if (p.slam === 1) {
    p.slamT -= dt; p.vy = approach(p.vy, 0, 600 * dt);
    if (p.slamT <= 0) { p.slam = 2; p.vy = PHYS.SLAM_V; }
  } else if (p.slam === 2) {
    p.vy = PHYS.SLAM_V;
    if (Math.random() < 0.8) p.trail.push({ x: p.x, y: p.y, t: 0.18, f: p.facing });
  } else if (p.dashT <= 0) {
    if (!I.jump) p.varJump = false;
    let g;
    if (p.vy < 0) g = p.varJump || p.springLock > 0 ? PHYS.G_UP : PHYS.G_CUT;
    else g = PHYS.G_DOWN;
    if (Math.abs(p.vy) < PHYS.APEX_V && (p.varJump || p.springLock > 0)) g *= 0.5;
    p.vy += g * dt;
    let maxFall = I.down && !p.wallDir ? PHYS.FAST_FALL : PHYS.MAX_FALL;
    if (p.wallDir && p.vy > 0) {
      maxFall = has('grip') ? PHYS.GRIP_SLIDE : PHYS.SLIDE;
      if (Math.random() < 0.3) addParticle(p.x + (p.wallDir > 0 ? p.w : 0), p.y + rand(4, 12), { col: '#e8e0d0', life: 0.3, vy: -10, g: 0 });
    }
    if (p.vy > maxFall) p.vy = approach(p.vy, maxFall, 1800 * dt);
  }

  // ---- move X ----
  if (moveX(p, p.vx * dt)) {
    // ledge assist: pop up onto a ledge we only just missed
    let popped = false;
    if (!p.onGround && p.vy > -60 && p.dashT <= 0) {
      for (let up = 1; up <= 4; up++) {
        if (!solidRect(p.x + Math.sign(p.vx), p.y - up, p.w, p.h)) { p.y -= up; p.x += Math.sign(p.vx); popped = true; break; }
      }
    }
    if (!popped) {
      if (p.dashT > 0) { p.dashT = 0; p.vx = 0; addShake(1); }
      p.vx = 0; p.remX = 0;
    }
  }

  // ---- move Y ----
  const vyBefore = p.vy;
  if (moveY(p, p.vy * dt)) {
    if (vyBefore < 0) {
      // corner correction: slide around ceiling corners
      let fixed = false;
      for (let k = 1; k <= 4 && !fixed; k++) {
        for (const s of [1, -1]) {
          if (!solidRect(p.x + s * k, p.y - 1, p.w, p.h) && !solidRect(p.x + s * k, p.y, p.w, p.h)) { p.x += s * k; fixed = true; break; }
        }
      }
      if (!fixed) { p.vy = 0; p.varJump = false; }
    } else {
      p.vy = 0;
    }
  }

  // ---- ground ----
  p.wasGround = p.onGround;
  p.ground = groundUnder(p);
  p.onGround = !!p.ground && p.vy >= 0;
  if (p.onGround && !p.wasGround) onLand(vyBefore);
  if (p.onGround && p.ground.kind === 'collapse') {
    const ty = Math.floor((p.y + p.h) / TS);
    for (const g of level.collapses) if (g.state === 'idle' && g.cells.some(([x, y]) => y === ty && x >= Math.floor(p.x / TS) && x <= Math.floor((p.x + p.w - 1) / TS))) triggerCollapse(g);
  }
  if (p.onGround && p.ground.kind === 'crusher') { /* rides along via crusher update */ }

  // safe ground for spike / pit recovery
  if (p.onGround && (p.ground.kind === 'solid' || p.ground.kind === 'ice') && !hazardAt(p.x - 10, p.y - 4, p.w + 20, p.h + 8)) {
    const by = p.y + p.h;
    const supported = isSolidT(tileAt(Math.floor(p.x / TS), by / TS)) && isSolidT(tileAt(Math.floor((p.x + p.w - 1) / TS), by / TS));
    if (supported && by % TS === 0) p.safe = { x: p.x, y: p.y };
  }

  // ---- animation & juice ----
  p.sx = approach(p.sx, 1, dt * 3.5); p.sy = approach(p.sy, 1, dt * 3.5);
  p.anim += dt * (p.onGround ? Math.max(4, Math.abs(p.vx) / 9) : 6);
  if (p.onGround && Math.abs(p.vx) > 70) { p.dustT -= dt; if (p.dustT <= 0) { p.dustT = 0.13; dust(p.x + 5 - p.facing * 4, p.y + p.h, 1); } }
  if (p.onGround && Math.abs(p.vx) < 5 && !Input.held.down) p.idleT += dt; else p.idleT = 0;
  for (let i = p.trail.length - 1; i >= 0; i--) { p.trail[i].t -= dt; if (p.trail[i].t <= 0) p.trail.splice(i, 1); }

  // ---- hazards ----
  const hz = hazardAt(p.x + 1, p.y + 2, p.w - 2, p.h - 2);
  if (hz) { hazardHit(hz); return; }
  if (p.y > level.h * TS + 24) { hazardHit('pit'); return; }
}

function onLand(vy) {
  const p = player;
  if (p.slam === 2) {
    p.slam = 0;
    addShake(5); Sound.sfx('slam'); fx.hitstop = 0.05;
    burst(p.x + 5, p.y + p.h, '#e8e0d0', 18, 110);
    for (const e of enemies) {
      if (e.alive && e.type !== 'boss' && Math.abs(e.x + e.w / 2 - (p.x + 5)) < 44 && Math.abs(e.y + e.h - (p.y + p.h)) < 20) killEnemy(e, 'slam');
    }
    for (const c of level.crumbles) if (c.state === 'idle' && Math.abs(c.x + 8 - (p.x + 5)) < 24 && Math.abs(c.y - (p.y + p.h)) < 4) { c.state = 'shake'; c.t = 0.05; }
    p.sx = 1.5; p.sy = 0.6;
    return;
  }
  const k = clamp(vy / PHYS.MAX_FALL, 0, 1.2);
  p.sx = 1 + 0.35 * k; p.sy = 1 - 0.3 * k;
  if (vy > 120) { dust(p.x + 5, p.y + p.h, 4 + Math.floor(k * 4)); Sound.sfx('land'); }
}

function hazardHit(kind) {
  const p = player;
  if (p.dead || p.poof > 0) return;
  stats.hits++;
  if (!Save.data.settings.assist) p.hearts--;
  Sound.sfx('hurt'); addShake(3); fx.hitstop = 0.06;
  burst(p.x + 5, p.y + 7, kind === 'lava' ? '#ff7a1a' : '#ffffff', 14, 70);
  if (p.hearts <= 0) { killPlayer(kind); return; }
  // freeze briefly, then pop back to the last safe ground
  p.poof = 0.4; p.poofTarget = p.safe || { x: level.spawn.x, y: level.spawn.y };
  p.vx = p.vy = 0;
  floatText(p.x + 5, p.y - 4, '-1 ♥', '#ff4d6d');
}

function hurtPlayer(fromX, dmg = 1) {
  const p = player;
  if (p.dead || p.poof > 0 || p.invuln > 0) return;
  stats.hits++;
  if (!Save.data.settings.assist) p.hearts -= dmg;
  Sound.sfx('hurt'); addShake(3); fx.hitstop = 0.07;
  burst(p.x + 5, p.y + 7, '#ff4d6d', 10, 60);
  if (p.hearts <= 0) { killPlayer('hit'); return; }
  const dir = p.x + 5 < fromX ? -1 : 1;
  p.vx = dir * 150; p.vy = -210; p.invuln = 1.3; p.hurtLock = 0.28;
  p.dashT = 0; p.slam = 0; p.varJump = false;
}

function killPlayer(cause) {
  const p = player;
  if (p.dead) return;
  p.dead = true; p.deadT = 1.0; p.hearts = 0;
  stats.deaths++; level.deaths++;
  Save.data.totalDeaths++;
  Sound.sfx('death'); addShake(5); fx.hitstop = 0.12;
  const col = cause === 'lava' ? '#ff7a1a' : p.char.pal.A;
  burst(p.x + 5, p.y + 7, col, 24, 110);
  burst(p.x + 5, p.y + 7, '#ffffff', 12, 80);
}

function bouncePlayer(strong) {
  const p = player;
  p.vy = strong ? -340 : -245;
  p.varJump = strong; p.canDouble = true; p.canDash = true; p.slam = 0;
  p.sx = 0.75; p.sy = 1.3;
}

// ---------------------------------------------------------------------
function drawPlayer() {
  const p = player;
  if (p.dead) return;
  const F = ART.chars[p.char.id];
  let s, flip = p.facing < 0;
  if (p.slam) s = F.crouch;
  else if (!p.onGround) {
    if (p.wallDir) { s = F.fall; flip = p.wallDir > 0; }
    else s = p.vy < 0 ? F.jump : F.fall;
  } else if (Math.abs(p.vx) > 10) s = F.run[Math.floor(p.anim) % 4];
  else if (Input.held.down && p.onGround) s = F.crouch;
  else s = F.idle[Math.floor(p.anim * 0.4) % 2];

  // after-images (dash / slam)
  for (const t of p.trail) {
    ctx.globalAlpha = (t.t / 0.25) * 0.5;
    ctx.drawImage(silhouetteCached(s, t.f < 0, p.char.pal.h), Math.round(t.x) - 4, Math.round(t.y) - 4);
  }
  ctx.globalAlpha = 1;
  if (p.invuln > 0 && Math.floor(p.invuln * 14) % 2 === 0 && p.poof <= 0) return;
  const img = p.poof > 0 ? whiteOf(s, flip) : (flip ? s.f : s.c);
  const cx = Math.round(p.x + p.w / 2), by = Math.round(p.y + p.h);
  if (Math.abs(p.sx - 1) < 0.02 && Math.abs(p.sy - 1) < 0.02) {
    ctx.drawImage(img, cx - 9, by - 18 + 0);
  } else {
    const w = img.width * p.sx, h = img.height * p.sy;
    ctx.drawImage(img, Math.round(cx - w / 2), Math.round(by - h + 1 * p.sy), Math.round(w), Math.round(h));
  }
}
const _silCache = new Map();
function silhouetteCached(s, flip, col) {
  const key = s.c;
  let e = _silCache.get(key);
  if (!e) { const a = silhouette(s.c, col); e = { a, f: flipCanvas(a) }; _silCache.set(key, e); }
  return flip ? e.f : e.a;
}

// ---- enemies.js ----
// =====================================================================
//  ENEMIES — walkers, flyers, shooters, mimic and the Stormbeak boss
// =====================================================================
let enemies = [];

function makeEnemy(type, tx, ty, extra = {}) {
  const px = tx * TS, py = ty * TS;
  const b = { type, alive: true, dying: false, remX: 0, remY: 0, vx: 0, vy: 0, dir: -1, t: rand(0, 1), anim: rand(0, 2), stompable: true, harmful: true, flash: 0, dropIn: 0, ...extra };
  switch (type) {
    case 'beetle': return { ...b, x: px + 2, y: py + 7, w: 12, h: 9, speed: 30 };
    case 'spiny': return { ...b, x: px + 2, y: py + 7, w: 12, h: 9, speed: 22, stompable: false };
    case 'bat': return { ...b, x: px + 2, y: py + 1, w: 12, h: 8, state: 'hang', hx: px + 2, hy: py + 1 };
    case 'plant': return { ...b, x: px + 2, y: py + 4, w: 12, h: 12, state: 'idle', t: 1.2 + rand(0, 0.8) };
    case 'wasp': return { ...b, x: px + 2, y: py + 4, w: 12, h: 8, ox: px + 2, oy: py + 4, axis: 'x', range: 44 };
    case 'waspV': return { ...b, x: px + 2, y: py + 4, w: 12, h: 8, ox: px + 2, oy: py + 4, axis: 'y', range: 36 };
    case 'slime': return { ...b, x: px + 2, y: py + 8, w: 12, h: 8, t: 0.8 + rand(0, 0.8) };
    case 'mimic': return { ...b, x: px + 2, y: py + 6, w: 12, h: 10, state: 'hidden', harmful: false, stompable: false };
    case 'boss': return { ...b, x: px, y: py, w: 26, h: 22, hp: 3, state: 'sleep', awake: false, phase: 1, stompable: false, dives: 0, hx: px, hy: py };
  }
  throw new Error('unknown enemy ' + type);
}

function spawnEnemies() {
  enemies = [];
  for (const s of level.enemySpawns) {
    if (s.type === 'mimic' && level.gems.some((g) => g.id === s.gemId && g.got)) continue;
    enemies.push(makeEnemy(s.type, s.tx, s.ty, { gemId: s.gemId }));
  }
}

function standable(x, y) {
  const t = tileAt(Math.floor(x / TS), Math.floor(y / TS));
  if (isSolidT(t)) return true;
  if (t === T.ONEWAY && y % TS === 0) return true;
  for (const c of level.crumbles) if (c.state !== 'gone' && rectHit(x, y, 1, 1, c.x, c.y, c.w, c.h)) return true;
  return false;
}

function killEnemy(e, how) {
  if (!e.alive) return;
  if (e.type === 'boss') return;
  e.alive = false; e.dying = true; e.vy = -170; e.vx = how === 'slam' ? rand(-60, 60) : rand(-30, 30);
  level.kills++; stats.kills++;
  const col = { beetle: '#e8434f', spiny: '#a8693f', bat: '#8a64e0', plant: '#ff5a7a', wasp: '#ffd84a', waspV: '#ffd84a', slime: '#3ad1b5' }[e.type] || '#ffffff';
  burst(e.x + e.w / 2, e.y + e.h / 2, col, 12, 80);
  if (how !== 'lava' && how !== 'crush') Sound.sfx('stomp');
}

function walk(e, dt) {
  e.vy = Math.min(e.vy + 900 * dt, 300);
  if (moveY(e, e.vy * dt)) e.vy = 0;
  const g = groundUnder(e);
  if (g) {
    const ahead = e.dir > 0 ? e.x + e.w : e.x - 1;
    if (!standable(ahead, e.y + e.h) || hazardAt(ahead - (e.dir > 0 ? 0 : 1), e.y, 2, e.h + 2)) e.dir *= -1;
    if (g.kind === 'platform') { e.x += g.plat.dx; e.y += g.plat.dy; }
  }
  if (moveX(e, e.dir * e.speed * dt)) e.dir *= -1;
}

function updateEnemies(dt) {
  const px = player.x + player.w / 2, py = player.y + player.h / 2;
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    e.anim += dt; e.flash = Math.max(0, e.flash - dt);
    if (e.dying) {
      e.vy += 700 * dt; e.x += e.vx * dt; e.y += e.vy * dt;
      if (e.y > cam.y + VH + 60) enemies.splice(i, 1);
      continue;
    }
    if (!e.alive) continue;
    if (e.dropIn > 0) { e.dropIn -= dt; if (e.dropIn <= 0) burst(e.x + 6, e.y, '#ffffff', 6, 40); continue; }
    const ex = e.x + e.w / 2, ey = e.y + e.h / 2;
    switch (e.type) {
      case 'beetle': case 'spiny': walk(e, dt); break;
      case 'bat': updateBat(e, dt, px, py, ex, ey); break;
      case 'plant':
        e.dir = px < ex ? -1 : 1;
        if (Math.abs(px - ex) < 170 && Math.abs(py - ey) < 64 && !player.dead) {
          e.t -= dt;
          e.state = e.t < 0.45 ? 'open' : 'idle';
          if (e.t <= 0) {
            e.t = 2.2; e.state = 'idle';
            level.projectiles.push({ kind: 'seed', x: ex + e.dir * 6 - 2, y: e.y + 4, w: 5, h: 5, vx: e.dir * 115, vy: 0, g: 0, life: 3 });
            Sound.sfx('spit');
          }
        } else { e.t = Math.max(e.t, 0.8); e.state = 'idle'; }
        break;
      case 'wasp': case 'waspV': {
        e.t += dt;
        const s = Math.sin(e.t * 1.6);
        if (e.axis === 'x') { e.x = Math.round(e.ox + s * e.range); e.dir = Math.cos(e.t * 1.6) >= 0 ? 1 : -1; e.y = Math.round(e.oy + Math.sin(e.t * 5) * 2); }
        else { e.y = Math.round(e.oy + s * e.range); e.dir = px < ex ? -1 : 1; }
        break;
      }
      case 'slime': {
        e.vy = Math.min(e.vy + 900 * dt, 300);
        const hitX = moveX(e, e.vx * dt);
        if (hitX) e.vx = -e.vx * 0.5;
        if (moveY(e, e.vy * dt)) { if (e.vy > 0) { e.vx = 0; } e.vy = 0; }
        e.onGround = !!groundUnder(e);
        if (e.onGround) {
          e.t -= dt;
          if (e.t <= 0 && Math.abs(px - ex) < 150 && Math.abs(py - ey) < 80) {
            e.dir = px < ex ? -1 : 1;
            e.vy = -230; e.vx = e.dir * 62; e.t = 1.3; Sound.sfx('bounce');
            // don't hop off a ledge into a hazard
            if (!standable(ex + e.dir * 30, e.y + e.h) && !standable(ex + e.dir * 46, e.y + e.h)) e.vx = 0;
          }
        }
        break;
      }
      case 'mimic': updateMimic(e, dt, px, py, ex, ey); break;
      case 'boss': updateBoss(e, dt, px, py); break;
    }
    if (e.y > level.h * TS + 32) { e.alive = false; enemies.splice(i, 1); }
  }
  updateProjectiles(dt);
}

function updateBat(e, dt, px, py, ex, ey) {
  if (e.state === 'hang') {
    if (!player.dead && Math.abs(px - ex) < 78 && py > e.y && py - e.y < 140) { e.state = 'wake'; e.t = 0.4; Sound.sfx('squeak'); }
    return;
  }
  if (e.state === 'wake') { e.t -= dt; if (e.t <= 0) { e.state = 'chase'; e.t = 0; } return; }
  if (e.state === 'chase') {
    e.t += dt;
    const dx = px - ex, dy = py - ey, d = Math.hypot(dx, dy) || 1;
    e.vx = approach(e.vx, (dx / d) * 62, 140 * dt);
    e.vy = approach(e.vy, (dy / d) * 62 + Math.sin(e.t * 7) * 30, 160 * dt);
    e.dir = dx < 0 ? -1 : 1;
    if (e.t > 6 || Math.hypot(ex - e.hx, ey - e.hy) > 230 || player.dead) e.state = 'return';
  } else if (e.state === 'return') {
    const dx = e.hx - e.x, dy = e.hy - e.y, d = Math.hypot(dx, dy) || 1;
    e.vx = (dx / d) * 55; e.vy = (dy / d) * 55;
    if (d < 3) { e.x = e.hx; e.y = e.hy; e.vx = e.vy = 0; e.state = 'hang'; return; }
  }
  if (moveX(e, e.vx * dt)) e.vx = -e.vx;
  if (moveY(e, e.vy * dt, false)) e.vy = -e.vy * 0.5;
}

function updateMimic(e, dt, px, py, ex, ey) {
  if (e.state === 'hidden') {
    if (!player.dead && Math.hypot(px - ex, py - ey) < 60) {
      e.state = 'alert'; e.t = 0.45; e.vy = -170; Sound.sfx('nope');
      floatText(ex, e.y - 8, '!', '#ff3a5a');
    }
    return;
  }
  e.vy = Math.min(e.vy + 900 * dt, 300);
  if (moveY(e, e.vy * dt)) e.vy = 0;
  const g = groundUnder(e);
  if (e.state === 'alert') { e.t -= dt; if (e.t <= 0 && g) e.state = 'flee'; return; }
  // run away from the player, hop over things
  e.dir = px < ex ? 1 : -1;
  const ahead = e.dir > 0 ? e.x + e.w : e.x - 1;
  let speed = 74;
  if (g && (!standable(ahead, e.y + e.h) || solidRect(e.x + e.dir * 3, e.y, e.w, e.h))) {
    if (Math.random() < 0.06) e.vy = -240; else speed = 0;
  }
  if (g && Math.random() < 0.012) e.vy = -200;
  moveX(e, e.dir * speed * dt);
}

// ---------------------------------------------------------------------
function updateProjectiles(dt) {
  const P = level.projectiles;
  for (let i = P.length - 1; i >= 0; i--) {
    const p = P[i];
    p.vy += (p.g || 0) * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
    if (p.kind === 'wave' && Math.random() < 0.5) addParticle(p.x + 5, p.y + 6, { col: '#bfe4ff', life: 0.25, vy: rand(-40, -10), g: 0 });
    const hitWall = p.kind === 'wave' ? solidRect(p.x + 2, p.y, p.w - 4, p.h - 2) : solidRect(p.x, p.y, p.w, p.h);
    if (hitWall || p.life <= 0) {
      burst(p.x + p.w / 2, p.y + p.h / 2, p.kind === 'seed' ? '#ffcf5a' : '#bfe4ff', 5, 40);
      P.splice(i, 1); continue;
    }
    if (!player.dead && rectHit(player.x + 1, player.y + 1, player.w - 2, player.h - 2, p.x, p.y, p.w, p.h)) {
      hurtPlayer(p.x + p.w / 2);
      P.splice(i, 1);
    }
  }
}

// Player vs enemy contact
function enemyContacts() {
  const p = player;
  if (p.dead || p.poof > 0) return;
  for (const e of enemies) {
    if (!e.alive || e.dropIn > 0) continue;
    if (!rectHit(p.x, p.y, p.w, p.h, e.x, e.y, e.w, e.h)) continue;
    if (e.type === 'mimic') {
      if (e.state !== 'alert' || e.t < 0.3) catchMimic(e);
      continue;
    }
    if (e.type === 'boss') { bossContact(e); continue; }
    const fromAbove = p.vy > 0 && p.prevBottom <= e.y + 6;
    if (p.slam === 2) { killEnemy(e, 'slam'); fx.hitstop = 0.04; continue; }
    if (p.dashT > 0 && e.stompable) { killEnemy(e, 'dash'); fx.hitstop = 0.05; addShake(2); continue; }
    if (fromAbove && e.stompable) {
      killEnemy(e, 'stomp'); bouncePlayer(Input.held.jump); fx.hitstop = 0.05; addShake(1.5);
      continue;
    }
    if (fromAbove && !e.stompable) { hurtPlayer(e.x + e.w / 2); if (!p.dead) p.vy = -260; continue; }
    hurtPlayer(e.x + e.w / 2);
  }
}

function catchMimic(e) {
  e.alive = false;
  const g = level.gems.find((g) => g.id === e.gemId);
  if (g) g.got = true;
  collectGemFx(e.x + 6, e.y + 5);
  floatText(e.x + 6, e.y - 6, 'GOTCHA!', '#4ae0ff');
  enemies.splice(enemies.indexOf(e), 1);
}

// ---------------------------------------------------------------------
//  STORMBEAK — the boss
// ---------------------------------------------------------------------
function bossArena() { return level.arena || { x: level.spawn.x - VW / 2, y: 0, w: VW, h: VH }; }

function updateBoss(b, dt, px, py) {
  const A = bossArena();
  const hoverY = A.y + 34;
  b.t += dt;
  const fly = (tx, ty, sp) => {
    const dx = tx - b.x, dy = ty - b.y, d = Math.hypot(dx, dy);
    if (d < 2) { b.x = tx; b.y = ty; return true; }
    const s = Math.min(d, sp * dt); b.x += (dx / d) * s; b.y += (dy / d) * s; return false;
  };
  b.dir = px < b.x + b.w / 2 ? -1 : 1;
  switch (b.state) {
    case 'sleep':
      if (b.awake) { b.state = 'intro'; b.t = 0; Sound.sfx('screech'); banner('STORMBEAK', '#ff3a5a', 2.2); addShake(4); }
      break;
    case 'intro':
      fly(A.x + A.w / 2 - b.w / 2, hoverY, 90);
      if (b.t > 2.2) { b.state = 'hover'; b.t = 0; b.shot = false; }
      break;
    case 'hover': {
      const tx = clamp(px - b.w / 2, A.x + 8, A.x + A.w - b.w - 8);
      b.x = approach(b.x, tx, (60 + b.phase * 18) * dt);
      b.y = approach(b.y, hoverY + Math.sin(b.t * 3) * 6, 80 * dt);
      const dur = [0, 2.0, 1.7, 1.4][b.phase];
      if (b.phase >= 2 && !b.shot && b.t > dur * 0.45) {
        b.shot = true; Sound.sfx('spit');
        const ang = Math.atan2(py - (b.y + 12), px - (b.x + 13));
        const n = b.phase === 3 ? 5 : 3;
        for (let i = 0; i < n; i++) {
          const a = ang + (i - (n - 1) / 2) * 0.28;
          level.projectiles.push({ kind: 'feather', x: b.x + 11, y: b.y + 12, w: 6, h: 5, vx: Math.cos(a) * 125, vy: Math.sin(a) * 125, g: 0, life: 4 });
        }
      }
      if (b.phase === 3 && !b.bolted && b.t > dur * 0.2) {
        b.bolted = true;
        for (const off of [-56, 56]) {
          const bx = clamp(px + off, A.x + 12, A.x + A.w - 12);
          level.weather.bolts.push({ x: bx, ground: groundYAt(bx, A.y + 40), t: 0.9, strike: 0 });
        }
      }
      if (b.t > dur) { b.state = 'aim'; b.t = 0; b.bolted = false; Sound.sfx('screech'); }
      break;
    }
    case 'aim':
      b.y = approach(b.y, hoverY - 8, 40 * dt);
      b.targetX = clamp(px - b.w / 2, A.x + 4, A.x + A.w - b.w - 4);
      b.x = approach(b.x, b.targetX, 120 * dt);
      if (b.t > [0, 0.6, 0.5, 0.42][b.phase]) { b.state = 'dive'; b.t = 0; b.vy = 80; }
      break;
    case 'dive': {
      b.vy = Math.min(b.vy + 1600 * dt, 460);
      let landed = false;
      for (let i = 0, n = Math.round(b.vy * dt); i < n; i++) {
        if (solidRect(b.x, b.y + 1, b.w, b.h) || onewayUnder(b.x, b.y, b.w, b.h)) { landed = true; break; }
        b.y += 1;
      }
      if (landed) {
        b.state = 'stunned'; b.t = 0; b.dives++;
        addShake(5); Sound.sfx('slam');
        burst(b.x + 13, b.y + b.h, '#c8d0e0', 20, 110);
        if (b.phase >= 2) for (const d of [-1, 1]) level.projectiles.push({ kind: 'wave', x: b.x + 13 - 5 + d * 14, y: b.y + b.h - 10, w: 10, h: 10, vx: d * 120, vy: 0, g: 0, life: 3 });
      }
      break;
    }
    case 'stunned':
      if (b.t > [0, 2.0, 1.7, 1.4][b.phase]) {
        if (b.phase >= 2 && b.dives % 2 === 1) { b.state = 'aim'; b.t = 0; b.y -= 4; } else { b.state = 'recover'; b.t = 0; }
      }
      break;
    case 'hurt':
      b.y = approach(b.y, hoverY, 140 * dt);
      if (b.t > 0.9) { b.state = b.hp <= 0 ? 'dying' : 'recover'; b.t = 0; }
      break;
    case 'recover':
      if (fly(b.x, hoverY, 120)) { b.state = 'hover'; b.t = 0; b.shot = false; }
      break;
    case 'dying':
      b.y += 14 * dt;
      if (Math.random() < 0.25) { burst(b.x + rand(0, 26), b.y + rand(0, 22), pick(['#ffd84a', '#2f3566', '#ffffff']), 8, 80); Sound.sfx('crack'); }
      addShake(1.5);
      if (b.t > 2.4) {
        b.alive = false;
        Sound.sfx('explode'); addShake(8); fx.flash = 0.8; fx.flashCol = '#ffffff';
        for (let i = 0; i < 40; i++) addParticle(b.x + 13, b.y + 11, { vx: rand(-120, 120), vy: rand(-160, 40), col: pick(['#2f3566', '#56609e', '#ffd84a']), life: rand(0.8, 1.6), g: 120, size: 2 });
        bossDefeated(b);
      }
      break;
  }
}

function bossContact(b) {
  const p = player;
  if (['sleep', 'dying', 'hurt'].includes(b.state) || !b.alive) return;
  const fromAbove = p.vy > 0 && p.prevBottom <= b.y + 8;
  if (b.state === 'stunned') {
    if (fromAbove || p.slam === 2) {
      b.hp--; b.phase = Math.min(3, 4 - b.hp); b.state = 'hurt'; b.t = 0; b.flash = 0.9;
      Sound.sfx('bosshit'); addShake(6); fx.hitstop = 0.12;
      burst(b.x + 13, b.y + 4, '#ffd84a', 16, 100);
      bouncePlayer(true); p.vy = -360;
      if (b.hp > 0) banner(b.hp === 2 ? 'IT\'S GETTING ANGRY!' : 'ONE MORE HIT!', '#ff9a5a', 1.5);
    }
    return; // stunned boss doesn't hurt on touch
  }
  if (fromAbove) { bouncePlayer(Input.held.jump); Sound.sfx('bounce'); return; }
  hurtPlayer(b.x + b.w / 2);
}

function bossDefeated(b) {
  const A = bossArena();
  level.dawnGem = { x: A.x + A.w / 2 - 8, y: A.y + 20, ty: groundYAt(A.x + A.w / 2, A.y + 40) - 40, got: false, t: 0 };
  level.sunrise = 0.001;
  level.weather.lightning = false; level.weather.bolts = [];
  banner('STORMBEAK DEFEATED!', '#ffd84a', 2.6);
  Sound.Music.play('victory');
}

// ---------------------------------------------------------------------
function drawEnemies() {
  for (const e of enemies) {
    if (e.dropIn > 0) {
      if (Math.floor(e.dropIn * 8) % 2 === 0) Font.draw('!', e.x + 4, e.y - 2, { color: '#ff3a5a', outline: true });
      continue;
    }
    const flip = e.dir < 0;
    const f2 = Math.floor(e.anim * 6) % 2;
    let s = null, ox = 2, oy = 1;
    switch (e.type) {
      case 'beetle': s = ART.beetle[f2]; ox = 2; oy = 1; break;
      case 'spiny': s = ART.spiny[f2]; ox = 2; oy = 1; break;
      case 'bat': s = e.state === 'hang' ? ART.batHang : ART.bat[Math.floor(e.anim * 9) % 2]; ox = 2; oy = e.state === 'hang' ? 1 : 1; break;
      case 'plant': s = ART.plant[e.state === 'open' ? 1 : 0]; ox = 2; oy = 0; break;
      case 'wasp': case 'waspV': s = ART.wasp[Math.floor(e.anim * 14) % 2]; ox = 2; oy = 1; break;
      case 'slime': s = ART.slime[e.vy !== 0 ? 1 : 0]; ox = 2; oy = 0; break;
      case 'mimic':
        if (e.state === 'hidden') { s = ART.gem[0]; ox = 0; oy = Math.round(Math.sin(level.time * 4 + e.x) * 1.5); }
        else s = ART.mimic[Math.floor(e.anim * 10) % 2], ox = 0, oy = 0;
        break;
      case 'boss': drawBoss(e); continue;
    }
    if (!s) continue;
    const img = e.flash > 0 ? whiteOf(s, flip) : flip ? s.f : s.c;
    if (e.dying) {
      ctx.save(); ctx.translate(Math.round(e.x + e.w / 2), Math.round(e.y + e.h / 2)); ctx.scale(1, -1);
      ctx.drawImage(img, -Math.floor(img.width / 2), -Math.floor(img.height / 2)); ctx.restore();
      continue;
    }
    ctx.drawImage(img, Math.round(e.x) - ox - 1, Math.round(e.y) - oy - 1);
    if (e.type === 'bat' && e.state === 'wake') Font.draw('!', e.x + 4, e.y - 10, { color: '#ffd84a', outline: true });
  }
  for (const p of level.projectiles) {
    const s = p.kind === 'seed' ? ART.seed : p.kind === 'feather' ? ART.feather : null;
    if (s) ctx.drawImage(p.vx < 0 ? s.f : s.c, Math.round(p.x) - 1, Math.round(p.y) - 1);
    else { // energy wave
      ctx.fillStyle = '#bfe4ff'; ctx.fillRect(Math.round(p.x) + 2, Math.round(p.y) + 2, 6, 8);
      ctx.fillStyle = '#ffffff'; ctx.fillRect(Math.round(p.x) + 4, Math.round(p.y), 2, 10);
    }
  }
}

function drawBoss(b) {
  if (!b.alive) return;
  const set = b.flash > 0 && Math.floor(b.flash * 12) % 2 ? ART.bossHurt : ART.boss;
  let s;
  if (b.state === 'stunned') s = set.stun;
  else if (b.state === 'dive') s = set.down;
  else s = [set.up, set.mid, set.down, set.mid][Math.floor(b.t * 10) % 4];
  const flip = b.dir < 0;
  let dx = 0;
  if (b.state === 'aim' || b.state === 'dying') dx = rand(-1.5, 1.5);
  ctx.drawImage(flip ? s.f : s.c, Math.round(b.x + dx) - (flip ? 9 : 7), Math.round(b.y) - 10);
  if (b.state === 'aim' && Math.floor(b.t * 12) % 2 === 0) {
    ctx.fillStyle = 'rgba(255,58,90,0.35)';
    ctx.fillRect(Math.round(b.targetX), b.y + b.h, b.w, bossArena().y + bossArena().h - b.y);
  }
  if (b.state === 'stunned') {
    for (let i = 0; i < 3; i++) {
      const a = b.t * 5 + (i * Math.PI * 2) / 3;
      Font.draw('★', b.x + 13 + Math.cos(a) * 12 - 3, b.y - 6 + Math.sin(a) * 3, { color: '#ffd84a', shadow: false });
    }
  }
}

// ---- game.js ----
// =====================================================================
//  GAMEPLAY — the play screen: update order, pickups, rendering, HUD
// =====================================================================
const stats = { jumps: 0, deaths: 0, kills: 0, hits: 0 };
let gemCombo = 0, gemComboT = 0;
const iris = { t: 0, dir: 0, cb: null, cx: VW / 2, cy: VH / 2 };
let SPIKE_IMG = null;

function collectGemFx(x, y) {
  gemCombo = gemComboT > 0 ? gemCombo + 1 : 0; gemComboT = 0.7;
  Sound.sfx('gem', gemCombo);
  burst(x, y, '#4ae0ff', 8, 55); burst(x, y, '#ffffff', 4, 30);
}
function gemsGot() { return level.gems.filter((g) => g.got).length; }

function springContacts() {
  const p = player;
  for (const s of level.springs) {
    if (p.vy >= 0 && p.prevBottom <= s.y + 10 && rectHit(p.x, p.y, p.w, p.h, s.x + 2, s.y + 7, 12, 9)) {
      p.y = s.y + 7 - p.h; p.remY = 0; p.vy = -PHYS.SPRING_V; p.springLock = 0.55; p.varJump = false;
      p.canDouble = true; p.canDash = true; p.slam = 0; p.onGround = false; p.ground = null; p.coyote = 0;
      p.sx = 0.6; p.sy = 1.45; s.t = 0.22;
      Sound.sfx('spring'); burst(s.x + 8, s.y + 8, '#ffffff', 8, 50);
    }
  }
}

const PlayScreen = {
  levelIdx: 0,
  enter(idx) {
    this.levelIdx = idx;
    startLevel(idx);
    setupPlayer(Save.data.char);
    placePlayer(level.spawn.x, level.spawn.y);
    Object.assign(stats, { jumps: 0, deaths: 0, kills: 0, hits: 0 });
    fx.particles = []; fx.texts = []; fx.banners = []; fx.weather = [];
    updateCamera(0, true);
    this.cleared = false; this.clearOpened = false; this.introT = 3.2; this.clearT = 0;
    const save = Save.level(idx);
    level.ghost = new Set(save.gems);
    Sound.Music.play(level.def.music || THEMES[level.theme].music);
    iris.t = 0; iris.dir = 1; iris.cb = null;
    initWeatherParticles();
    if (!SPIKE_IMG) { const B = PixBuf(TS, TS); paintSpike((x, y, c) => B.put(x, y, c), '^'); SPIKE_IMG = B.done(); }
  },
  restartLevel() { this.enter(this.levelIdx); },

  update(dt) {
    if (iris.dir !== 0) {
      iris.t = clamp(iris.t + iris.dir * dt * 2.6, 0, 1);
      if (iris.dir < 0 && iris.t <= 0) { iris.dir = 1; const cb = iris.cb; iris.cb = null; if (cb) cb(); }
      else if (iris.dir > 0 && iris.t >= 1) iris.dir = 0;
    }
    if (this.cleared) { this.updateCleared(dt); return; }
    if (Input.pressed.pause && iris.dir >= 0) { Screens.open(PauseScreen); return; }
    if (Input.pressed.retry && !player.dead && iris.dir === 0) {
      iris.cx = player.x + 5 - cam.x; iris.cy = player.y + 7 - cam.y;
      iris.dir = -1; iris.cb = () => respawnAtCheckpoint();
      Sound.sfx('back');
    }
    if (fx.hitstop > 0) { fx.hitstop -= dt; updateFx(dt * 0.2); return; }
    this.introT -= dt;
    gemComboT -= dt;
    const L = level;
    if (!player.dead) L.time += dt;
    updatePlatforms(dt);
    updatePlayer(dt);
    updateCrumbles(dt); updateCollapses(dt); updateSprings(dt); updateCrushers(dt); updateStals(dt);
    updateRocks(dt); updateBoulders(dt); updateLava(dt); updateWeather(dt); updateEvents(dt);
    updateFinishHop(dt); updatePopSpikes(dt); updateSecrets(dt);
    updateEnemies(dt); enemyContacts();
    this.pickups(dt);
    L.darkness = approach(L.darkness, L.darkTarget, dt * 0.8);
    if (L.sunrise) L.sunrise = Math.min(1, L.sunrise + dt * 0.25);
    if (player.dead && player.deadT <= 0.55 && iris.dir === 0) {
      iris.cx = player.x + 5 - cam.x; iris.cy = player.y + 7 - cam.y;
      iris.dir = -1; iris.cb = () => respawnAtCheckpoint();
    }
    updateCamera(dt);
    updateFx(dt);
    updateWeatherParticles(dt);
  },

  pickups(dt) {
    const p = player, L = level;
    if (p.dead || p.poof > 0) return;
    for (const g of L.gems) {
      if (g.got || g.mimic) continue;
      if (rectHit(p.x, p.y, p.w, p.h, g.x, g.y, 12, 10)) { g.got = true; collectGemFx(g.x + 6, g.y + 5); }
    }
    for (const h of L.hearts) {
      if (h.got || p.hearts >= p.maxHearts) continue;
      if (rectHit(p.x, p.y, p.w, p.h, h.x, h.y, 9, 8)) {
        h.got = true; p.hearts++; Sound.sfx('heart'); burst(h.x + 4, h.y + 4, '#ff4d6d', 10, 50); floatText(h.x + 4, h.y - 4, '+1 ♥', '#ff4d6d');
      }
    }
    springContacts();
    for (const cp of L.checkpoints) {
      if (cp.active) continue;
      if (rectHit(p.x, p.y, p.w, p.h, cp.x - 2, cp.y - 8, 20, 24)) {
        cp.active = true; cp.t = 0;
        L.checkpoint = cp;
        cp.midRise = !!(L.lava && L.lava.active);
        p.hearts = Math.max(p.hearts, p.maxHearts);
        Sound.sfx('checkpoint'); burst(cp.x + 10, cp.y + 2, '#7aff9a', 16, 70);
        floatText(cp.x + 8, cp.y - 14, 'CHECKPOINT', '#7aff9a');
      }
    }
    L.activeSign = null;
    for (const s of L.signs) if (rectHit(p.x, p.y, p.w, p.h, s.x - 6, s.y, TS + 12, TS)) L.activeSign = s;
    const F = L.finish;
    if (F && !F.hop) {
      const ev = L.events.find((e) => e.type === 'flagRun');
      const pending = ev && F.hops < (ev.markers || []).length;
      if (!pending && rectHit(p.x, p.y, p.w, p.h, F.x - 2, F.y - 16, 20, 32)) this.complete();
    }
    const D = L.dawnGem;
    if (D && !D.got) {
      D.t += dt; D.y = approach(D.y, D.ty, 30 * dt);
      if (rectHit(p.x, p.y, p.w, p.h, D.x, D.y, 16, 14)) { D.got = true; this.complete(); }
    }
  },

  complete() {
    const L = level;
    this.cleared = true; this.clearT = 0;
    Sound.sfx('clear');
    if (!L.dawnGem) Sound.Music.stop();
    burst(player.x + 5, player.y, '#ffd84a', 30, 120);
    player.vx = 0;
    // record results
    const save = Save.level(this.levelIdx);
    const got = L.gems.filter((g) => g.got).map((g) => g.id);
    const newGems = got.filter((id) => !save.gems.includes(id)).length;
    save.gems = [...new Set([...save.gems, ...got])];
    const firstClear = !save.done;
    const newBest = save.best == null || L.time < save.best;
    if (newBest) save.best = L.time;
    save.done = true;
    save.deaths += L.deaths;
    const allGems = got.length >= L.gemTotal;
    const fast = L.time <= (L.def.par || 999);
    save.stars = [true, save.stars[1] || save.gems.length >= L.gemTotal, save.stars[2] || fast];
    const unlockedBefore = Save.data.unlocked;
    Save.data.unlocked = Math.max(Save.data.unlocked, Math.min(LEVELS.length, this.levelIdx + 2));
    let unlockedChar = null;
    if (this.levelIdx === LEVELS.length - 1 && !Save.data.secret) { Save.data.secret = true; unlockedChar = 'golden'; }
    Save.write();
    this.result = {
      time: L.time, best: save.best, newBest: newBest && !firstClear, gems: got.length, total: L.gemTotal, deaths: L.deaths, kills: L.kills,
      secrets: L.secretsFound, secretTotal: L.secrets.length, stars: [true, allGems, fast], newGems, unlockedChar,
      unlockedLevel: Save.data.unlocked > unlockedBefore,
    };
  },

  updateCleared(dt) {
    this.clearT += dt;
    updateFx(dt); updateWeatherParticles(dt);
    updateEnemies(dt);
    // celebratory hops
    const p = player;
    p.vy += 900 * dt; if (moveY(p, p.vy * dt)) { p.vy = 0; }
    p.onGround = !!groundUnder(p);
    if (p.onGround && this.clearT < 1.6 && this.clearT > 0.2) { p.vy = -220; p.sx = 0.8; p.sy = 1.2; }
    p.sx = approach(p.sx, 1, dt * 3); p.sy = approach(p.sy, 1, dt * 3);
    p.anim += dt * 5;
    if (level.sunrise) level.sunrise = Math.min(1, level.sunrise + dt * 0.25);
    updateCamera(dt);
    if (this.clearT > 1.5 && Math.random() < 0.15) burst(cam.x + rand(40, VW - 40), cam.y + rand(30, 100), pick(['#ffd84a', '#4ae0ff', '#ff7aa8', '#7aff9a']), 12, 70, { g: 60 });
    if (this.clearT > 1.8 && !this.clearOpened) { this.clearOpened = true; Screens.open(ClearScreen); }
  },

  render() {
    renderWorld();
    renderHUD();
    if (iris.dir !== 0 || iris.t < 1) drawIris(iris.t, iris.cx, iris.cy);
  },
};

// ---------------------------------------------------------------------
//  Background
// ---------------------------------------------------------------------
function drawBackground() {
  const L = level, th = THEMES[L.theme];
  const maxY = Math.max(1, L.h * TS - VH);
  const alt = L.h * TS > VH * 2 ? 1 - cam.y / maxY : 0;
  let top = mixColor(th.sky[0], th.skyHigh[0], alt), bot = mixColor(th.sky[1], th.skyHigh[1], alt);
  if (L.sunrise) { top = mixColor(top, '#ff9a6a', L.sunrise * 0.8); bot = mixColor(bot, '#ffe0a0', L.sunrise); }
  const g = ctx.createLinearGradient(0, 0, 0, VH);
  g.addColorStop(0, top); g.addColorStop(1, bot);
  ctx.fillStyle = g; ctx.fillRect(0, 0, VW, VH);
  const t = L.time;
  if (L.bg.stars || L.theme === 'storm' || L.theme === 'cave' || alt > 0.6) {
    for (let i = 0; i < 40; i++) {
      const sx = (((i * 97 + 13) % VW) - cam.x * 0.02 + VW * 4) % VW, sy = (i * 53) % 120;
      if (Math.sin(t * 2 + i) > 0.6 || L.theme === 'cave') continue;
      ctx.fillStyle = L.theme === 'cave' ? 'rgba(160,140,255,0.35)' : 'rgba(255,255,255,0.7)';
      ctx.fillRect(Math.floor(sx), sy, 1, 1);
    }
  }
  if (th.sun || L.sunrise) {
    const sy = L.sunrise ? lerp(150, 40, easeOutCubic(L.sunrise)) : 30 + alt * 10;
    const sx = 300 - cam.x * 0.02 % 40;
    ctx.fillStyle = 'rgba(255,255,220,0.25)'; circle(sx, sy, 18);
    ctx.fillStyle = L.sunrise ? '#ffd27a' : th.sun || '#fff4c0'; circle(sx, sy, 12);
  }
  if (th.clouds) {
    const camDY = (maxY - cam.y);
    for (let i = 0; i < 9; i++) {
      const c = ART.clouds[i % ART.clouds.length];
      const wx = (i * 173 + t * (3 + (i % 3) * 2) - cam.x * (0.1 + (i % 3) * 0.04)) % (VW + 140);
      const x = ((wx + VW + 140) % (VW + 140)) - 70;
      const y = 14 + ((i * 37) % 70) + camDY * 0.15 - (i % 2) * 120 * (alt > 0 ? 1 : 0);
      if (y > -30 && y < VH) { ctx.globalAlpha = 0.9; ctx.drawImage(c, Math.round(x), Math.round(y)); ctx.globalAlpha = 1; }
    }
  }
  for (const layer of L.bg.layers) {
    const W = layer.c.width, H = layer.c.height;
    let y;
    if (layer.anchor === 'center') y = Math.round((VH - H) / 2 - ((cam.y - maxY / 2) * layer.f) % H);
    else y = Math.round(VH - H - 58 + layer.yOff + (maxY - cam.y) * layer.f * 1.2);
    if (y >= VH) continue;
    const ox = -Math.floor(((cam.x * layer.f) % W + W) % W);
    for (let x = ox; x < VW; x += W) {
      ctx.drawImage(layer.c, x, y);
      if (layer.anchor === 'center') { ctx.drawImage(layer.c, x, y - H); ctx.drawImage(layer.c, x, y + H); }
    }
    // fill below a bottom-anchored layer so it never shows sky underneath
    if (layer.anchor !== 'center' && y + H < VH) {
      const img = layer.c.getContext('2d');
      ctx.fillStyle = layer.fill || (layer.fill = sampleBottom(layer.c));
      ctx.fillRect(0, y + H, VW, VH - y - H);
    }
  }
  if (L.theme === 'storm' || L.theme === 'summit') {
    if (!L.sunrise && Math.random() < 0.004) fx.flash = Math.max(fx.flash, 0.2);
  }
}
function sampleBottom(c) {
  const d = c.getContext('2d').getImageData(Math.floor(c.width / 2), c.height - 1, 1, 1).data;
  return `rgb(${d[0]},${d[1]},${d[2]})`;
}
function circle(x, y, r) {
  for (let dy = -r; dy <= r; dy++) { const w = Math.floor(Math.sqrt(r * r - dy * dy)); ctx.fillRect(Math.round(x - w), Math.round(y + dy), w * 2 + 1, 1); }
}

// ---------------------------------------------------------------------
//  World rendering
// ---------------------------------------------------------------------
function renderWorld() {
  const L = level;
  drawBackground();
  const cx = Math.round(cam.x + cam.shakeX), cy = Math.round(cam.y + cam.shakeY);
  ctx.save();
  ctx.translate(-cx, -cy);
  const t = L.time;
  // lava pools
  drawLavaTiles(cx, cy, t);
  // static terrain (only the visible slice)
  const sx = clamp(cx, 0, L.art.width), sy = clamp(cy, 0, L.art.height);
  const sw = Math.min(VW + 2, L.art.width - sx), sh = Math.min(VH + 2, L.art.height - sy);
  if (sw > 0 && sh > 0) ctx.drawImage(L.art, sx, sy, sw, sh, sx, sy, sw, sh);
  // beyond the left / right edge of the level: solid rock, not open sky
  const mapW = L.w * TS;
  if (cx < 0 || cx + VW > mapW) {
    ctx.fillStyle = L.wallPattern || THEMES[L.theme].edge;
    if (cx < 0) ctx.fillRect(cx, cy, -cx, VH);
    if (cx + VW > mapW) ctx.fillRect(mapW, cy, cx + VW - mapW, VH);
    ctx.fillStyle = THEMES[L.theme].edge;
    if (cx < 0) ctx.fillRect(-2, cy, 2, VH);
    if (cx + VW > mapW) ctx.fillRect(mapW, cy, 2, VH);
  }
  // collapsing ground
  for (const c of L.collapses) {
    if (c.state === 'gone') continue;
    const j = c.state === 'shake' ? (Math.floor(t * 40) % 2 ? 1 : -1) : 0;
    c.cells.forEach(([x, y], i) => ctx.drawImage(c.tiles[i], x * TS + j, y * TS));
  }
  for (const s of L.popSpikes) if (s.t <= 0) ctx.drawImage(SPIKE_IMG, 0, 0, 16, 16, s.tx * TS, s.ty * TS + Math.round((1 - s.up) * 9), 16, 16 - Math.round((1 - s.up) * 9));
  for (const g of L.gates) if (g.closed) { ctx.fillStyle = '#2a2438'; for (let i = 1; i < 16; i += 4) ctx.fillRect(g.x + i, g.y, 2, 16); ctx.fillStyle = '#7d7690'; ctx.fillRect(g.x, g.y + 3, 16, 2); ctx.fillRect(g.x, g.y + 11, 16, 2); }
  for (const c of L.crumbles) {
    if (c.state === 'gone') continue;
    const j = c.state === 'shake' ? (Math.floor(t * 50) % 2 ? 1 : -1) : 0;
    ctx.drawImage(L.props.crumble, c.x + j, c.y);
  }
  for (const p of L.platforms) ctx.drawImage(L.props.platform.c, p.x - 1, p.y - 1);
  for (const s of L.springs) spr(ART.spring[s.t > 0 ? 1 : 0], s.x, s.y + 6);
  for (const s of L.signs) {
    spr(ART.sign, s.x, s.y + 1);
    if (L.activeSign !== s && Math.abs(player.x - s.x) < 60 && Math.floor(t * 2) % 2) Font.draw('?', s.x + 6, s.y - 9, { color: '#ffd84a', outline: true });
  }
  for (const cp of L.checkpoints) drawCheckpoint(cp, t);
  if (L.finish) drawFinish(L.finish, t);
  for (const g of L.gems) {
    if (g.got || g.mimic) continue;
    const f = ART.gem[Math.floor(t * 8 + g.bob) % 4];
    const ghost = L.ghost.has(g.id);
    if (ghost) ctx.globalAlpha = 0.45;
    spr(f, g.x, g.y + Math.round(Math.sin(t * 3 + g.bob) * 1.5));
    ctx.globalAlpha = 1;
    if (Math.random() < 0.01) addParticle(g.x + rand(0, 12), g.y + rand(0, 10), { col: '#ffffff', life: 0.4, g: 0, vy: -8 });
  }
  for (const h of L.hearts) if (!h.got) spr(ART.heart, h.x, h.y + Math.round(Math.sin(t * 4) * 1.5));
  for (const k of L.crushers) {
    const j = k.state === 'warn' ? (Math.floor(t * 40) % 2 ? 1 : -1) : 0;
    ctx.fillStyle = '#4a4458'; for (let y = k.y0 - 4; y > k.y0 - 40 && y >= 0; y -= 4) ctx.fillRect(k.x + 15, y, 2, 2);
    ctx.drawImage(ART.crusher[k.state === 'idle' || k.state === 'rise' ? 0 : 1].c, k.x - 1 + j, Math.round(k.y) - 1);
  }
  for (const s of L.stals) {
    if (s.state === 'gone') continue;
    const j = s.state === 'shake' ? (Math.floor(t * 40) % 2 ? 1 : -1) : 0;
    spr(L.props.stal, s.x + j, s.y);
  }
  if (L.dawnGem && !L.dawnGem.got) {
    const D = L.dawnGem;

function drawCheckpoint(cp, t) {

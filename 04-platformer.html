function drawLavaTiles(cx, cy, t) {
  for (const { tx, ty } of level.lavaTiles) {
    const x = tx * TS, y = ty * TS;
    if (x + TS < cx || x > cx + VW || y + TS < cy || y > cy + VH) continue;
    const surface = tileAt(tx, ty - 1) !== T.LAVA;

    ctx.fillStyle = '#ff5a1a'; ctx.fillRect(x, y + (surface ? 6 : 0), TS, 6);

function drawRisingLava(cx, cy, t) {

    ctx.fillStyle = '#ff8a2a'; ctx.fillRect(Math.round(bx), Math.round(by), 2, 2);

}
function drawBolts(cx, cy) {

        ctx.fillStyle = 'rgba(255,255,160,0.18)'; ctx.fillRect(Math.round(b.x) - 8, cy, 16, b.ground - cy);
        ctx.fillStyle = '#ffd84a'; ctx.fillRect(Math.round(b.x) - 4, b.ground - 3, 8, 2); ctx.fillRect(Math.round(b.x) - 1, b.ground - 9, 2, 5);
      }

      for (let i = 0; i < b.pts.length - 1; i++) {
        const [x0, y0] = b.pts[i], [x1, y1] = b.pts[i + 1];
        for (let s = 0; s <= 10; s++) {

// ---------------------------------------------------------------------
//  Lighting (half-res darkness with soft holes, upscaled for a stepped look)
// ---------------------------------------------------------------------
const lightCanvas = newCanvas(VW / 2, VH / 2);
const lctx = lightCanvas.getContext('2d');
function drawLighting(cx, cy) {
  const L = level;
  const dark = L.darkness;
  if (dark <= 0.01) return;
  lctx.globalCompositeOperation = 'source-over';
  lctx.clearRect(0, 0, VW / 2, VH / 2);
  lctx.fillStyle = L.theme === 'magma' ? `rgba(30,6,8,${dark})` : `rgba(6,4,18,${dark})`;
  lctx.fillRect(0, 0, VW / 2, VH / 2);
  lctx.globalCompositeOperation = 'destination-out';
  const hole = (x, y, r, a = 1) => {
    const sx = (x - cx) / 2, sy = (y - cy) / 2, sr = r / 2;
    if (sx < -sr || sy < -sr || sx > VW / 2 + sr || sy > VH / 2 + sr) return;
    const g = lctx.createRadialGradient(sx, sy, 0, sx, sy, sr);
    g.addColorStop(0, `rgba(0,0,0,${a})`); g.addColorStop(0.55, `rgba(0,0,0,${a * 0.7})`); g.addColorStop(1, 'rgba(0,0,0,0)');
    lctx.fillStyle = g; lctx.fillRect(sx - sr, sy - sr, sr * 2, sr * 2);
  };
  if (!player.dead) hole(player.x + 5, player.y + 7, L.darkTarget > 0.85 ? 62 : 86);
  for (const l of L.lights) hole(l.x, l.y, l.r * 1.6, 0.8);
  for (const g of L.gems) if (!g.got && !g.mimic) hole(g.x + 6, g.y + 5, 26, 0.6);
  for (const cp of L.checkpoints) hole(cp.x + 8, cp.y, cp.active ? 60 : 30, 0.8);
  if (L.finish) hole(L.finish.x + 12, L.finish.y - 6, 70);
  for (const { tx, ty } of L.lavaTiles) if (tileAt(tx, ty - 1) !== T.LAVA) hole(tx * TS + 8, ty * TS + 4, 46, 0.9);
  if (L.lava && L.lava.y < cy + VH + 40) for (let x = 0; x < VW; x += 48) hole(cx + x + 24, L.lava.y + 8, 110, 1);
  for (const b of L.weather.bolts) if (b.strike > 0) hole(b.x, b.ground - 60, 200);
  for (const e of enemies) if (e.alive && (e.type === 'bat' || e.type === 'boss')) hole(e.x + e.w / 2, e.y + 4, 22, 0.4);
  for (const p of fx.particles) if (p.glow) hole(p.x, p.y, 12, 0.5);
  if (L.dawnGem) hole(L.dawnGem.x + 8, L.dawnGem.y + 7, 90);
  ctx.drawImage(lightCanvas, 0, 0, VW, VH);
}

// ---------------------------------------------------------------------
//  Screen-space weather particles
// ---------------------------------------------------------------------
let lastCam = { x: 0, y: 0 };
function initWeatherParticles() {
  fx.weather = [];
  const kind = THEMES[level.theme].weather;
  const n = { rain: 70, snow: 60, leaves: 14, petals: 16, fireflies: 18, spores: 26, embers: 30 }[kind] || 0;
  for (let i = 0; i < n; i++) fx.weather.push(newWeatherP(kind, true));
  lastCam = { x: cam.x, y: cam.y };
}
function newWeatherP(kind, anywhere) {
  const p = { kind, x: rand(0, VW), y: anywhere ? rand(0, VH) : -6, z: rand(0.4, 1), t: rand(0, 10) };
  if (kind === 'embers' || kind === 'spores') { p.y = anywhere ? rand(0, VH) : VH + 4; }
  return p;
}
function updateWeatherParticles(dt) {
  const dx = cam.x - lastCam.x, dy = cam.y - lastCam.y;
  lastCam = { x: cam.x, y: cam.y };
  const gust = level.weather.gust && level.weather.gust.active ? level.weather.gust.dir : 0;
  for (const p of fx.weather) {
    p.t += dt;
    p.x -= dx * p.z; p.y -= dy * p.z;
    switch (p.kind) {
      case 'rain': p.x += (-60 + gust * 200) * dt; p.y += 300 * p.z * dt; break;
      case 'snow': p.x += (Math.sin(p.t * 1.5) * 12 + gust * 160) * dt; p.y += 26 * p.z * dt; break;
      case 'leaves': case 'petals': p.x += (20 + Math.sin(p.t) * 20 + gust * 160) * dt; p.y += (18 + Math.sin(p.t * 2) * 10) * p.z * dt; break;
      case 'fireflies': p.x += Math.sin(p.t * 0.9) * 10 * dt; p.y += Math.cos(p.t * 1.3) * 8 * dt; break;
      case 'spores': p.x += Math.sin(p.t) * 6 * dt; p.y -= 8 * p.z * dt; break;
      case 'embers': p.x += Math.sin(p.t * 2) * 10 * dt; p.y -= 30 * p.z * dt; break;
    }
    if (p.x < -10) p.x += VW + 20; if (p.x > VW + 10) p.x -= VW + 20;
    if (p.y > VH + 8) { Object.assign(p, newWeatherP(p.kind, false)); p.x = rand(0, VW); }
    if (p.y < -10) { if (p.kind === 'embers' || p.kind === 'spores') { Object.assign(p, newWeatherP(p.kind, false)); p.x = rand(0, VW); } else p.y += VH + 16; }
  }
  if (gust && Math.random() < 0.6) fx.weather.length < 200 && fx.weather.push({ kind: 'streak', x: gust > 0 ? -20 : VW + 20, y: rand(0, VH), z: 1, t: 0, dir: gust });
  fx.weather = fx.weather.filter((p) => p.kind !== 'streak' || (p.x > -40 && p.x < VW + 40 && (p.x += p.dir * 500 * dt, true)));
}
function drawWeatherParticles() {
  for (const p of fx.weather) {
    const x = Math.round(p.x), y = Math.round(p.y);
    switch (p.kind) {
      case 'rain': if (level.sunrise > 0.35) break; ctx.fillStyle = 'rgba(170,200,255,0.5)'; ctx.fillRect(x, y, 1, 4 + Math.round(p.z * 3)); break;
      case 'snow': ctx.fillStyle = p.z > 0.75 ? '#ffffff' : 'rgba(255,255,255,0.6)'; ctx.fillRect(x, y, p.z > 0.8 ? 2 : 1, p.z > 0.8 ? 2 : 1); break;
      case 'leaves': ctx.fillStyle = Math.sin(p.t * 3) > 0 ? '#7ac850' : '#d8c040'; ctx.fillRect(x, y, 2, 1); ctx.fillRect(x + (Math.sin(p.t * 3) > 0 ? 1 : 0), y + 1, 1, 1); break;
      case 'petals': ctx.fillStyle = '#ffb0c8'; ctx.fillRect(x, y, 2, 1); break;
      case 'fireflies': { const a = (Math.sin(p.t * 3) + 1) / 2; ctx.globalAlpha = a; ctx.fillStyle = '#e8ff8a'; ctx.fillRect(x, y, 1, 1); ctx.globalAlpha = a * 0.3; ctx.fillRect(x - 1, y - 1, 3, 3); ctx.globalAlpha = 1; break; }
      case 'spores': ctx.fillStyle = 'rgba(190,160,255,0.6)'; ctx.fillRect(x, y, 1, 1); break;
      case 'embers': ctx.fillStyle = p.z > 0.7 ? '#ffd25a' : '#ff7a1a'; ctx.fillRect(x, y, 1, 1); break;
      case 'streak': ctx.fillStyle = 'rgba(230,245,255,0.55)'; ctx.fillRect(x, y, 18, 1); break;
    }
  }
}

const HUD_PAUSE = { x: VW - 17, y: 3, w: 14, h: 13 };
function renderHUD() {
  const p = player, L = level;
  // hearts
  for (let i = 0; i < p.maxHearts; i++) {
    const s = i < p.hearts ? ART.heart : ART.heartEmpty;
    const bob = i < p.hearts && p.hearts === 1 ? Math.round(Math.sin(L.time * 10) * 1) : 0;
    spr(s, 5 + i * 11, 5 + bob);
  }
  // gems
  const got = gemsGot();
  spr(ART.gem[0], 5, 16);
  Font.draw(`${got}/${L.gemTotal}`, 20, 18, { color: got >= L.gemTotal ? '#ffd84a' : '#bff6ff', outline: true });
  // power indicator
  const pw = p.char.ability;
  let label = null, ready = true;
  if (pw === 'dash' || pw === 'all') { label = 'DASH'; ready = p.canDash && p.dashCd <= 0; }
  if (pw === 'double') { label = 'FLUTTER'; ready = p.canDouble || p.onGround; }
  if (pw === 'slam') { label = 'SLAM'; ready = !p.onGround && !p.slam; }
  if (label) Font.draw(label, 6, 30, { color: ready ? '#ffd84a' : '#6a6080', outline: true });
  // timer & deaths
  const rx = touchShown ? VW - 40 : HUD_PAUSE.x - 5;
  if (Save.data.settings.timer) Font.draw(formatTime(L.time), rx, 5, { color: '#ffffff', align: 'right', outline: true });
  Font.draw(`☠ ${L.deaths}`, rx, 16, { color: '#c8c0d8', align: 'right', outline: true });
  // pause button
  // small pause button for mouse users (touch devices get a big one from the overlay)
  if (!touchShown) {
    const hb = HUD_PAUSE;
    const hover = Input.pointer.active && rectHit(Input.pointer.x, Input.pointer.y, 1, 1, hb.x, hb.y, hb.w, hb.h);
    ctx.fillStyle = hover ? 'rgba(255,255,255,0.35)' : 'rgba(20,16,32,0.55)'; ctx.fillRect(hb.x, hb.y, hb.w, hb.h);
    ctx.fillStyle = '#ffffff'; ctx.fillRect(hb.x + 4, hb.y + 3, 2, 7); ctx.fillRect(hb.x + 8, hb.y + 3, 2, 7);
    if (Input.pointer.clicked && rectHit(Input.pointer.x, Input.pointer.y, 1, 1, hb.x - 4, hb.y - 4, hb.w + 8, hb.h + 8) && !PlayScreen.cleared) { Input.pointer.clicked = false; Screens.open(PauseScreen); }
  }
  // level name intro
  if (PlayScreen.introT > 0 && Screens.top === PlayScreen) {
    const a = clamp(PlayScreen.introT, 0, 1) * clamp((3.2 - PlayScreen.introT) * 3, 0, 1);
    ctx.globalAlpha = a * 0.7; ctx.fillStyle = '#100c1c'; ctx.fillRect(0, 44, VW, 36); ctx.globalAlpha = 1;
    Font.draw(`LEVEL ${L.idx + 1}`, VW / 2, 49, { color: '#ffd84a', align: 'center', outline: true, alpha: a });
    Font.draw(L.def.name, VW / 2, 60, { color: '#ffffff', align: 'center', outline: true, scale: 2, alpha: a });
  }
  // boss bar
  const boss = enemies.find((e) => e.type === 'boss' && e.state !== 'sleep' && e.alive);
  if (boss) {
    const w = 140, x = VW / 2 - w / 2, y = VH - 14;
    Font.draw('STORMBEAK', VW / 2, y - 10, { color: '#ff9aaa', align: 'center', outline: true });
    ctx.fillStyle = '#100c1c'; ctx.fillRect(x - 2, y - 2, w + 4, 8);
    ctx.fillStyle = '#4a2030'; ctx.fillRect(x, y, w, 4);
    ctx.fillStyle = '#ff3a5a'; ctx.fillRect(x, y, Math.round((w * Math.max(0, boss.hp)) / 3), 4);
    ctx.fillStyle = '#ffb0c0'; ctx.fillRect(x, y, Math.round((w * Math.max(0, boss.hp)) / 3), 1);
  }
  // banners
  fx.banners.forEach((b, i) => {
    const age = b.max - b.t;
    const slide = Math.min(1, age * 5), fade = Math.min(1, b.t * 3);
    const y = 86 + i * 22;
    ctx.globalAlpha = fade * 0.75; ctx.fillStyle = '#100c1c';
    ctx.fillRect(VW / 2 - (VW / 2) * slide, y - 4, VW * slide, 22); ctx.globalAlpha = 1;
    Font.draw(b.text, VW / 2, y, { color: b.col, align: 'center', outline: true, scale: 2, alpha: fade * slide });
  });
  // sign dialog
  if (L.activeSign && !PlayScreen.cleared) drawDialog(L.activeSign.text);
  // gust warning arrows
  const G = L.weather.gust;
  if (G && !G.active && Math.floor(G.t * 6) % 2) Font.draw(G.dir > 0 ? '▶▶▶' : '◀◀◀', G.dir > 0 ? VW - 40 : 12, VH / 2, { color: '#bfe4ff', outline: true, scale: 2 });
}

function drawDialog(text) {
  const w = 300, lines = Font.wrap(text.replace(/\{(\w+)\}/g, (_, k) => keyName(k)), w - 20);
  // with touch buttons on screen the bottom belongs to the thumbs, so signs show up top

  ctx.fillStyle = '#c88a4a'; ctx.fillRect(x, y, w, 1); ctx.fillRect(x, y + h - 1, w, 1); ctx.fillRect(x, y, 1, h); ctx.fillRect(x + w - 1, y, 1, h);
  lines.forEach((l, i) => Font.draw(l, x + 10, y + 7 + i * 10, { color: '#fff4e0', shadow: '#3a2a1a' }));

function drawIris(t, cx, cy) {
  if (t >= 1) return;
  const r = easeInOut(t) * Math.hypot(VW, VH);
  ctx.fillStyle = '#0a0812';
  ctx.beginPath();
  ctx.rect(0, 0, VW, VH);

// =====================================================================
//  UI — screen manager, menus, title / map / character / options ...
// =====================================================================
const Screens = {
  stack: [], fade: 0, fadeDir: 0, pending: null,
  get top() { return this.stack[this.stack.length - 1]; },
  go(screen, ...args) {
    if (this.fadeDir === 1) return;
    this.pending = () => { this.stack = [screen]; screen.enter && screen.enter(...args); };
    this.fadeDir = 1;
  },
  now(screen, ...args) { this.stack = [screen]; screen.enter && screen.enter(...args); },
  open(screen, ...args) { this.stack.push(screen); screen.enter && screen.enter(...args); },
  close() { this.stack.pop(); const t = this.top; if (t && t.resume) t.resume(); },
  update(dt) {
    if (this.fadeDir) {
      this.fade = clamp(this.fade + this.fadeDir * dt * 4.5, 0, 1);
      if (this.fadeDir === 1 && this.fade >= 1) { const p = this.pending; this.pending = null; if (p) p(); this.fadeDir = -1; Input.clearAll(); }
      else if (this.fadeDir === -1 && this.fade <= 0) this.fadeDir = 0;
      if (this.fadeDir === 1) return;
    }
    const t = this.top; if (t) t.update(dt);
  },
  render() {
    for (const s of this.stack) s.render();
    if (this.fade > 0) { ctx.globalAlpha = this.fade; ctx.fillStyle = '#0a0812'; ctx.fillRect(0, 0, VW, VH); ctx.globalAlpha = 1; }
  },
};

// ---------------------------------------------------------------------
//  Generic vertical menu (keyboard, gamepad, mouse and touch)
// ---------------------------------------------------------------------
class Menu {
  constructor(items, o = {}) { this.items = items; this.sel = 0; this.o = o; this.rects = []; this.t = 0; }
  get item() { return this.items[this.sel]; }
  move(d) {
    const n = this.items.length;
    for (let i = 0; i < n; i++) { this.sel = (this.sel + d + n) % n; if (!this.items[this.sel].disabled || !this.items[this.sel].disabled()) break; }
    Sound.sfx('move');
  }
  update(dt) {
    this.t += dt;
    const I = Input.pressed, it = this.item;
    if (I.up) this.move(-1);
    if (I.down) this.move(1);
    if (I.left && it.left) { it.left(); Sound.sfx('move'); }
    if (I.right && it.right) { it.right(); Sound.sfx('move'); }
    if (I.confirm && it.act && !(it.disabled && it.disabled())) { Sound.sfx('select'); it.act(); return; }
    const pt = Input.pointer;
    if (pt.moved || pt.clicked) {
      this.rects.forEach((r, i) => {
        if (!rectHit(pt.x, pt.y, 1, 1, r.x, r.y, r.w, r.h)) return;
        if (pt.moved && this.sel !== i) { this.sel = i; Sound.sfx('move'); }

  render(cx, y, o = {}) {

// ---------------------------------------------------------------------
//  Level map — a mountain you climb, one world per altitude band
// ---------------------------------------------------------------------
const MAP_H = 640;
// nodes zig-zag up the mountain (same shape formula as buildMapArt)
const mapShape = (y) => { const k = (y - 40) / (MAP_H - 40); return { half: 18 + k * 178 + Math.sin(y * 0.045) * 9 + Math.sin(y * 0.17) * 3, cx: VW / 2 + 6 + Math.sin(y * 0.012) * 14 }; };
const MAP_NODES = [588, 520, 452, 384, 316, 248, 176, 96].map((y, i) => {
  const m = mapShape(y);
  return [Math.round(m.cx + (i === 7 ? 0 : (i % 2 ? 1 : -1)) * Math.min(m.half * 0.45, 110)), y];
});
const MapScreen = {
  canvas: null,
  enter(sel) {
    if (!this.canvas) this.canvas = buildMapArt();
    this.sel = sel != null ? sel : Math.min(Save.data.unlocked - 1, LEVELS.length - 1);
    this.camY = this.targetY();
    this.t = 0; this.walk = null; this.free = false; this.vel = 0;
    Sound.Music.play('title');
  },
  targetY() { return clamp(MAP_NODES[this.sel][1] - 118, 0, MAP_H - VH + 66); },
  choose(i) {
    if (i < 0 || i >= LEVELS.length || i === this.sel) return;
    this.free = false;
    this.walk = { from: this.sel, to: i, t: 0 };
    this.sel = i; Sound.sfx('move');
  },
  play() {
    if (this.sel >= Save.data.unlocked) { Sound.sfx('back'); return; }
    Sound.sfx('select');
    Screens.go(PlayScreen, this.sel);
  },
  update(dt) {
    this.t += dt;
    const I = Input.pressed;
    if (this.walk) { this.walk.t += dt * 4; if (this.walk.t >= 1) this.walk = null; }
    // you may peek at the next locked level, but no further
    const maxSel = Math.min(LEVELS.length - 1, Save.data.unlocked);
    if (I.up || I.right) this.choose(Math.min(this.sel + 1, maxSel));
    if (I.down || I.left) this.choose(this.sel - 1);
    if (I.confirm) this.play();
    if (I.action) Screens.go(CharScreen, MapScreen);
    if (I.back) { Sound.sfx('back'); Screens.go(TitleScreen); }
    const pt = Input.pointer;
    if (pt.clicked) {
      MAP_NODES.forEach(([x, y], i) => {
        if (Math.hypot(pt.x - x, pt.y - (y - this.camY)) < 13) {
          pt.clicked = false;
          if (i === this.sel) this.play(); else if (i <= Math.min(LEVELS.length - 1, Save.data.unlocked)) this.choose(i);
        }
      });
    }
    // drag the mountain with a finger; it keeps gliding a little after you let go
    const maxY = MAP_H - VH + 66;
    if (pt.down && pt.drag) {
      this.free = true;
      this.camY = clamp(this.camY - pt.fdy, 0, maxY);
      this.vel = this.vel * 0.6 + (-pt.fdy / dt) * 0.4;
    } else if (this.free) {
      this.camY = clamp(this.camY + this.vel * dt, 0, maxY);
      this.vel *= Math.pow(0.04, dt);
    } else this.camY = lerp(this.camY, this.targetY(), Math.min(1, dt * 5));
  },
  render() {
    const cy = Math.round(this.camY);
    const alt = 1 - cy / (MAP_H - VH);
    const g = ctx.createLinearGradient(0, 0, 0, VH);
    g.addColorStop(0, mixColor('#5fb0ff', '#0c1024', alt)); g.addColorStop(1, mixColor('#c8ecff', '#3a3a6a', alt));
    ctx.fillStyle = g; ctx.fillRect(0, 0, VW, VH);
    for (let i = 0; i < 5; i++) {
      const c = ART.clouds[i % 4];
      ctx.globalAlpha = 0.85;
      ctx.drawImage(c, Math.round(((i * 131 + this.t * (5 + i * 2)) % (VW + 100)) - 60), Math.round(((i * 120 + 40) % MAP_H) - cy * 0.6));
      ctx.globalAlpha = 1;
    }
    ctx.drawImage(this.canvas, 0, -cy);
    if (MAP_H - cy < VH) { ctx.fillStyle = '#3a8a3e'; ctx.fillRect(0, MAP_H - cy, VW, VH); }
    // path
    for (let i = 0; i < MAP_NODES.length - 1; i++) {
      const [x0, y0] = MAP_NODES[i], [x1, y1] = MAP_NODES[i + 1];
      const open = i + 1 < Save.data.unlocked;
      for (let s = 0; s < 1; s += 0.04) {
        if (Math.floor(s * 25) % 2) continue;
        const x = lerp(x0, x1, s), y = lerp(y0, y1, s) - Math.sin(s * Math.PI) * 18;
        ctx.fillStyle = open ? '#fff4d0' : 'rgba(255,255,255,0.3)'; ctx.fillRect(Math.round(x), Math.round(y - cy), 2, 2);
      }
    }
    // nodes
    MAP_NODES.forEach(([x, y], i) => {
      const yy = y - cy;
      if (yy < -20 || yy > VH + 20) return;
      const lv = LEVELS[i], save = Save.data.levels[i];
      const locked = i >= Save.data.unlocked;
      const col = locked ? '#5a5470' : save && save.done ? '#ffd84a' : '#ffffff';
      ctx.fillStyle = '#100c1c'; circle(x, yy, 10);
      ctx.fillStyle = locked ? '#2a2638' : THEME_COL[lv.theme]; circle(x, yy, 8);
      ctx.fillStyle = col; ctx.fillRect(x - 8, yy - 1, 1, 2);
      if (locked) Font.draw('¤', x - 2, yy - 3, { color: '#8a84a0', shadow: false });
      else Font.draw(String(i + 1), x, yy - 3, { color: '#ffffff', align: 'center', outline: '#100c1c' });
      if (save && save.done) for (let s = 0; s < 3; s++) Font.draw('★', x - 13 + s * 9, yy + 11, { color: save.stars[s] ? '#ffd84a' : '#3a3450', outline: '#100c1c' });
      if (i === this.sel) {
        ctx.strokeStyle = '#ffd84a'; ctx.lineWidth = 1;
        const r = 12 + Math.sin(this.t * 6) * 1.5;
        ctx.beginPath(); ctx.arc(x + 0.5, yy + 0.5, r, 0, Math.PI * 2); ctx.stroke();
      }
    });
    // the player on the map
    let px, py;
    if (this.walk) {
      const [x0, y0] = MAP_NODES[this.walk.from], [x1, y1] = MAP_NODES[this.walk.to], s = easeInOut(this.walk.t);
      px = lerp(x0, x1, s); py = lerp(y0, y1, s) - Math.sin(s * Math.PI) * 18;
    } else [px, py] = MAP_NODES[this.sel];
    const F = ART.chars[Save.data.char];
    const s = this.walk ? F.run[Math.floor(this.t * 12) % 4] : F.idle[Math.floor(this.t * 2) % 2];
    ctx.drawImage((this.walk ? MAP_NODES[this.walk.to][0] < MAP_NODES[this.walk.from][0] : false) ? s.f : s.c, Math.round(px - 9), Math.round(py - cy - 27));
    // info bar
    const lv = LEVELS[this.sel], save = Save.data.levels[this.sel];
    const locked = this.sel >= Save.data.unlocked;
    const by = VH - 66, tc = THEME_COL[lv.theme];
    ctx.fillStyle = 'rgba(16,12,28,0.86)'; ctx.fillRect(0, by, VW, VH - by);
    ctx.fillStyle = tc; ctx.fillRect(0, by, VW, 1);
    Font.draw(`LEVEL ${this.sel + 1}`, 8, by + 6, { color: tc, outline: true });
    Font.draw(locked ? '???' : lv.name, 56, by + 6, { color: '#ffffff', outline: true });
    if (locked) {
      Font.draw('CLEAR THE LEVEL BELOW TO UNLOCK THIS ONE.', 8, by + 18, { color: '#a8a0c0' });
    } else {
      Font.draw((lv.blurb || '').split('\n').join(' '), 8, by + 18, { color: '#c8c0d8' });
      const total = parseLevelGemTotal(this.sel);
      Font.draw(`◆ ${save ? save.gems.length : 0}/${total}`, 8, by + 30, { color: '#4ae0ff', outline: true });
      Font.draw(`BEST ${save && save.best != null ? formatTime(save.best) : '--:--.--'}`, 64, by + 30, { color: '#ffffff', outline: true });
      Font.draw(`PAR ${formatTime(lv.par, false)}`, 160, by + 30, { color: '#a8a0c0', outline: true });
      Font.draw(`☠ ${save ? save.deaths : 0}`, 222, by + 30, { color: '#c8c0d8', outline: true });
      ['CLEAR', 'GEMS', 'PAR'].forEach((k, s) => {
        const on = save && save.stars[s];
        const x = VW - 130 + s * 42;

        Font.draw(k, x + 9, by + 6, { color: on ? '#fff4c0' : '#6a6080' });

    }
    button('◀ BACK', 8, VH - 18, 52, () => Screens.go(TitleScreen));
    button('CHARACTER', VW - 78, VH - 18, 70, () => Screens.go(CharScreen, MapScreen));
    button(locked ? 'LOCKED' : '▶ PLAY', VW / 2 - 30, VH - 18, 60, () => this.play(), locked ? '#6a6080' : '#7aff9a');

function buildMapArt() {
  const B = PixBuf(VW, MAP_H);
  const bands = [
    [560, '#5cc24a', '#4aa83e'], [490, '#2f8a4a', '#287a40'], [420, '#5a5278', '#4a4466'], [350, '#5a3a3a', '#4a2e30'],
    [280, '#c9a66b', '#b08e58'], [200, '#e8f2ff', '#c8daf0'], [120, '#5a6280', '#4a5270'], [0, '#3a3e60', '#2e3250'],
  ];
  const edges = [];
  for (let y = 40; y < MAP_H; y++) {
    const k = (y - 40) / (MAP_H - 40);
    const half = 18 + k * 178 + Math.sin(y * 0.045) * 9 + Math.sin(y * 0.17) * 3;
    const cx = VW / 2 + 6 + Math.sin(y * 0.012) * 14;
    edges[y] = [cx - half, cx + half, cx];
    const bi = bands.findIndex((b) => y >= b[0]);
    // dither into the band above near each boundary
    const above = bands[bi - 1];
    for (let x = Math.max(0, Math.floor(cx - half)); x < Math.min(VW, cx + half); x++) {
      let band = bands[bi];
      if (above && y < bands[bi][0] + 5 && (x + y) % 2 === 0 && y < bands[bi][0] + 1 + (x % 5)) band = above;
      // light from the left: the right flank is in shadow
      const t = (x - (cx - half)) / (2 * half);
      let col = t > 0.62 ? band[2] : band[1];
      if (hash2(x >> 1, y >> 1, 3) < 0.07) col = shade(col, -0.12);
      else if (hash2(x >> 1, y >> 1, 4) < 0.04) col = shade(col, 0.12);
      if (x < cx - half + 2) col = shade(band[1], 0.15);
      if (x > cx + half - 3) col = shade(band[2], -0.35);
      if (y < 58 + Math.sin(x * 0.3) * 3) col = t > 0.62 ? '#d8e4f8' : '#ffffff';
      B.put(x, y, col);
    }
  }
  const inside = (x, y) => edges[y] && x > edges[y][0] + 4 && x < edges[y][1] - 4;
  // little details per altitude band
  const rng = mulberry32(77);
  for (let i = 0; i < 260; i++) {
    const x = Math.floor(rng() * VW), y = 60 + Math.floor(rng() * (MAP_H - 70));
    if (!inside(x, y) || !inside(x + 6, y)) continue;
    if (y >= 490) { // trees
      const c = y >= 560 ? '#3a9a44' : '#1f6a3a';
      B.rect(x + 2, y, 1, 3, '#5a3a20'); B.rect(x + 1, y - 3, 3, 3, c); B.put(x + 2, y - 4, c);
    } else if (y >= 420) { // glowing mushrooms
      if (rng() < 0.4) { B.put(x, y, '#5af0ff'); B.put(x, y + 1, '#c8f0ff'); }
    } else if (y >= 350) { // lava cracks
      if (rng() < 0.5) { B.rect(x, y, 3, 1, '#ff7a1a'); B.put(x + 1, y - 1, '#ffd25a'); }
    } else if (y >= 280) { // ruins
      if (rng() < 0.4) { B.rect(x, y - 4, 2, 5, '#a07c46'); B.rect(x - 1, y - 5, 4, 1, '#e4c58c'); }
    } else if (y >= 200) { // snowy pines
      B.rect(x + 1, y - 3, 3, 3, '#3a5a7a'); B.put(x + 2, y - 4, '#ffffff'); B.put(x + 2, y, '#5a3a20');
    } else if (y >= 120) { // storm towers
      if (rng() < 0.3) { B.rect(x, y - 7, 3, 8, '#2a3048'); B.put(x + 1, y - 5, '#ffd84a'); }
    }
  }
  return B.done();
}

const ClearScreen = {
  enter() {
    this.t = 0;
    const R = PlayScreen.result;
    const last = PlayScreen.levelIdx >= LEVELS.length - 1;
    this.menu = new Menu([
      { label: last ? 'SEE THE ENDING' : 'NEXT LEVEL', act: () => (last ? Screens.go(StoryScreen, 'ending') : Screens.go(PlayScreen, PlayScreen.levelIdx + 1)) },
      { label: 'PLAY AGAIN', act: () => Screens.go(PlayScreen, PlayScreen.levelIdx) },
      { label: 'LEVEL MAP', act: () => Screens.go(MapScreen, Math.min(PlayScreen.levelIdx + (last ? 0 : 1), LEVELS.length - 1)) },
    ]);
    this.R = R;
    this.starSounds = 0;
  },
  update(dt) {
    this.t += dt;
    PlayScreen.updateCleared(dt);
    const starTimes = [1.0, 1.35, 1.7];
    while (this.starSounds < 3 && this.t > starTimes[this.starSounds]) { if (this.R.stars[this.starSounds]) Sound.sfx('checkpoint'); this.starSounds++; }
    if (this.t > 0.6) this.menu.update(dt);
    else if (Input.pressed.confirm || Input.pointer.clicked) { Input.pointer.clicked = false; this.t = 2; }
  },
  render() {

function resize() {
  const ww = window.innerWidth, wh = window.innerHeight;
  const s = Math.min(ww / VW, wh / VH);
  const si = Math.floor(s);
  const scale = si >= 2 && s - si < 0.25 ? si : s;
  canvas.style.width = Math.floor(VW * scale) + 'px';
  canvas.style.height = Math.floor(VH * scale) + 'px';
}
window.addEventListener('resize', resize);

const touchEl = document.getElementById('touch');
Input.bindTouchPad(touchEl);
let touchShown = false;
function updateTouchVisibility() {
  if (!touchEl) return;
  const S = Save.data.settings;
  const want = S.touch === 'on' || (S.touch === 'auto' && (Input.device === 'touch' || (Input.hasTouch && Input.device !== 'kb' && Input.device !== 'pad')));
  const show = want && Screens.top === PlayScreen && !PlayScreen.cleared && Screens.fadeDir !== 1;
  if (show !== touchShown) {
    touchShown = show;
    touchEl.classList.toggle('show', show);
    if (!show) { Input.releaseTouches(); for (const b of touchEl.querySelectorAll('.on')) b.classList.remove('on'); }
  }
  touchEl.style.setProperty('--s', String(S.touchSize || 1));
  const abil = document.getElementById('b-act');

  if (abil && abil.dataset.label !== String(label)) {
    abil.dataset.label = String(label);
    abil.classList.toggle('show', !!label);
    if (label) document.getElementById('b-act-label').textContent = label;
  }
}

const TAURI = window.__TAURI__ || null;
const IS_APP = !!TAURI;
const APP_VERSION = '1.1.0';
function exitApp() {
  try { if (TAURI && TAURI.app && TAURI.app.exit) { TAURI.app.exit(0); return; } } catch (e) { /* fall through */ }
  try { if (TAURI && TAURI.process && TAURI.process.exit) TAURI.process.exit(0); } catch (e) { /* nothing else to do */ }
}
// Android back button: behave like Escape (pause in game, back in menus) instead of quitting
function hookBackButton() {
  try {
    if (TAURI && TAURI.app && typeof TAURI.app.onBackButtonPress === 'function') {
      TAURI.app.onBackButtonPress(() => {
        window.dispatchEvent(new KeyboardEvent('keydown', { code: 'Escape' }));
        setTimeout(() => window.dispatchEvent(new KeyboardEvent('keyup', { code: 'Escape' })), 60);
      });
    }
  } catch (e) { /* not available: default back behaviour */ }
}

function pauseIfPlaying() { if (Screens.top === PlayScreen && !PlayScreen.cleared) Screens.open(PauseScreen); }
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { pauseIfPlaying(); Sound.suspend(); } else Sound.resume();
});
window.addEventListener('blur', pauseIfPlaying);

let lastT = performance.now(), acc = 0;
function frame(now) {
  let ft = (now - lastT) / 1000; lastT = now;
  if (ft > 0.25) ft = 0.25;
  acc += ft;
  let steps = 0;
  while (acc >= STEP && steps < 5) {
    Input.poll();
    if (Input.pressed.mute) {
      const s = Save.data.settings;
      if (s.music > 0 || s.sfx > 0) { s._m = s.music; s._s = s.sfx; s.music = 0; s.sfx = 0; } else { s.music = s._m || 0.55; s.sfx = s._s || 0.8; }
      Sound.applyVolumes(); Save.write();
    }
    if (Input.pressed.fullscreen) toggleFullscreen();
    if (Input.any) Sound.init();
    Screens.update(STEP);
    acc -= STEP; steps++;
  }
  if (steps === 5) acc = 0;
  // on 90/120Hz screens many frames have no new game step: skip the redraw to save battery
  if (steps > 0) { Screens.render(); updateTouchVisibility(); }
  requestAnimationFrame(frame);
}

// ---------------------------------------------------------------------
//  Boot behind the loading screen
// ---------------------------------------------------------------------
function setLoad(p, msg) {
  const f = document.getElementById('ld-fill'), m = document.getElementById('ld-msg');
  if (f) f.style.width = Math.round(p * 100) + '%';
  if (m && msg) m.textContent = msg;
}
// let the loader paint between heavy steps (falls back to a timer if rAF is paused)
const nextPaint = () => new Promise((res) => {
  let done = false;
  const go = () => { if (!done) { done = true; res(); } };
  requestAnimationFrame(() => setTimeout(go, 0));
  setTimeout(go, 100);
});

async function boot() {
  const t0 = performance.now();
  resize();
  setLoad(0.12, 'Waking up Mossy'); await nextPaint();
  buildArt();
  setLoad(0.42, 'Painting the mountain'); await nextPaint();
  MenuBG.init(); MapScreen.canvas = buildMapArt();
  setLoad(0.7, 'Gathering storm clouds'); await nextPaint();
  OpeningScreen.prepare();
  setLoad(0.9, 'Tuning the birds'); await nextPaint();
  hookBackButton();
  const q = new URLSearchParams(location.search);
  if (q.has('level')) {
    Sound.init();
    Screens.now(PlayScreen, clamp(parseInt(q.get('level'), 10) - 1, 0, LEVELS.length - 1));
  } else if (q.has('sprites')) {
    Screens.now(SpriteSheetScreen);
  } else Screens.now(OpeningScreen);
  if (q.has('debug')) exposeDebug();
  setLoad(1, 'Ready!');
  // keep the loader up long enough to be seen, never longer than needed
  await new Promise((r) => setTimeout(r, Math.max(0, 900 - (performance.now() - t0))));
  const ld = document.getElementById('loader');
  if (ld) { ld.classList.add('done'); setTimeout(() => ld.remove(), 600); }
  lastT = performance.now();
  requestAnimationFrame(frame);
}

// ?debug: drive the game deterministically from the console / tests
function exposeDebug() {
  const send = (type, code) => window.dispatchEvent(new KeyboardEvent(type, { code }));
  window.MC = {
    get level() { return level; }, player, enemies: () => enemies, Screens, PlayScreen, MapScreen, TitleScreen, OpeningScreen, OptionsScreen, CharScreen, HowToScreen, StoryScreen, PauseScreen, ClearScreen, Save, cam, fx, LEVELS, Input,
    play(i) { Sound.init(); Screens.now(PlayScreen, i); this.step(1); },
    step(n = 1) { for (let i = 0; i < n; i++) { Input.poll(); Screens.update(STEP); } Screens.render(); updateTouchVisibility(); return { x: player.x, y: player.y, dead: player.dead, hearts: player.hearts, screen: Screens.top && Object.keys(window.MC).find((k) => window.MC[k] === Screens.top) }; },
    down(code) { send('keydown', code); }, up(code) { send('keyup', code); },
    tap(code, n = 1) { send('keydown', code); this.step(n); send('keyup', code); return this.step(1); },
    hold(code, n) { send('keydown', code); const r = this.step(n); send('keyup', code); return r; },
    tp(tx, ty) { placePlayer(tx * TS + 3, ty * TS + TS - player.h); updateCamera(0, true); return this.step(1); },
  };
}

// ---- opening.js ----
// =====================================================================
//  OPENING — "tap to start" over the night summit, then a short cinematic:
//  the Dawn Gem glows, Stormbeak steals it, the camera drops down the mountain
//  to Mossy and friends, and the logo slams in. Any tap skips.
// =====================================================================
const OP_H = VH * 3;                // the scene is three screens tall
const OP_PEAK = { x: 0, y: 64 };
const OP_END = 8.8;

const OpeningScreen = {
  canvas: null, t: 0, state: 'wait', rain: [], dust: [], shake: 0, flash: 0,

  // the mountain is painted once into a tall pixel buffer
  prepare() {
    if (this.canvas) return;
    OP_PEAK.x = Math.round(VW * 0.56);
    const B = PixBuf(VW, OP_H);
    const rng = mulberry32(5);
    const nL = periodicNoise(rng, 24), nR = periodicNoise(rng, 24), nS = periodicNoise(rng, 16);
    for (let y = OP_PEAK.y; y < OP_H; y++) {
      const d = y - OP_PEAK.y;
      const xl = OP_PEAK.x - d * 0.62 - nL(d * 0.05) * 14 * Math.min(1, d / 60);
      const xr = OP_PEAK.x + d * 0.7 + nR(d * 0.05) * 14 * Math.min(1, d / 60);
      const ridge = OP_PEAK.x + d * 0.12 + Math.sin(d * 0.03) * 6;
      const snowLine = 64 + nS((OP_PEAK.x) * 0.02) * 10;
      for (let x = Math.max(0, Math.floor(xl)); x < Math.min(VW, xr); x++) {
        const shadow = x > ridge;
        const k = clamp((y - 330) / 260, 0, 1);   // greener toward the foot
        let col = shadow ? mixColor('#5a64a8', '#2f6a4a', k) : mixColor('#8090d8', '#4a9a5a', k);
        if (hash2(x >> 1, y >> 1, 9) < 0.06) col = shade(col, -0.12);
        const snowEdge = snowLine + nS(x * 0.08) * 16;
        if (d < snowEdge) col = shadow ? '#c8d4f0' : '#f4f8ff';
        if (x < xl + 1.5 || x > xr - 1.5) col = shade(col, -0.35);
        B.put(x, y, col);
      }
    }
    // a few pines on the lower slopes
    for (let i = 0; i < 70; i++) {
      const y = 380 + Math.floor(rng() * 240), d = y - OP_PEAK.y;
      const x = Math.floor(OP_PEAK.x - d * 0.55 + rng() * d * 1.2);
      if (x < 2 || x > VW - 4) continue;
      B.rect(x + 1, y - 4, 1, 1, '#1f5a34'); B.rect(x, y - 3, 3, 2, '#2a6a3e'); B.rect(x + 1, y - 1, 1, 2, '#4a3020');
    }
    this.canvas = B.done();
    this.bg = buildBackground('meadow');
  },

  enter() {
    this.prepare();
    this.t = 0; this.state = 'wait'; this.rain = []; this.dust = []; this.shake = 0; this.flash = 0;
    this.played = {};
  },

  begin() {
    Sound.init();
    this.state = 'play'; this.t = 0;
    Sound.sfx('rumble');
  },

  finish() {
    TitleScreen.started = true;
    TitleScreen.fromOpening = true;
    Screens.now(TitleScreen);
  },

  cue(name, at, fn) { if (this.t >= at && !this.played[name]) { this.played[name] = true; fn(); } },

  update(dt) {
    if (this.state === 'wait') {
      this.t += dt;
      if (Input.any && this.t > 0.25) { Input.clearAll(); this.begin(); }
      return;
    }
    this.t += dt;
    const t = this.t;
    if (Input.any && t > 0.5) { Input.clearAll(); Sound.Music.play('title'); this.finish(); return; }
    this.cue('bolt', 2.35, () => { this.flash = 1; Sound.sfx('thunder'); this.shake = 3; });
    this.cue('screech', 2.7, () => Sound.sfx('screech'));
    this.cue('grab', 3.45, () => { Sound.sfx('nope'); this.shake = 2; });
    this.cue('bolt2', 4.2, () => { this.flash = 0.7; Sound.sfx('thunder'); });
    this.cue('bang', 6.9, () => Sound.sfx('pop'));
    this.cue('logo1', 7.45, () => { Sound.sfx('land'); this.shake = 2; });
    this.cue('logo2', 7.85, () => {
      Sound.sfx('slam'); this.shake = 6; Sound.Music.play('title');
      for (let i = 0; i < 40; i++) this.dust.push({ x: VW / 2 + rand(-90, 90), y: 64 + rand(-4, 6), vx: rand(-90, 90), vy: rand(-80, 10), life: rand(0.4, 0.9) });
    });
    if (t >= OP_END) { this.finish(); return; }
    this.shake = Math.max(0, this.shake - dt * 10);
    this.flash = Math.max(0, this.flash - dt * 2.2);
    // rain while the storm is up
    const storm = this.storm();
    if (storm > 0.2 && this.rain.length < 120 * storm) this.rain.push({ x: rand(-20, VW + 20), y: rand(-20, 0), v: rand(260, 360) });
    for (const r of this.rain) { r.x -= 70 * dt; r.y += r.v * dt; }
    this.rain = this.rain.filter((r) => r.y < VH + 10 && (storm > 0.1 || Math.random() > 0.05));
    for (const d of this.dust) { d.vy += 240 * dt; d.x += d.vx * dt; d.y += d.vy * dt; d.life -= dt; }
    this.dust = this.dust.filter((d) => d.life > 0);
  },

  storm() { const t = this.t; if (this.state === 'wait') return 0; return clamp((t - 2.35) / 0.8, 0, 1) * (1 - clamp((t - 7.85) / 0.6, 0, 1)); },
  camY() { return this.state === 'wait' ? 0 : easeInOut(clamp((this.t - 4.6) / 1.9, 0, 1)) * (OP_H - VH); },

  render() {
    const t = this.t, storm = this.storm(), camY = Math.round(this.camY());
    const clear = this.state === 'wait' ? 0 : clamp((t - 7.85) / 0.6, 0, 1);
    const sx = this.shake ? Math.round(rand(-this.shake, this.shake)) : 0, sy = this.shake ? Math.round(rand(-this.shake, this.shake)) : 0;
    // sky: night (waiting) -> dawn -> storm -> bright morning
    const dawn = this.state === 'wait' ? 0 : clamp(t / 1.2, 0, 1);
    let top = mixColor('#0c0a24', '#3a2a6a', dawn), bot = mixColor('#1c1840', '#ff9a6a', dawn);
    top = mixColor(top, '#0a0c18', storm); bot = mixColor(bot, '#262a46', storm);
    top = mixColor(top, '#3f9cf5', clear); bot = mixColor(bot, '#b8e8ff', clear);
    const g = ctx.createLinearGradient(0, 0, 0, VH); g.addColorStop(0, top); g.addColorStop(1, bot);
    ctx.fillStyle = g; ctx.fillRect(0, 0, VW, VH);
    // stars fade with the dawn
    const starA = (1 - dawn) * 0.9 + 0.1 * (1 - storm);
    for (let i = 0; i < 50; i++) {
      const x = (i * 97 + 13) % VW, y = ((i * 53) % 150) - camY * 0.1;
      if (y < 0 || Math.sin(t * 2 + i) > 0.7) continue;
      ctx.globalAlpha = starA * (1 - clear); ctx.fillStyle = '#ffffff'; ctx.fillRect(x, Math.round(y), 1, 1);
    }
    ctx.globalAlpha = 1;
    // morning sun
    if (clear > 0) { ctx.globalAlpha = clear; ctx.fillStyle = 'rgba(255,255,220,0.3)'; circle(VW - 74, 34, 18); ctx.fillStyle = '#fff4c0'; circle(VW - 74, 34, 12); ctx.globalAlpha = 1; }
    ctx.save(); ctx.translate(sx, sy - camY);
    ctx.globalAlpha = 1 - clear;
    ctx.drawImage(this.canvas, 0, 0);
    ctx.globalAlpha = 1;
    // the Dawn Gem on the summit (until it's stolen)
    const gemX = OP_PEAK.x - 8, gemY = OP_PEAK.y - 18;
    const bird = this.birdPos();
    const stolen = this.state === 'play' && t >= 3.45;
    if (!stolen) {
      const pulse = 0.5 + Math.sin(t * 3) * 0.2;
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = 0.16 * pulse * (1 - storm * 0.5); ctx.fillStyle = '#ffb040'; circle(OP_PEAK.x, gemY + 7, 30);
      ctx.globalAlpha = 0.22 * pulse * (1 - storm * 0.5); circle(OP_PEAK.x, gemY + 7, 17);
      ctx.globalAlpha = 0.55; ctx.fillStyle = '#fff4b0';
      for (let i = 0; i < 8; i++) {
        const a = t * 0.6 + (i * Math.PI) / 4, len = 18 + Math.sin(t * 4 + i) * 4;
        for (let r = 12; r < 12 + len; r += 2) ctx.fillRect(Math.round(OP_PEAK.x + Math.cos(a) * r), Math.round(gemY + 7 + Math.sin(a) * r), 1, 1);
      }
      ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
      spr(ART.dawnGem, gemX, gemY + Math.round(Math.sin(t * 2) * 1.5));
    }
    // meadow at the foot of the mountain
    // (same layers, positions and scroll as the title screen, so the hand-off is seamless)
    MenuBG.x += STEP * 14 * (this.state === 'play' ? 1 : 0);
    for (const l of MenuBG.bg.layers) {
      const y = OP_H - l.c.height + l.yOff;
      const ox = -Math.floor((MenuBG.x * l.f * 3) % l.c.width);
      for (let x = ox; x < VW; x += l.c.width) ctx.drawImage(l.c, x, y);
    }
    ctx.fillStyle = '#5cc24a'; ctx.fillRect(0, OP_H - 20, VW, 4); ctx.fillStyle = '#a4ec7a'; ctx.fillRect(0, OP_H - 20, VW, 1);
    ctx.fillStyle = '#8a5a34'; ctx.fillRect(0, OP_H - 16, VW, 16);
    // the heroes run in and look up
    if (this.state === 'play' && t > 5.9) {
      CHARACTERS.slice(0, 4).forEach((c, i) => {
        const F = ART.chars[c.id];
        const start = 5.9 + i * 0.18, k = clamp((t - start) / 0.9, 0, 1);
        const x = Math.round(lerp(-30 - i * 18, 46 + i * 30, easeOutCubic(k)));
        const running = k < 1;
        const look = t > 6.9;
        const s = running ? F.run[Math.floor(t * 12 + i) % 4] : look && i === 0 && t < 7.4 ? F.jump : F.idle[Math.floor(t * 2 + i) % 2];
        const hop = i === 0 && look && t < 7.4 ? -Math.round(Math.sin(clamp((t - 6.9) / 0.5, 0, 1) * Math.PI) * 10) : 0;
        ctx.drawImage(s.c, x, OP_H - 20 - 18 + hop);
        if (i === 0 && t > 6.9 && t < 7.6) Font.draw('!', x + 7, OP_H - 52 + hop, { color: '#ffd84a', outline: true, scale: 2 });
      });
    }
    ctx.restore();
    if (storm > 0) { ctx.globalAlpha = storm * 0.38; ctx.fillStyle = '#0a0c1e'; ctx.fillRect(0, 0, VW, VH); ctx.globalAlpha = 1; }
    // Stormbeak (screen space so it can fly off the top)
    if (bird) {
      const set = ART.boss;
      const s = [set.up, set.mid, set.down, set.mid][Math.floor(t * 12) % 4];
      const w = s.c.width * 2, h = s.c.height * 2;
      const img = bird.flip ? s.f : s.c;
      ctx.drawImage(img, Math.round(bird.x - w / 2 + sx), Math.round(bird.y - h / 2 + sy - camY), w, h);
      if (stolen) spr(ART.dawnGem, bird.x - 8 + sx, bird.y + 18 + sy - camY);
    }
    // rain + lightning
    ctx.fillStyle = 'rgba(170,200,255,0.55)';
    for (const r of this.rain) ctx.fillRect(Math.round(r.x), Math.round(r.y), 1, 6);
    if (this.flash > 0) { ctx.globalAlpha = Math.min(0.8, this.flash); ctx.fillStyle = '#eef2ff'; ctx.fillRect(0, 0, VW, VH); ctx.globalAlpha = 1; }
    // captions
    const caps = [[0.4, 2.3, 'HIGH ATOP MOUNT MOSSMORE GLOWS THE DAWN GEM.'], [2.6, 4.5, 'UNTIL ONE NIGHT, STORMBEAK SNATCHED IT AWAY!'], [4.8, 6.8, 'NOW SOMEONE SMALL HAS TO CLIMB VERY HIGH...']];
    if (this.state === 'play') for (const [a, b, text] of caps) {
      if (t < a || t > b) continue;
      const al = clamp((t - a) * 4, 0, 1) * clamp((b - t) * 4, 0, 1);
      ctx.globalAlpha = al * 0.7; ctx.fillStyle = '#0a0812'; ctx.fillRect(0, VH - 30, VW, 20); ctx.globalAlpha = 1;
      Font.draw(text.slice(0, Math.floor((t - a) * 40)), VW / 2, VH - 24, { color: '#fff4e0', align: 'center', alpha: al });
    }
    // logo slam
    if (this.state === 'play' && t > 7.2) {
      const k1 = clamp((t - 7.2) / 0.25, 0, 1), k2 = clamp((t - 7.6) / 0.25, 0, 1);
      Font.draw("MOSSY'S", VW / 2, Math.round(lerp(-30, 22, easeOutBack(k1))), { color: '#a6f27c', align: 'center', outline: '#13261b', scale: 2 });
      if (k2 > 0) Font.draw('CLIMB', VW / 2, Math.round(lerp(-60, 40, k2 * k2)), { color: '#ffd84a', align: 'center', outline: '#3a2408', scale: 4 });
      if (t > 8.0) Font.draw('A VERY TALL ADVENTURE', VW / 2, 74, { color: '#ffffff', align: 'center', outline: true, alpha: clamp((t - 8) * 3, 0, 1) });
    }
    for (const d of this.dust) { ctx.globalAlpha = clamp(d.life * 2, 0, 1); ctx.fillStyle = '#fff4d0'; ctx.fillRect(Math.round(d.x), Math.round(d.y), 2, 2); }
    ctx.globalAlpha = 1;
    // prompts
    if (this.state === 'wait') {
      ctx.fillStyle = 'rgba(10,8,18,0.35)'; ctx.fillRect(0, 0, VW, VH);
      Font.draw("MOSSY'S CLIMB", VW / 2, 92, { color: '#ffd84a', align: 'center', outline: '#3a2408', scale: 2 });
      if (Math.floor(t * 1.8) % 2 === 0) Font.draw(Input.hasTouch ? 'TAP TO START' : 'PRESS ANY KEY', VW / 2, 124, { color: '#ffffff', align: 'center', outline: true, scale: 2 });
      Font.draw('BEST WITH SOUND ON ♪', VW / 2, VH - 16, { color: '#a8a0c0', align: 'center', outline: true });
    } else if (t > 0.6 && t < 7.2) {
      Font.draw(Input.device === 'touch' ? 'TAP TO SKIP ▶' : 'ANY KEY TO SKIP ▶', VW - 8, 8, { color: '#ffffff', align: 'right', outline: true, alpha: 0.75 });
    }
  },

  // Stormbeak's flight path, in scene coordinates
  birdPos() {
    if (this.state !== 'play') return null;
    const t = this.t;
    const gem = { x: OP_PEAK.x, y: OP_PEAK.y - 24 };
    const bez = (a, b, c, k) => ({ x: (1 - k) * (1 - k) * a.x + 2 * (1 - k) * k * b.x + k * k * c.x, y: (1 - k) * (1 - k) * a.y + 2 * (1 - k) * k * b.y + k * k * c.y });
    if (t < 2.5 || t > 4.9) return null;
    if (t < 3.45) { const p = bez({ x: VW + 60, y: -40 }, { x: VW - 40, y: 120 }, gem, easeInOut((t - 2.5) / 0.95)); return { ...p, flip: true }; }
    const p = bez(gem, { x: OP_PEAK.x - 120, y: 10 }, { x: -80, y: -90 }, easeInOut((t - 3.45) / 1.45));
    return { ...p, flip: true };
  },
};

boot();
})();
</script>
